        '<span><i class="qe-sw bound"></i>已绑定文件夹（点击进文件夹）</span>'+
        '<span><i class="qe-sw"></i>未绑定（点击进台账）</span>'+
        '<span><i class="qe-sw dot"></i>有待确认的新增或变更</span>'+
      '</div></div></div>';

    host.innerHTML=h;
    $("#dashBind",host).onclick=function(){ location.hash="#/folder"; };
    $("#dashAdd",host).onclick=function(){ taskForm(null); };
    $("#dashBreak",host).onclick=breakdown;
    $("#dashExport",host).onclick=function(){ if(window.exportAllCSV) window.exportAllCSV(); };
    $$("[data-go]",host).forEach(function(b){ b.onclick=function(){ location.hash="#/"+this.getAttribute("data-go"); }; });
  }
});

window.taskForm=taskForm;
})();

</script>
<script>
/* ===== 待处理事项：独立模块（跨台账归集 + 手工登记 + 一键办结回写） ===== */
(function(){
"use strict";
var A=window.APP, $=A.$, $$=A.$$, esc=A.esc;
var DB=A.db;

/* 来源字典：标签名 + 配色 + 跳转路由 */
var SRC={
  manual:{l:"手工登记",cls:"t-gray",route:"inbox"},
  task:{l:"计划任务",cls:"t-p2",route:"plan"},
  issue:{l:"检查问题",cls:"t-red",route:"inspect"},
  review:{l:"方案内审",cls:"t-amber",route:"review"},
  briefing:{l:"技术交底",cls:"t-green",route:"brief"},
  risk:{l:"风险识别",cls:"t-red",route:"brief"},
  meeting:{l:"质量会议",cls:"t-p2",route:"meeting"},
  training:{l:"质量培训",cls:"t-green",route:"training"},
  qc:{l:"QC 课题",cls:"t-amber",route:"qc"},
  guide:{l:"作业指导书",cls:"t-gray",route:"guide"},
  policy:{l:"办法制度",cls:"t-gray",route:"policy"},
  project:{l:"项目台账",cls:"t-gray",route:"projects"},
  filedir:{l:"文件夹新增",cls:"t-amber",route:"folder"}
};
var LVL={year:"年度目标",month:"月度目标",week:"周任务",day:"日待办"};

function ensure(){
  if(!Array.isArray(DB.inbox)) DB.inbox=[];
  if(!Array.isArray(DB.inboxIgnore)) DB.inboxIgnore=[];
}
ensure();

function pname(id){ var p=(DB.projects||[]).filter(function(x){return x.id===id;})[0]; return p?p.name:""; }
function pick(arr,id){ return (arr||[]).filter(function(x){return x.id===id;})[0]; }
function ownerPool(){
  var m={};
  (DB.orgs||[]).forEach(function(o){ if(o.name) m[o.name]=1; });
  (DB.tasks||[]).forEach(function(t){ if(t.owner) m[t.owner]=1; });
  return Object.keys(m);
}

/* ---------- 归集 ---------- */
function gather(){
  var today=A.todayStr(), end=A.addDays(today,7), out=[];

  /* 1 手工登记 */
  (DB.inbox||[]).forEach(function(m){
    if(m.status==="done") return;
    out.push({key:"manual:"+m.id,src:"manual",title:m.title,owner:m.owner,due:m.due,prio:m.priority||"P1",
      route:"inbox",note:m.note||"",raw:m,rawId:m.id,act:{l:"标记已办",verb:"done"}});
  });

  /* 2 计划任务：近 7 天到期，或已发生顺延 */
  (DB.tasks||[]).forEach(function(t){
    if(t.status==="done"||!t.due) return;
    if(!(t.due<=end||(t.carried||0)>0)) return;
    var note=[];
    if(t.carried) note.push("已顺延 "+t.carried+" 次"+(t.originDue?"（原截止 "+t.originDue+"）":""));
    if(t.level) note.push(LVL[t.level]||t.level);
    if(t.period) note.push("周期 "+t.period);
    out.push({key:"task:"+t.id,src:"task",title:t.title,owner:t.owner,due:t.due,prio:t.priority,
      route:"plan",note:note.join(" · "),raw:t,rawId:t.id,act:{l:"标记完成",verb:"done"}});
  });

  /* 3 检查问题未闭环 */
  (DB.issues||[]).forEach(function(w){
    if(w.status==="已闭环") return;
    out.push({key:"issue:"+w.id,src:"issue",title:(w.no?w.no+"　":"")+w.desc,
      owner:w.owner,due:w.deadline,prio:(w.level==="严重"?"P0":"P1"),route:"inspect",
      note:[pname(w.projectId),w.requirement?("要求："+w.requirement):""].filter(Boolean).join(" · "),
      raw:w,rawId:w.id,act:{l:"标记闭环",verb:"done"}});
  });

  /* 4 方案内审未闭环 */
  (DB.reviews||[]).forEach(function(r){
    if(r.closure==="已闭环") return;
    out.push({key:"review:"+r.id,src:"review",title:r.title,owner:r.reviewer,due:"",
      prio:"P1",route:"review",
      note:[r.type,r.level,r.date?("内审 "+r.date):"",r.conclusion,"意见 "+r.count+" 条","闭环："+r.closure].filter(Boolean).join(" · "),
      raw:r,rawId:r.id,act:{l:"标记闭环",verb:"done"}});
  });

  /* 5 技术交底待开展 */
  (DB.briefings||[]).forEach(function(b){
    if(b.status==="已归档"||b.status==="已交底") return;
    out.push({key:"briefing:"+b.id,src:"briefing",title:b.title,owner:b.briefer,due:b.date,
      prio:"P0",route:"brief",note:[b.level,pname(b.projectId),b.note||""].filter(Boolean).join(" · "),
      raw:b,rawId:b.id,act:{l:"标记已交底",verb:"done"}});
  });

  /* 6 风险未受控 */
  (DB.risks||[]).forEach(function(k){
    if(k.status!=="未受控") return;
    out.push({key:"risk:"+k.id,src:"risk",title:k.title,owner:k.owner,due:"",prio:"P0",route:"brief",
      note:[pname(k.projectId),k.cat,"等级 "+k.level,k.measure||""].filter(Boolean).join(" · "),
      raw:k,rawId:k.id,act:{l:"标记已受控",verb:"done"}});
  });

  /* 7 质量会议待召开 */
  (DB.meetings||[]).forEach(function(m){
    if(m.status!=="待召开") return;
    out.push({key:"meeting:"+m.id,src:"meeting",title:m.title,owner:m.host,due:m.date,prio:"P1",
      route:"meeting",note:[m.level,m.place||""].filter(Boolean).join(" · "),
      raw:m,rawId:m.id,act:{l:"标记已召开",verb:"done"}});
  });

  /* 8 质量培训待开展 */
  (DB.trainings||[]).forEach(function(t){
    if(t.status!=="待开展") return;
    out.push({key:"training:"+t.id,src:"training",title:t.title,owner:t.teacher,due:t.date,prio:"P1",
      route:"training",note:[t.form,t.cover||"",t.hours?(t.hours+" 学时"):""].filter(Boolean).join(" · "),
      raw:t,rawId:t.id,act:{l:"标记已开展",verb:"done"}});
  });

  /* 9 QC 课题未结题 */
  (DB.qcs||[]).forEach(function(q){
    if(q.status==="已结题") return;
    out.push({key:"qc:"+q.id,src:"qc",title:"QC 课题未结题："+q.title,owner:q.leader,due:"",prio:"P1",
      route:"qc",note:["阶段 "+q.stage,"完成率 "+Math.round((q.rate||0)*100)+"%",q.target||""].filter(Boolean).join(" · "),
      raw:q,rawId:q.id,act:{l:"标记结题",verb:"done"}});
  });

  /* 10 作业指导书修订中 */
  (DB.guides||[]).forEach(function(g){
    if(g.status!=="修订中") return;
    out.push({key:"guide:"+g.id,src:"guide",title:"作业指导书待定稿："+g.title,owner:g.editor,due:"",prio:"P2",
      route:"guide",note:[g.major,g.version].filter(Boolean).join(" · "),
      raw:g,rawId:g.id,act:{l:"标记已定稿",verb:"done"}});
  });

  /* 11 办法制度修订中 */
  (DB.policies||[]).forEach(function(y){
    if(y.status!=="修订中") return;
    out.push({key:"policy:"+y.id,src:"policy",title:"制度待发布："+y.title,owner:y.issuer,due:"",prio:"P2",
      route:"policy",note:[y.docNo,y.scope||""].filter(Boolean).join(" · "),
      raw:y,rawId:y.id,act:{l:"标记已发布",verb:"done"}});
  });

  /* 12 在建项目缺项（缺内审 / 缺公司级交底） */
  (DB.projects||[]).forEach(function(p){
    if(p.status!=="施工实施") return;
    var hasRev=(DB.reviews||[]).some(function(r){return r.projectId===p.id;});
    var hasBrf=(DB.briefings||[]).some(function(b){return b.projectId===p.id;});
    if(!hasRev) out.push({key:"prjrev:"+p.id,src:"project",title:"未做方案内审："+p.name,
      owner:p.owner,due:"",prio:"P1",route:"projects",note:"合同额 "+p.amount+" 万元 · 开工 "+p.start,
      raw:p,rawId:p.id,act:null});
    if(!hasBrf) out.push({key:"prjbrf:"+p.id,src:"project",title:"缺公司级技术交底："+p.name,
      owner:p.owner,due:"",prio:"P1",route:"projects",note:"开工前须完成三级交底 · 开工 "+p.start,
      raw:p,rawId:p.id,act:null});
  });

  /* 14 本地文件夹新增/变更（来自快速入口绑定） */
  if(window.QD&&window.QD.inboxItems){
    try{ window.QD.inboxItems().forEach(function(it){ out.push(it); }); }catch(e){}
  }
  /* v1.9：解析失败 / 扫描件待补录 / 待采纳解析结果 */
  if(window.IMPORT&&window.IMPORT.inboxItems){
    try{ window.IMPORT.inboxItems().forEach(function(it){ out.push(it); }); }catch(e){}
  }

  return out;
}

/* ---------- 紧急度 ---------- */
function urg(it,today){
  if(!it.due) return {rank:4,cls:"t-gray",txt:"无期限",over:false};
  var dd=A.diffDays(today,it.due);
  if(dd<0) return {rank:0,cls:"t-red",txt:"逾期 "+(-dd)+" 天",over:true};
  if(dd===0) return {rank:1,cls:"t-red",txt:"今日到期",over:false};
  if(dd<=3) return {rank:2,cls:"t-amber",txt:dd+" 天后",over:false};
  if(dd<=7) return {rank:3,cls:"t-p2",txt:dd+" 天后",over:false};
  return {rank:5,cls:"t-gray",txt:dd+" 天后",over:false};
}
var PRIO={P0:0,P1:1,P2:2};
function cmp(a,b){
  if(a.urg.rank!==b.urg.rank) return a.urg.rank-b.urg.rank;
  if(a.due&&b.due&&a.due!==b.due) return a.due<b.due?-1:1;
  if(!a.due&&b.due) return 1;
  if(a.due&&!b.due) return -1;
  var pa=PRIO[a.prio]!==undefined?PRIO[a.prio]:3, pb=PRIO[b.prio]!==undefined?PRIO[b.prio]:3;
  if(pa!==pb) return pa-pb;
  return String(a.title).localeCompare(String(b.title));
}

function openItems(){
  var today=A.todayStr(), ign=DB.inboxIgnore||[];
  var arr=gather().filter(function(it){ return ign.indexOf(it.key)<0; });
  arr.forEach(function(it){
    it.urg=urg(it,today);
    it.srcName=(SRC[it.src]||{l:it.src}).l;
    it.urgTxt=it.urg.txt; it.urgCls=it.urg.cls;
  });
  arr.sort(cmp);
  return arr;
}
window.inboxItems=openItems;
window.inboxCount=function(){ return openItems().length; };

/* ---------- 办结回写 ---------- */
function complete(it, silent){
  var today=A.todayStr(), r=it.raw;
  switch(it.src){
    case "manual":   r.status="done"; r.doneAt=today; break;
    case "task":     r.status="done"; r.doneAt=today; break;
    case "issue":
      r.status="已闭环"; r.finishDate=today;
      var insp=pick(DB.inspections,r.inspectionId);
      if(insp){
        var n=(DB.issues||[]).filter(function(w){return w.inspectionId===insp.id&&w.status==="已闭环";}).length;
        insp.fixedCount=n;
        insp.fixStatus=(n>=(insp.issueCount||0))?"已闭环":"整改中";
      }
      break;
    case "review":   r.closure="已闭环"; break;
    case "briefing": r.status="已交底"; break;
    case "risk":     r.status="已受控"; break;
    case "meeting":  r.status="已归档"; break;
    case "training": r.status="已归档"; break;
    case "qc":       r.status="已结题"; r.rate=1; break;
    case "guide":    r.status="有效"; break;
    case "policy":   r.status="现行"; break;
    case "import":
      return true;
    case "filedir":
      if(window.QD&&r&&r.route){
        /* v1.8：确认 = 清计数 + 归档进文件中心（与文件夹总览同一动作） */
        var res=window.QD.confirmFiles(r.route,[r.rel],{silent:true});
        if(res&&res.ok&&res.snap) confirmSnaps.push(res.snap);
      }else return false;
      break;
    default: return false;
  }
  if(!silent) A.save();
  return true;
}

function ignore(key){
  ensure();
  if(DB.inboxIgnore.indexOf(key)<0) DB.inboxIgnore.push(key);
  A.save();
}
function unignore(key){
  DB.inboxIgnore=(DB.inboxIgnore||[]).filter(function(k){return k!==key;});
  A.save();
}

/* ---------- 手工登记表单 ---------- */
var M_FIELDS=[
  {k:"title",l:"事项内容",req:true,full:true,ph:"如：催收罗田项目整改回复单盖章扫描件"},
  {k:"owner",l:"负责人",t:"datalist",opts:[],ph:"选择或输入姓名"},
  {k:"due",l:"截止日期",t:"date"},
  {k:"priority",l:"优先级",t:"select",opts:[["P0","P0 紧急"],["P1","P1 重要"],["P2","P2 一般"]]},
  {k:"note",l:"说明",t:"textarea",full:true,ph:"来源、要求、对接人等"}
];
function manualForm(id){
  ensure();
  var row=id?(DB.inbox.filter(function(m){return m.id===id;})[0]||{}):{priority:"P1",due:A.addDays(A.todayStr(),3)};
  var fields=M_FIELDS.map(function(f){
    var c=Object.assign({},f);
    if(f.k==="owner") c.opts=ownerPool();
    if(!f.req && f.k==="priority") c.def="P1";
    return c;
  });
  window.openModal({
    title:id?"编辑待处理事项":"新增待处理事项",
    body:window.formHTML(fields,row),
    okText:"保存",
    onOk:function(scope){
      var d=window.readForm(scope,fields);
      if(!d.title||!String(d.title).trim()){ toast("请填写事项内容","err"); return false; }
      if(id){
        var i=DB.inbox.findIndex(function(m){return m.id===id;});
        if(i>=0) DB.inbox[i]=Object.assign({},DB.inbox[i],d,{title:String(d.title).trim()});
      }else{
        DB.inbox.push({id:A.uid("ib"),title:String(d.title).trim(),owner:d.owner||"",due:d.due||"",
          priority:d.priority||"P1",note:d.note||"",status:"open",createdAt:A.todayStr()});
      }
      A.save(); toast(id?"已更新":"已新增","ok"); render("inbox");
    }
  });
}
window.manualForm=manualForm;

/* ---------- 打印 / 导出 ---------- */
function printList(rows){
  if(!window.printHTML){ toast("打印模块未加载","err"); return; }
  var body='<table><thead><tr>'+
    '<th style="width:34px">序号</th><th>事项内容</th><th style="width:74px">来源</th>'+
    '<th style="width:66px">负责人</th><th style="width:78px">截止日期</th>'+
    '<th style="width:72px">紧急度</th><th style="width:150px">备注</th></tr></thead><tbody>';
  rows.forEach(function(it,i){
    body+='<tr><td class="c">'+(i+1)+'</td><td>'+esc(it.title)+'</td>'+
      '<td class="c">'+esc((SRC[it.src]||{l:it.src}).l)+'</td>'+
      '<td class="c">'+esc(it.owner||"—")+'</td>'+
      '<td class="c">'+esc(it.due||"—")+'</td>'+
      '<td class="c">'+esc(it.urgTxt||"—")+'</td>'+
      '<td>'+esc(it.note||"")+'</td></tr>';
  });
  body+='</tbody></table><div class="note">说明：本清单由质量管理台账工作台自动归集，办结后请回原台账复核。</div>';
  window.printHTML("待处理事项清单",body,"共 "+rows.length+" 项　其中逾期 "+rows.filter(function(x){return x.urg.over;}).length+" 项");
}
function exportList(rows){
  window.exportCSV("inbox",{title:"待处理事项",cols:[
    {k:"title",l:"事项"},{k:"srcName",l:"来源"},{k:"owner",l:"负责人"},
    {k:"due",l:"截止日期"},{k:"urgTxt",l:"紧急度"},{k:"prio",l:"优先级"},{k:"note",l:"备注"}
  ]},rows);
}

/* ---------- 页面 ---------- */
var view={tab:"open",src:"all",owner:"all",q:"",sel:{}};
/* 一次性撤销快照：只存内存，再次批量或离开页面即失效 */
var undoState=null;
/* 文件确认产生的归档记录，随本次批量操作收集，撤销时一并回退 */
var confirmSnaps=[];

function canDo(it){ return !!(it&&it.act); }
function skipReason(it){
  if(!it) return "该事项不支持一键办结";
  if(it.src==="project") return "需到「在建项目业务清单」补做内审或公司级交底";
  if(it.src==="filedir") return "文件夹条目已失效，请刷新索引";
  return "该事项不支持一键办结";
}
var SRC2COL={manual:"inbox",task:"tasks",issue:"issues",review:"reviews",briefing:"briefings",
  risk:"risks",meeting:"meetings",training:"trainings",qc:"qcs",guide:"guides",policy:"policies"};
function findRec(src,id){
  var arr=DB[SRC2COL[src]]||[];
  return arr.filter(function(x){return x.id===id;})[0]||null;
}
function snapshot(it){
  if(it.src==="filedir"){
    var c=(window.QD&&it.raw&&it.raw.route)?window.QD.cfgOf(it.raw.route):null;
    return {k:it.key,src:"filedir",route:it.raw?it.raw.route:"",rel:it.raw?it.raw.rel:"",
      seen:c?(c.seen||{})[it.raw.rel]:undefined};
  }
  return {k:it.key,src:it.src,rawId:it.rawId,raw:JSON.parse(JSON.stringify(it.raw||{}))};
}
function restoreSnap(snap){
  var n=0;
  (snap||[]).forEach(function(s){
    if(s.src==="filedir"){
      if(!window.QD||!s.route||!s.rel) return;
      var c=window.QD.cfgOf(s.route);
      if(!c.seen) c.seen={};
      if(s.seen===undefined) delete c.seen[s.rel]; else c.seen[s.rel]=s.seen;
      c.ack=(c.ack||[]).filter(function(r){return r!==s.rel;});
      if(window.QD._recount) window.QD._recount(c);
      n++; return;
    }
    var cur=findRec(s.src,s.rawId);
    if(!cur) return;
    Object.keys(cur).forEach(function(k){ if(!(k in s.raw)) delete cur[k]; });
    Object.keys(s.raw).forEach(function(k){ cur[k]=s.raw[k]; });
    n++;
  });
  A.save();
  return n;
}
function bulkComplete(sel, wholeList, allCan){
  var can=(sel||[]).filter(canDo);
  var plain=wholeList||[];
  var all=allCan||can;
  /* 只有把可办结项全选时，才提示被跳过的项，避免只选几条时报告干扰 */
  var skip=(can.length===all.length)?plain.filter(function(x){ return !canDo(x); }):[];
  if(!can.length){ toast("当前列表没有可办结的事项","err"); return; }
  var bySrc={};
  can.forEach(function(x){ bySrc[x.src]=(bySrc[x.src]||0)+1; });
  var sum=Object.keys(bySrc).map(function(k){ return (SRC[k]||{l:k}).l+" "+bySrc[k]+" 项"; }).join("、");
  var skipTxt="";
  if(skip.length){
    var reasons={};
    skip.forEach(function(x){ var r=skipReason(x); reasons[r]=(reasons[r]||0)+1; });
    skipTxt='<p style="margin:10px 0 0;font-size:12.5px;color:#b9770e;line-height:1.8">将跳过 '+skip.length+' 项：'+
      Object.keys(reasons).map(function(r){ return esc(r)+"（"+reasons[r]+" 项）"; }).join("；")+'</p>';
  }
  window.openModal({
    title:"批量办结",
    okText:"办结 "+can.length+" 项",
    body:'<p style="margin:0 0 8px">本次将办结 <b>'+can.length+'</b> 项，按来源：'+esc(sum)+'。</p>'+
      '<p style="margin:0;font-size:12.5px;color:var(--muted);line-height:1.8">办结会直接改写对应台账的状态与完成日期，'+
      '检查问题会同步重算所属检查单的整改数。完成后可撤销 1 次（再次批量办结或刷新页面即失效）。</p>'+skipTxt,
    onOk:function(){
      var snap=can.map(snapshot);
      confirmSnaps=[];
      can.forEach(function(it){ complete(it,true); });
      A.save();
      undoState={at:Date.now(),snap:snap,n:can.length,conf:confirmSnaps.slice()};
      confirmSnaps=[];
      view.sel={};
      toast("已办结 "+can.length+" 项，原台账已同步","ok");
      window.render("inbox");
    }
  });
}
function undoBulk(){
  if(!undoState) return;
  var conf=undoState.conf||[];
  var n=restoreSnap(undoState.snap);
  /* 文件条目：先还原 seen（restoreSnap 已做），再删掉本次写进文件中心的记录 */
  if(conf.length&&window.QD) window.QD.undoConfirm(conf,false);
  undoState=null;
  confirmSnaps=[];
  view.sel={};
  toast("已撤销 "+n+" 项，状态已恢复","ok");
  window.render("inbox");
}

window.regPage("inbox",{
  sub:"12 类台账的待办自动汇到这里，办结后原台账同步更新",
  render:function(host){
    ensure();
    var today=A.todayStr();

    function draw(){
      var all=gather();
      var ign=DB.inboxIgnore||[];
      var isIgn=function(k){return ign.indexOf(k)>=0;};
      var open=openItems();
      var ignored=all.filter(function(it){return isIgn(it.key);}).map(function(it){
        it.urg=urg(it,today); it.srcName=(SRC[it.src]||{l:it.src}).l;
        it.urgTxt=it.urg.txt; it.urgCls=it.urg.cls; return it;
      });

      var nOver=open.filter(function(x){return x.urg.rank===0;}).length;
      var nToday=open.filter(function(x){return x.urg.rank===1;}).length;
      var weekEnd=A.addDays(today,7);
      var nWeek=open.filter(function(x){return x.due&&x.due>=today&&x.due<=weekEnd;}).length;

      /* KPI */
      var h="";
      if(undoState){
        h+='<div class="undo-bar"><span>已办结 <b>'+undoState.n+'</b> 项，原台账状态与完成日期已同步变更</span>'+
          '<div class="spacer"></div>'+
          '<button class="btn sm" id="ibUndo">撤销</button>'+
          '<button class="btn sm ghost" id="ibUndoX">知道了</button></div>';
      }
      h+='<div class="grid g4" style="margin-bottom:14px">'+
        '<div class="card kpi"><div class="k">待处理合计</div><div class="v">'+open.length+'<small>项</small></div>'+
          '<div class="d">手工登记 '+(DB.inbox.filter(function(m){return m.status!=="done";}).length)+' 项</div></div>'+
        '<div class="card kpi"><div class="k">已逾期</div><div class="v" style="color:#c0392b">'+nOver+'<small>项</small></div>'+
          '<div class="d">'+(nOver?"需优先处理":"无逾期")+'</div></div>'+
        '<div class="card kpi"><div class="k">今日到期</div><div class="v" style="color:#b9770e">'+nToday+'<small>项</small></div>'+
          '<div class="d">今天 '+today+'</div></div>'+
        '<div class="card kpi"><div class="k">本周到期</div><div class="v">'+nWeek+'<small>项</small></div>'+
          '<div class="d">含今日，截至 '+weekEnd+'</div></div>'+
      '</div>';

      /* 工具条 */
      var tabs=[["open","全部待办",open.length],["over","已逾期",nOver],["today","今日到期",nToday],
                ["week","本周到期",nWeek],["ign","已忽略",ignored.length]];
      var srcCount={};
      open.forEach(function(it){ srcCount[it.src]=(srcCount[it.src]||0)+1; });
      var srcOpts='<option value="all">全部来源</option>'+Object.keys(SRC).filter(function(k){return srcCount[k];})
        .map(function(k){return '<option value="'+k+'"'+(view.src===k?" selected":"")+'>'+esc(SRC[k].l)+'（'+srcCount[k]+'）</option>';}).join("");
      var ownSet={}; open.forEach(function(it){ ownSet[it.owner||"未指派"]=1; });
      var ownOpts='<option value="all">全部负责人</option>'+Object.keys(ownSet).sort()
        .map(function(k){return '<option value="'+esc(k)+'"'+(view.owner===k?" selected":"")+'>'+esc(k)+'</option>';}).join("");

      h+='<div class="card"><div class="card-h"><h3>待处理清单</h3>'+
        '<span class="hint">办结后自动回写原台账</span><div class="spacer"></div>'+
        '<button class="btn primary" id="ibAdd">+ 新增事项</button>'+
        '<button class="btn" id="ibPrint">打印清单</button>'+
        '<button class="btn" id="ibExport">导出 CSV</button></div>'+
        '<div class="card-b" style="padding-bottom:0">'+
        '<div class="toolbar" style="margin-bottom:10px">'+
          '<div class="tabs">'+tabs.map(function(t){
            return '<button class="tab'+(view.tab===t[0]?" active":"")+'" data-tab="'+t[0]+'">'+t[1]+' '+
              '<span style="opacity:.65">'+t[2]+'</span></button>';
          }).join("")+'</div>'+
          '<select id="ibSrc" style="max-width:190px">'+srcOpts+'</select>'+
          '<select id="ibOwn" style="max-width:150px">'+ownOpts+'</select>'+
          '<div class="search"><input type="search" id="ibQ" placeholder="搜索事项、备注" value="'+esc(view.q)+'"></div>'+
        '</div>';

      /* 过滤 */
      var list=(view.tab==="ign")?ignored:open;
      if(view.tab==="over") list=list.filter(function(x){return x.urg.rank===0;});
      else if(view.tab==="today") list=list.filter(function(x){return x.urg.rank===1;});
      else if(view.tab==="week") list=list.filter(function(x){return x.due&&x.due>=today&&x.due<=weekEnd;});
      if(view.src!=="all") list=list.filter(function(x){return x.src===view.src;});
      if(view.owner!=="all") list=list.filter(function(x){return (x.owner||"未指派")===view.owner;});
      if(view.q){
        var q=view.q.toLowerCase();
        list=list.filter(function(x){ return (x.title+" "+(x.note||"")+" "+(x.owner||"")).toLowerCase().indexOf(q)>=0; });
      }

      /* 勾选：只保留仍在当前列表中的可办结项 */
      var canList=list.filter(canDo);
      if(view.tab==="ign") view.sel={};
      else Object.keys(view.sel).forEach(function(k){
        if(!canList.some(function(x){return x.key===k;})) delete view.sel[k];
      });
      var selN=canList.filter(function(x){return view.sel[x.key];}).length;

      /* 批量栏：已忽略页不显示 */
      if(view.tab!=="ign"){
        h+='<div class="ib-bulk">'+
          '<label class="ib-all"><input type="checkbox" id="ibSelAll"'+
            (canList.length&&selN===canList.length?" checked":"")+
            (canList.length?"":" disabled")+'> 全选当前列表</label>'+
          '<span class="ib-cnt">已选 <b>'+selN+'</b> / 可办 <b>'+canList.length+'</b> 项</span>'+
          '<div class="spacer"></div>'+
          '<button class="btn sm primary" id="ibBulk"'+(selN?"":" disabled")+'>办结所选（'+selN+'）</button>'+
          '<button class="btn sm ghost" id="ibSelClear"'+(selN?"":" disabled")+'>取消全部勾选</button>'+
        '</div>';
      }

      /* 分组渲染 */
      var groups=[
        {t:"已逾期",f:function(u){return u.rank===0;}},
        {t:"今日到期",f:function(u){return u.rank===1;}},
        {t:"3 天内",f:function(u){return u.rank===2;}},
        {t:"本周内",f:function(u){return u.rank===3;}},
        {t:"更远期",f:function(u){return u.rank===5;}},
        {t:"无期限（需补计划）",f:function(u){return u.rank===4;}}
      ];
      var html="";
      if(!list.length){
        html='<div class="empty">'+(view.tab==="ign"?"没有忽略记录":"没有符合条件的待处理事项")+'</div>';
      }else{
        groups.forEach(function(g){
          var rows=list.filter(function(x){return g.f(x.urg);});
          if(!rows.length) return;
          html+='<div class="grp-h">'+esc(g.t)+' <span class="n">'+rows.length+' 项</span></div>';
          rows.forEach(function(it){ html+=rowHTML(it,view.tab==="ign",!!view.sel[it.key]); });
        });
      }
      h+=html+'</div>';

      /* 规则说明 */
      h+='<div class="card-b" style="border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.85">'+
        '<b style="color:var(--ink-2)">归集规则：</b>计划任务取近 7 天到期与已顺延项；检查问题取未闭环；方案内审取未闭环；'+
        '技术交底取待交底；风险取未受控；在建项目取施工中缺内审或缺公司级交底；作业指导书、制度取修订中；QC 取未结题。<br>'+
        '<b style="color:var(--ink-2)">办结回写：</b>点「标记…」直接改写对应台账的状态与完成日期，检查问题会同步重算所属检查单的整改数。<br>'+
        '<b style="color:var(--ink-2)">批量办结：</b>勾选左侧圆点（或点「全选当前列表」）后点「办结所选」，只对当前筛选结果生效；'+
        '不支持一键办结的项会自动跳过，完成后可撤销 1 次。<br>'+
        '<b style="color:var(--ink-2)">忽略：</b>不删除任何记录，只从本清单隐藏，可在「已忽略」页恢复。'+
      '</div></div>';

      host.innerHTML=h;

      /* 事件 */
      $("#ibAdd",host).onclick=function(){ manualForm(null); };
      $("#ibPrint",host).onclick=function(){ printList(list); };
      $("#ibExport",host).onclick=function(){ exportList(list); };
      $$("[data-tab]",host).forEach(function(b){
        b.onclick=function(){ view.tab=this.getAttribute("data-tab"); draw(); };
      });
      $("#ibSrc",host).onchange=function(){ view.src=this.value; draw(); };
      $("#ibOwn",host).onchange=function(){ view.owner=this.value; draw(); };
      var sa=$("#ibSelAll",host);
      if(sa){
        sa.indeterminate=(selN>0&&selN<canList.length);
        sa.onchange=function(){
          if(this.checked){ canList.forEach(function(x){ view.sel[x.key]=1; }); }
          else view.sel={};
          draw();
        };
      }
      var bulk=$("#ibBulk",host);
      if(bulk) bulk.onclick=function(){
        bulkComplete(canList.filter(function(x){return view.sel[x.key];}),list,canList);
      };
      var clr=$("#ibSelClear",host);
      if(clr) clr.onclick=function(){ view.sel={}; draw(); };
      var ub=$("#ibUndo",host);
      if(ub) ub.onclick=function(){ undoBulk(); };
      var ux=$("#ibUndoX",host);
      if(ux) ux.onclick=function(){ undoState=null; draw(); };
      var q=$("#ibQ",host);
      if(q){
        var timer=null;
        q.oninput=function(){
          var v=this.value; clearTimeout(timer);
          timer=setTimeout(function(){ view.q=v; draw(); var el=$("#ibQ"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } },260);
        };
      }
      $$("[data-k]",host).forEach(function(rowEl){
        var key=rowEl.getAttribute("data-k");
        var item=all.filter(function(x){return x.key===key;})[0];
        if(!item) return;
        $$("[data-done]",rowEl).forEach(function(d){
          if(d.getAttribute("data-done")!=="1") return;
          d.onclick=function(e){ e.stopPropagation(); doComplete(item,draw); };
        });
        $$("[data-sel]",rowEl).forEach(function(d){
          if(d.getAttribute("data-sel")!=="1") return;
          d.onclick=function(e){
            e.stopPropagation();
            if(view.sel[key]) delete view.sel[key]; else view.sel[key]=1;
            draw();
          };
        });
        var j=$("[data-jump]",rowEl);
        if(j) j.onclick=function(){
          var rt=(SRC[item.src]||{}).route||"dash";
          if(item.src==="filedir"&&item.raw&&item.raw.route) rt="folder?r="+encodeURIComponent(item.raw.route);
          location.hash="#/"+rt;
        };
        var ed=$("[data-edit]",rowEl);
        if(ed) ed.onclick=function(){ manualForm(item.rawId); };
        var dl=$("[data-del]",rowEl);
        if(dl) dl.onclick=function(){
          window.openModal({title:"删除事项",body:'<p style="margin:0">确定删除「<b>'+esc(item.title)+'</b>」？</p>',
            okText:"删除",onOk:function(){
              DB.inbox=DB.inbox.filter(function(m){return m.id!==item.rawId;});
              A.save(); toast("已删除","ok"); draw();
            }});
        };
        var ig=$("[data-ig]",rowEl);
        if(ig) ig.onclick=function(e){ e.stopPropagation(); ignore(key); toast("已忽略，可在「已忽略」恢复","ok"); draw(); };
        var un=$("[data-unig]",rowEl);
        if(un) un.onclick=function(){ unignore(key); toast("已恢复","ok"); draw(); };
      });
    }

    draw();
  }
});

function rowHTML(it,isIgnored,isSel){
  var s=SRC[it.src]||{l:it.src,cls:"t-gray"};
  var pickable=!isIgnored&&canDo(it);
  var meta=[];
  meta.push('<span class="tag '+s.cls+'">'+esc(s.l)+'</span>');
  if(it.prio) meta.push('<span class="tag t-'+String(it.prio).toLowerCase()+'">'+esc(it.prio)+'</span>');
  meta.push('<span>'+esc(it.owner||"未指派")+'</span>');
  meta.push('<span>截止 '+(it.due?esc(it.due):"未设")+'</span>');
  meta.push('<span class="'+(it.urg.over?"ovd":"")+'">'+esc(it.urg.txt)+'</span>');
  if(it.note) meta.push('<span style="color:#8a99ab">'+esc(it.note)+'</span>');

  var acts="";
  if(isIgnored){
    acts='<button class="btn sm" data-unig="1">恢复</button><button class="btn sm" data-jump="1">去处理</button>';
  }else{
    if(it.act) acts+='<button class="btn sm" data-done="1">'+esc(it.act.l)+'</button>';
    acts+='<button class="btn sm" data-jump="1">去处理</button>';
    if(it.src==="manual"){
      acts+='<button class="btn sm" data-edit="1">编辑</button>'+
            '<button class="btn sm ghost" data-del="1">删除</button>';
    }else{
      acts+='<button class="btn sm ghost" data-ig="1">忽略</button>';
    }
  }

  var chk='<div class="chk'+(isSel&&pickable?" checked":"")+(pickable?"":" disabled")+'"'+
    (pickable?' data-sel="1" title="勾选后可批量办结"':' title="该事项需到原台账处理"')+
    '>✓</div>';

  return '<div class="task-row'+(it.urg.over?" overdue":"")+(isSel&&pickable?" sel":"")+'" data-k="'+esc(it.key)+'">'+
    chk+
    '<div class="body">'+
      '<div class="t-title">'+esc(it.title)+'</div>'+
      '<div class="t-meta">'+meta.join("")+'</div>'+
      '<div class="row-actions" style="margin-top:7px">'+acts+'</div>'+
    '</div></div>';
}

function doComplete(it,after){
  if(!it.act){ toast("该事项需到原台账处理","err"); return; }
  /* v1.9：解析类事项直接跳到对应动作，不弹「确认办结」 */
  if(it.src==="import"){
    var fid=it.raw&&it.raw.fileId;
    if(!fid||!window.IMPORT) return;
    var fr=(DB.files||[]).filter(function(x){ return x.id===fid; })[0];
    if(fr&&fr.parse&&fr.parse.state==="preview") window.IMPORT.preview(fid);
    else window.IMPORT.reparse(fid);
    if(after) after();
    return;
  }
  var label=it.act.l;
  var isFD=(it.src==="filedir"&&it.raw&&it.raw.route);
  var mod=isFD&&window.QD?window.QD.modOfRoute(it.raw.route):"";
  window.openModal({
    title:label,
    body:'<p style="margin:0 0 8px">确认对「<b>'+esc(it.title)+'</b>」执行<b>'+esc(label)+'</b>？</p>'+
      '<p style="margin:0;font-size:12.5px;color:var(--muted)">'+
      (isFD
        ? '确认后清空该文件的待确认计数，并在「文件中心」归档一条记录（归入 '+esc(mod)+
          '，指向本地原件，不复制文件）。'
        : '将同步改写「'+esc((SRC[it.src]||{l:it.src}).l)+'」台账的状态与完成日期。')+
      '</p>',
    okText:label,
    onOk:function(){
      confirmSnaps=[];
      if(complete(it)){ toast(isFD?"已确认并归档到文件中心":"已办结，原台账已同步","ok"); if(after) after(); }
      else toast("该事项不支持一键办结","err");
    }
  });
}
window.inboxComplete=doComplete;
})();

</script>
<script>
/* ===== 12 类台账模块 ===== */
(function(){
"use strict";
var A=window.APP, $=A.$, $$=A.$$, esc=A.esc;

function DB(){return A.db;}
function trunc(s,n){ s=String(s||""); return s.length>n?s.slice(0,n)+"…":s; }
function projName(id){ var p=DB().projects.filter(function(x){return x.id===id;})[0]; return p?p.name:""; }
function projOpts(){ return DB().projects.map(function(p){return [p.id,trunc(p.name,26)];}); }
function projShort(id){
  var n=projName(id); if(!n) return '<span style="color:#b6c0cc">—</span>';
  return '<span title="'+esc(n)+'">'+esc(trunc(n,16))+'</span>';
}
function tag(text,cls){ return text?'<span class="tag '+cls+'">'+esc(text)+'</span>':'<span style="color:#b6c0cc">—</span>'; }

/* ---------- 1. 每月质量会议 ---------- */
A.regSchema("meetings",{
  title:"质量会议",prefix:"m",key:"meetings",
  sortBy:"date",
  cols:[
    {k:"title",l:"会议主题",w:210,fmt:function(v,r){return '<div class="cell-main">'+esc(trunc(v,40))+'</div><div class="cell-sub">'+esc(r.place||"")+'</div>';}},
    {k:"date",l:"日期",w:100},
    {k:"form",l:"形式",w:80,fmt:function(v){return tag(v,"t-gray");}},
    {k:"host",l:"主持人",w:80},
    {k:"people",l:"参会人次",w:80,num:true},
    {k:"content",l:"主要内容",w:240,fmt:function(v){return '<span style="font-size:12.5px;color:var(--ink-2)">'+esc(trunc(v,52))+'</span>';}},
    {k:"status",l:"状态",w:80,fmt:function(v){return tag(v,v==="已归档"?"t-green":"t-amber");}}
  ],
  fields:[
    {k:"title",l:"会议主题",t:"text",req:true,full:true},
    {k:"date",l:"会议日期",t:"date",req:true},
    {k:"form",l:"会议形式",t:"select",opts:["线上","线下","线上+线下"]},
    {k:"level",l:"会议级别",t:"select",opts:["公司级","队级","项目级"]},
    {k:"place",l:"地点",t:"text"},
    {k:"host",l:"主持人",t:"text"},
    {k:"people",l:"参会人次",t:"number"},
    {k:"status",l:"状态",t:"select",opts:["待召开","已召开","已归档"]},
    {k:"content",l:"主要内容",t:"textarea",full:true},
    {k:"decision",l:"决议事项",t:"textarea",full:true}
  ],
  defaultNew:{form:"线上+线下",level:"公司级",status:"已召开",place:"三楼会议室"},
  filters:[{k:"form",l:"形式",opts:["线上","线下","线上+线下"]},{k:"status",l:"状态",opts:["待召开","已召开","已归档"]}]
});

/* ---------- 2. 质量培训 ---------- */
A.regSchema("trainings",{
  title:"质量培训",prefix:"tr",key:"trainings",sortBy:"date",
  cols:[
    {k:"title",l:"培训主题",w:230,fmt:function(v,r){return '<div class="cell-main">'+esc(trunc(v,42))+'</div><div class="cell-sub">'+esc(r.cover||"")+'</div>';}},
    {k:"date",l:"日期",w:100},
    {k:"form",l:"形式",w:90,fmt:function(v){return tag(v,"t-gray");}},
    {k:"teacher",l:"讲师",w:80},
    {k:"hours",l:"学时",w:65,num:true},
    {k:"people",l:"参训人次",w:85,num:true},
    {k:"assess",l:"考核方式",w:130},
    {k:"status",l:"状态",w:80,fmt:function(v){return tag(v,v==="已归档"?"t-green":"t-amber");}}
  ],
  fields:[
    {k:"title",l:"培训主题",t:"text",req:true,full:true},
    {k:"date",l:"培训日期",t:"date",req:true},
    {k:"form",l:"培训形式",t:"select",opts:["集中授课","现场实操","线上","外部培训"]},
    {k:"teacher",l:"讲师",t:"text"},
    {k:"hours",l:"学时",t:"number",step:"0.5"},
    {k:"people",l:"参训人次",t:"number"},
    {k:"status",l:"状态",t:"select",opts:["待开展","已开展","已归档"]},
    {k:"cover",l:"覆盖项目",t:"text",full:true},
    {k:"assess",l:"考核方式",t:"text",full:true}
  ],
  defaultNew:{form:"集中授课",status:"已开展"},
  filters:[{k:"form",l:"形式",opts:["集中授课","现场实操","线上","外部培训"]},{k:"status",l:"状态",opts:["待开展","已开展","已归档"]}]
});

/* ---------- 3. 质量活动统计 ---------- */
A.regSchema("stats",{
  title:"质量活动统计",prefix:"s",key:"stats",sortBy:"cutoff",
  cols:[
    {k:"month",l:"统计月份",w:120,fmt:function(v){return '<b>'+esc(v)+'</b>';}},
    {k:"cutoff",l:"截止日",w:100},
    {k:"training",l:"培训场次",w:80,num:true},
    {k:"trainPeople",l:"培训人次",w:85,num:true},
    {k:"qc",l:"QC 活动",w:80,num:true},
    {k:"review",l:"内审报告",w:85,num:true},
    {k:"check",l:"质量检查",w:85,num:true},
    {k:"issues",l:"指出问题",w:85,num:true},
    {k:"fixed",l:"整改完成",w:85,num:true},

function bindCopy(host){
  $$("[data-copy]",host).forEach(function(el){
    el.onclick=function(){
      var txt=this.getAttribute("data-copy");
      copyText(txt);
    };
  });
}
function copyText(txt){
  txt=(txt==null?"":String(txt));
  /* 优先走同步 execCommand：必须在用户点击的同步调用栈内执行才可靠；
     剪贴板 API 是异步的，脱离手势上下文后在 file:// 或部分浏览器会静默失败。 */
  var done=false;
  function syncCopy(){
    var ta=document.createElement("textarea");
    ta.value=txt;
    ta.setAttribute("readonly","");
    ta.style.position="fixed";
    ta.style.left="-9999px";
    ta.style.top="0";
    ta.style.opacity="0";
    ta.style.width="1px";
    ta.style.height="1px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, txt.length);
    var ok=false;
    try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
    ta.remove();
    return ok;
  }
  if(syncCopy()){
    toast("路径已复制","ok");
    return;
  }
  /* 同步失败才降级到异步剪贴板 API */
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){toast("路径已复制","ok");},function(){
      toast("复制失败，请手动选择","err");
    });
  }else{
    toast("复制失败，请手动选择","err");
  }
}
window.copyText=copyText;

var PAGE_ROUTE={meetings:"meeting",trainings:"training",stats:"stats",qcs:"qc",reviews:"review",
                orgs:"org",guides:"guide",policies:"policy"};
function simplePage(key,schemaKey,extraHead,route){
  var rt=route||PAGE_ROUTE[schemaKey];
  return {
    sub:"",
    render:function(host){
      var h="";
      if(extraHead) h+=extraHead(DB());
      h+='<div class="card"><div class="card-b" id="tbHost" style="padding:14px 16px 6px"></div></div>';
      h+='<div id="mfHost"></div>';
      host.innerHTML=h;
      A.renderTable(schemaKey,$("#tbHost",host));
      if(rt&&window.moduleFilesCard) window.moduleFilesCard(rt,$("#mfHost",host));
    }
  };
}

function projectDetail(pid){

  });
  h+=sec("技术交底",brf,function(b){

      esc(b.date)+' · '+esc(b.level)+' · '+esc(b.status)+' · '+esc(trunc(b.points,40))+'</div>';
  });
  h+=sec("风险识别",rsk,function(k){
    var c=k.level==="高"?"#c0392b":k.level==="中"?"#b9770e":"#1f8b4c";
    return '<div style="font-size:12px;padding:6px 9px;border-left:2px solid '+c+';margin-bottom:4px">'+
      '<b style="color:'+c+'">['+esc(k.level)+']</b> '+esc(k.title)+' · '+esc(k.status)+'</div>';

      esc(t.title)+' · '+esc(t.owner||"")+' · '+esc(t.due||"")+' · '+esc({todo:"未开始",doing:"进行中",done:"已完成"}[t.status]||t.status)+'</div>';
  });

  openModal({
    title:p.name,
    body:h, okText:"关闭", noCancel:true,
    afterRender:function(m){
      var LIMIT=5;
      function blockHTML(){
        var list=(db.files||[]).filter(function(f){return f.projectId===pid;});
        var pend=list.filter(function(f){return window.fileIsPending(f);});
        var conf=list.filter(function(f){return !window.fileIsPending(f);});
        var takeP=Math.min(pend.length,LIMIT);
        var top=pend.slice(0,takeP).concat(conf.slice(0,Math.max(0,LIMIT-takeP)));
        var s='<div style="margin-bottom:6px;font-size:12.5px;font-weight:700">本项目文件（'+list.length+'）'+

        if(!list.length){

            '可在「文件中心」上传时选本项目，或在文件「详情」里补关联项目。</div>';
        }
        if(!window.fileRowHTML){
          return s+'<div style="font-size:12px;color:var(--muted)">文件模块尚未就绪</div>';
        }
        s+=top.map(function(f){ return window.fileRowHTML(f,{open:true,toggle:true}); }).join("");
        var more=list.length-top.length;
        if(more>0) s+='<div style="font-size:11.5px;color:var(--muted);margin-top:6px">另有 '+more+' 个文件，见文件中心</div>';
        return s;
      }
      function paintFiles(){
        var box=$("#pdFiles",m); if(!box) return;
        var bodyEl=$(".modal-b",m), sy=bodyEl?bodyEl.scrollTop:0;
        box.innerHTML=blockHTML();
        if(window.fileBind) window.fileBind(box,function(){
          paintFiles();
          if(window.mfRefresh) window.mfRefresh(document.getElementById("mfHost"));
          if(window.refreshNav) window.refreshNav();
        });
        if(bodyEl) bodyEl.scrollTop=sy;
      }
      paintFiles();
    }
  });
}

/* ---------- 10. 质量检查整改回复（深度）----------
   字段与流程依据（三份实际单据逐字核对，不含空模板 xlsx）：
     ① 00公司整改回复/整改通知单/2026上半年公司质量检查整改回复.docx
        致送「队技术质量科」；检查日期 2026-07-27；检查形式《质量检查记录表》《质量问题整改通知单》；
        （一）存在的问题 1—4；（二）整改情况 1—4；（三）整改前后对比图片；
        问题整改责任人（签字）、验收人（签字）、报告时间 2026.7.30
     ② 06罗田生态恢复项目/整改通知单/罗田县生态恢复项目项目整改 回复单01.doc
        整改记录 1—7；整改人 + 2026-07-19；复核记录「已按照要求进行整改」；复核人 + 日期
     ③ 07宜昌稻花香边坡治理工程项目/质量整改回复单260922(1).docx
        项目名称 / 整改单位；整改内容及要求（检查人、日期）；限期整改时间（接收人签字）；
        整改措施（整改人、日期）；整改验证（责任人、日期）；问题一—七 + 附整改照片
   业务流程：检查下发 → 接收签收 → 限期整改 → 报送回复单 → 复核验证 → 闭环 / 退回
------------------------------------------------ */
var INS=window.INSP;

/* 状态配色：闭环绿、退回红、待复核蓝、整改中青、待整改黄 */
function inspCls(v){
  if(v==="已闭环") return "t-green";
  if(v==="复核退回") return "t-red";
  if(v==="已回复待复核") return "t-p2";
  if(v==="整改中") return "t-doing";
  return "t-amber";
}
function inspTag(v){ return tag(v,inspCls(v)); }

/* 原文未写明的字段统一显示「未提供」——只做展示回退，绝不把这两个字写进数据，
   否则后续真有了值会被「空白不覆盖」规则判成已填写而不再更新。 */
function naTxt(){ return '<span style="color:#b6c0cc">未提供</span>'; }

/* 源文件位置（srcLoc）展示：
   取值规则见 importer.js —— T{m}·R{n}=第 m 张表格第 n 行，L{n}=正文第 n 行。
   三种态：有位置 → 蓝色标识；有来源文件但无位置 → 橙色「未记录」；无来源 → 灰色「手工」 */
function locText(v,r){
  var s=String(v||"").trim();
  if(!s) return (r&&r.srcFileId)?"未记录":"手工";
  var m=/^T(\d+)[·:\-]R(\d+)$/.exec(s); if(m) return "表"+m[1]+"·行"+m[2];
  var m2=/^L(\d+)$/.exec(s); if(m2) return "第"+m2[1]+"行";
  return s;
}
function locFull(v){
  var s=String(v||"").trim();
  var m=/^T(\d+)[·:\-]R(\d+)$/.exec(s); if(m) return "源文件第 "+m[1]+" 张表格第 "+m[2]+" 行";
  var m2=/^L(\d+)$/.exec(s); if(m2) return "源文件正文第 "+m2[1]+" 行";
  return s;
}
function locTag(v,r){
  var s=String(v||"").trim(), cls="loc-tag", attrs=" ", title=locFull(s);
  if(!s){
    if(r&&r.srcFileId){ cls+=" is-miss"; title="该行来自文件，但早期版本未记录位置，重新同步该文件可补齐"; }
    else { cls+=" is-manual"; title="手工录入，不来自文件"; }
    return '<span class="'+cls+'" title="'+esc(title)+'">'+esc(locText(v,r))+'</span>';
  }
  if(r&&r.srcFileId) attrs=' data-src="'+esc(r.srcFileId)+'" ';
  return '<span class="'+cls+'"'+attrs+'title="'+esc(title+'（点击查看来源文件）')+'">'+esc(locText(v,r))+'</span>';
}

    "置为「已闭环」必须已填复核结论与复核日期，且已整改数等于指出问题数。",
  cols:[
    {k:"no",l:"检查编号",w:126,fmt:function(v,r){
      var n=window.InspAttach?window.InspAttach.count(r.id):0;
      return '<b style="white-space:nowrap">'+esc(v)+'</b><div class="cell-sub" style="white-space:nowrap">'+

        'title="上传/下载该检查单的整改通知单与回复单附件">附件'+(n?'('+n+')':'')+'</span></div>';}},
    {k:"date",l:"检查日期",w:100,fmt:function(v){return v?esc(v):naTxt();}},
    {k:"projectId",l:"受检项目",w:140,fmt:function(v){return projShort(v);}},
    {k:"checker",l:"检查人",w:86,fmt:function(v){return v?esc(v):naTxt();}},
    {k:"conclusion",l:"结论",w:76,fmt:function(v){return v?tag(v,v==="合格"?"t-green":v==="不合格"?"t-red":"t-amber"):naTxt();}},
    {k:"issueCount",l:"问题数",w:52,num:true},
    {k:"fixedCount",l:"已整改",w:54,num:true},
    {k:"_rate",l:"整改率",w:72,fmt:function(v,r){
      var p=r.issueCount?Math.round(r.fixedCount/r.issueCount*100):0;
      return '<div style="min-width:70px"><div style="font-size:12px;font-weight:700">'+p+'%</div><div class="bar '+(p>=100?"g":"a")+'" style="height:4px;margin-top:3px"><i style="width:'+Math.min(p,100)+'%"></i></div></div>';}},
    {k:"deadline",l:"限期整改",w:102,fmt:function(v,r){
      if(!v) return naTxt();
      if(INS.isOpen(r.fixStatus)&&v<A.todayStr()){
        var od=A.diffDays(v,A.todayStr());
        return '<span style="color:#c0392b;font-weight:600;white-space:nowrap">'+esc(v)+'</span><div class="cell-sub" style="color:#c0392b">逾期 '+(od>0?od:0)+' 天</div>';
      }
      return '<span style="white-space:nowrap">'+esc(v)+'</span>';}},
    {k:"fixStatus",l:"整改状态",w:112,fmt:function(v,r){
      var s=inspTag(v);
      /* 复核日期并入状态列，避免表格过宽：闭环显示复核日，其余显示所处环节 */
      if(INS.isVerifying(v)) s+='<div class="cell-sub">待复核</div>';
      else if(INS.isClosed(v)&&r.reviewDate) s+='<div class="cell-sub">复核 '+esc(r.reviewDate.slice(5))+'</div>';
      else if(INS.isOpen(v)) s+='<div class="cell-sub">未复核</div>';
      return s;}},
    {k:"_pr",l:"",w:56,fmt:function(v,r){return '<button class="btn sm" data-print="'+esc(r.id)+'">打印</button>';}}
  ],
  fields:[
    /* —— 第一部分：检查下发（整改通知单抬头）—— */
    {k:"no",l:"检查编号",t:"text",req:true,ph:"如 ZLJC-2026-001"},
    {k:"kind",l:"单据类型",t:"select",opts:["质量问题整改通知单","质量检查记录表"]},
    {k:"date",l:"检查日期",t:"date",req:true},
    {k:"projectId",l:"受检项目",t:"select",opts:projOpts()},
    {k:"fixUnit",l:"整改单位",t:"text",ph:"项目部 / 施工队"},
    {k:"toOrg",l:"致送对象",t:"text",ph:"如 队技术质量科"},
    {k:"checker",l:"检查人",t:"text",req:true},
    {k:"sendDate",l:"下发日期",t:"date"},
    /* —— 第二部分：接收签收与限期 —— */
    {k:"receiver",l:"接收人",t:"text"},
    {k:"recvDate",l:"接收日期",t:"date"},
    {k:"deadline",l:"限期整改时间",t:"date"},
    /* —— 第三部分：问题与整改 —— */
    {k:"issueCount",l:"指出问题数",t:"number"},
    {k:"fixedCount",l:"已整改数",t:"number"},
    {k:"fixOwner",l:"整改责任人",t:"text",ph:"问题整改责任人（签字）"},
    {k:"reportDate",l:"整改报告时间",t:"date",ph:"回复单报送日期"},
    /* —— 第四部分：复核验证 —— */
    {k:"reviewer",l:"复核人（验收人）",t:"text"},
    {k:"reviewDate",l:"复核日期",t:"date"},
    {k:"verifyResult",l:"复核结论",t:"select",opts:["待复核","已按要求整改","部分整改","整改不到位"]},
    {k:"photos",l:"整改佐证",t:"text",ph:"如 附整改前后对比图片 12 张"},
    /* —— 第五部分：结论与状态 —— */
    {k:"fixStatus",l:"整改状态",t:"select",opts:INS.STATUS},
    {k:"conclusion",l:"检查结论",t:"select",opts:["合格","基本合格","不合格"]},
    {k:"content",l:"检查内容（存在的问题）",t:"textarea",full:true,ph:"逐条列出（一）（二）（三）……"},
    {k:"note",l:"备注",t:"textarea",full:true}
  ],
  filters:[
    {k:"fixStatus",l:"整改状态",opts:INS.STATUS},
    {k:"kind",l:"单据类型",opts:["质量问题整改通知单","质量检查记录表"]}
  ],
  defaultNew:{kind:"质量问题整改通知单",conclusion:"基本合格",fixStatus:"待整改",verifyResult:"待复核",issueCount:0,fixedCount:0},
  /* 校验规则：全部来自单据的签署与时间先后关系，硬校验不通过则不允许保存 */
  beforeSave:function(d,id){
    function bad(m){ toast(m,"err"); return false; }
    /* R1 检查人必填：三份单据均由检查人签署，缺失则整单不可追溯 */
    if(!d.checker) return bad("请填写「检查人」：整改通知单须由检查人签署");
    /* R2 时间先后：下发 ≤ 报告 */
    if(d.sendDate&&d.reportDate&&d.sendDate>d.reportDate)
      return bad("「下发日期」不能晚于「整改报告时间」");
    /* R3 时间先后：检查 ≤ 限期整改 */
    if(d.date&&d.deadline&&d.date>d.deadline)
      return bad("「限期整改时间」不能早于「检查日期」");
    /* R4 接收人与接收日期成对（回复单接收人签字需成对留存） */
    if(d.receiver&&!d.recvDate) return bad("已填「接收人」，请补「接收日期」");
    if(d.recvDate&&!d.receiver) return bad("已填「接收日期」，请补「接收人」");
    /* R5 计数合法性 */
    if(d.issueCount!=null&&d.fixedCount!=null&&d.fixedCount>d.issueCount)
      return bad("「已整改数」不能大于「指出问题数」");
    /* R6 状态流转合法性：禁止跨级跳转（新增行不校验） */
    if(id){
      var old=(DB().inspections||[]).filter(function(r){return r.id===id;})[0];
      if(old&&old.fixStatus&&old.fixStatus!==d.fixStatus&&!INS.canGo(old.fixStatus,d.fixStatus))
        return bad("整改状态不能从「"+old.fixStatus+"」直接改为「"+d.fixStatus+
          "」，须按 待整改→整改中→已回复待复核→已闭环 逐级流转（复核不通过改为「复核退回」）");
    }
    /* R7 已回复待复核 / 已闭环 必须有报告时间 */
    if((INS.isVerifying(d.fixStatus)||INS.isClosed(d.fixStatus))&&!d.reportDate)
      return bad("状态为「"+d.fixStatus+"」时必须填写「整改报告时间」（回复单报送日期）");
    /* R8 闭环前置条件：复核结论 + 复核日期 + 数量闭合 */
    if(INS.isClosed(d.fixStatus)){
      if(!d.verifyResult||d.verifyResult==="待复核")
        return bad("置为「已闭环」前须填写「复核结论」（整改验证结果）");
      if(d.verifyResult==="整改不到位")
        return bad("复核结论为「整改不到位」时不得闭环，请退回「整改中」重新整改");
      if(!d.reviewDate) return bad("置为「已闭环」前须填写「复核日期」");
      if((d.issueCount||0)>0&&(d.fixedCount||0)!==d.issueCount)
        return bad("置为「已闭环」时「已整改数」须等于「指出问题数」（"+d.issueCount+" 个）");
    }
    /* 软提示：逾期未闭环，不阻断保存 */
    if(INS.isOpen(d.fixStatus)&&d.deadline&&d.deadline<A.todayStr())
      toast("该单已超过限期整改时间，请督办","err");
    return true;
  },
  afterRender:function(host){
    $$("[data-print]",host).forEach(function(b){
      b.onclick=function(e){ e.stopPropagation(); if(window.printInspection) window.printInspection(this.getAttribute("data-print")); };
    });
    $$("[data-attach]",host).forEach(function(b){
      b.onclick=function(e){
        e.stopPropagation();
        if(window.InspAttach) window.InspAttach.open(this.getAttribute("data-attach"));
        else toast("附件模块未加载，请重新构建页面","err");
      };
    });
  }
});

    {k:"status",l:"整改状态",w:100,fmt:function(v){return inspTag(v);}},

  ],
  fields:[
    {k:"no",l:"问题编号",t:"text",req:true},

    {k:"seq",l:"问题序号",t:"text",ph:"问题一 / 1"},
    {k:"inspectionId",l:"所属检查",t:"select",opts:function(){return DB().inspections.map(function(i){return [i.id,i.no+"（"+i.date+"）"];});}},
    {k:"projectId",l:"所属项目",t:"select",opts:projOpts()},
    {k:"desc",l:"问题描述",t:"text",req:true,full:true,ph:"对应通知单「存在的问题」条目"},
    {k:"cat",l:"归类",t:"select",opts:["签认手续不全","资料记录缺失","方案与制度完善","信息化应用","实体质量","内业资料","方案编制","材料设备","安全管理"]},
    {k:"level",l:"严重程度",t:"select",opts:["一般","较重","严重"]},
    {k:"requirement",l:"整改内容及要求",t:"textarea",full:true,ph:"通知单下发时提出的整改要求"},
    {k:"measure",l:"整改措施",t:"textarea",full:true,ph:"回复单中已采取的整改措施"},
    {k:"deadline",l:"整改期限",t:"date"},
    {k:"finishDate",l:"整改完成日期",t:"date"},
    {k:"owner",l:"整改责任人",t:"text"},
    {k:"photo",l:"整改佐证照片",t:"select",opts:["未附","附整改照片","附整改前后对比照片"]},
    {k:"verifyResult",l:"复核结论",t:"select",opts:["待复核","已按要求整改","部分整改","整改不到位"]},
    {k:"status",l:"整改状态",t:"select",opts:INS.STATUS},
    {k:"note",l:"备注",t:"text",full:true}
  ],

  /* 校验：闭环必须「有措施、有完成日期、有佐证」，与回复单「整改验证」栏一致 */
  beforeSave:function(d,id){
    function bad(m){ toast(m,"err"); return false; }
    if(INS.isClosed(d.status)){
      if(!d.measure) return bad("置为「已闭环」前须填写「整改措施」（回复单中的整改情况）");
      if(!d.finishDate) return bad("置为「已闭环」前须填写「整改完成日期」");

      if(d.verifyResult==="整改不到位") return bad("复核结论为「整改不到位」时不得闭环");
    }
    if(id){
      var old=(DB().issues||[]).filter(function(r){return r.id===id;})[0];
      if(old&&old.status&&old.status!==d.status&&!INS.canGo(old.status,d.status))
        return bad("整改状态不能从「"+old.status+"」直接改为「"+d.status+"」，须逐级流转");
    }
    if(d.deadline&&d.finishDate&&d.finishDate<d.deadline&&INS.isOpen(d.status))
      toast("已在期限内完成，请将状态推进到「已回复待复核」","ok");
    return true;
  }
});

A.regPage("inspect",{
  sub:"整改通知单 → 整改回复单 → 复核验证 → 闭环，逐单留痕可追溯",
  render:function(host){
    var db=DB(), iss=db.issues, ins=db.inspections, tdy=A.todayStr();
    var closed=iss.filter(function(i){return INS.isClosed(i.status);}).length;
    var rate=iss.length?Math.round(closed/iss.length*1000)/10:0;
    var verify=iss.filter(function(i){return INS.isVerifying(i.status);}).length;
    var overdue=iss.filter(function(i){return INS.isOpen(i.status)&&i.deadline&&i.deadline<tdy;}).length;
    var insPending=ins.filter(function(i){return INS.isOpen(i.fixStatus);}).length;
    var insVer=ins.filter(function(i){return INS.isVerifying(i.fixStatus);}).length;

    /* 状态分布：按新状态机 5 态统计，旧数据三值可直接落位 */
    var dist=INS.STATUS.map(function(s){
      return {s:s,n:iss.filter(function(i){return i.status===s;}).length};
    });
    var distMax=Math.max.apply(null,dist.map(function(d){return d.n;}).concat([1]));

    host.innerHTML='<div class="grid g5" style="margin-bottom:14px">'+
      '<div class="card kpi"><div class="k">质量检查</div><div class="v">'+ins.length+'<small>次</small></div><div class="d">'+
        (function(){ var pj=ins.filter(function(i){return i.projectId;});
          return pj.length?('覆盖 '+new Set(pj.map(function(i){return i.projectId;})).size+' 个项目'):'单据未写明项目';
        })()+' · 未闭环 '+insPending+' 单</div></div>'+
      '<div class="card kpi"><div class="k">指出问题</div><div class="v">'+iss.length+'<small>个</small></div><div class="d">严重 '+iss.filter(function(i){return i.level==="严重";}).length+' · 较重 '+iss.filter(function(i){return i.level==="较重";}).length+'</div></div>'+
      '<div class="card kpi"><div class="k">整改闭环率</div><div class="v" style="color:'+(rate>=90?"#1f8b4c":"#b9770e")+'">'+rate+'<small>%</small></div><div class="d">已闭环 '+closed+' / '+iss.length+'</div></div>'+
      '<div class="card kpi"><div class="k">待复核</div><div class="v" style="color:'+(verify?"#1a6fa8":"#1f8b4c")+'">'+verify+'<small>个</small></div><div class="d">已回复待复核 · 单据 '+insVer+' 份</div></div>'+
      '<div class="card kpi"><div class="k">超期未整改</div><div class="v" style="color:'+(overdue?"#c0392b":"#1f8b4c")+'">'+overdue+'<small>个</small></div><div class="d">已过限期整改时间</div></div>'+
    '</div>'+

    /* 状态流转条：一眼看出卡在哪个环节 */
    '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>整改状态流转</h3>'+
      '<span class="hint">待整改 → 整改中 → 已回复待复核 → 已闭环；复核不通过退回「整改中」</span></div>'+
      '<div class="card-b"><div style="display:flex;gap:10px;flex-wrap:wrap">'+
      dist.map(function(d){
        var c=d.s==="已闭环"?"#1f8b4c":d.s==="复核退回"?"#c0392b":d.s==="已回复待复核"?"#1a6fa8":"#b9770e";
        return '<div style="flex:1;min-width:120px;background:var(--panel-2);border-radius:7px;padding:9px 11px">'+
          '<div style="display:flex;align-items:center;gap:6px;font-size:12px">'+inspTag(d.s)+
          '<span style="margin-left:auto;font-weight:700;font-size:15px">'+d.n+'</span></div>'+
          '<div class="bar" style="height:5px;margin-top:7px"><i style="width:'+Math.round(d.n/distMax*100)+'%;background:'+c+'"></i></div>'+
        '</div>';
      }).join("")+
      '</div></div></div>'+

    '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>质量检查单（通知单 / 记录表）</h3>'+
      '<span class="hint">打印可还原《质量检查记录及整改回复单》；点编号下「附件」或右侧按钮上传/下载两类附件</span>'+
      '<div class="spacer"></div><button class="btn sm" data-attach-all="1">附件管理</button></div>'+
      '<div class="card-b" id="tbIns" style="padding:14px 16px 6px"></div></div>'+
    '<div class="card"><div class="card-h"><h3>检查问题与整改回复</h3><span class="hint">逐条登记，闭环后计入整改率</span></div>'+
      '<div class="card-b" id="tbIss" style="padding:14px 16px 6px"></div></div>'+
    '<div id="mfHost"></div>';
    A.renderTable("inspections",$("#tbIns",host));
    A.renderTable("issues",$("#tbIss",host));
    var ba=$("[data-attach-all]",host);
    if(ba) ba.onclick=function(){
      if(window.InspAttach&&window.InspAttach.openAll) window.InspAttach.openAll();
      else toast("附件模块未加载，请重新构建页面","err");
    };
    if(window.moduleFilesCard) window.moduleFilesCard("inspect",$("#mfHost",host));
  }
});

<script>
/* ===== 文件中心：IndexedDB 真存 + 路径索引双轨 ===== */
(function(){
"use strict";
var A=window.APP, $=A.$, $$=A.$$, esc=A.esc;
function DB(){return A.db;}

var DB_NAME="ZLGL_FILES", STORE="blobs";
var idbPromise=null, idbOK=false, idbErr="";

function openIDB(){
  if(idbPromise) return idbPromise;
  idbPromise=new Promise(function(resolve,reject){
    if(!window.indexedDB){ reject(new Error("当前浏览器不支持 IndexedDB")); return; }
    var rq;
    try{ rq=indexedDB.open(DB_NAME,1); }catch(e){ reject(e); return; }
    rq.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
    };
    rq.onsuccess=function(e){ idbOK=true; resolve(e.target.result); };
    rq.onerror=function(e){ idbErr=(e.target.error&&e.target.error.message)||"无法打开文件库"; reject(e.target.error||new Error(idbErr)); };
    rq.onblocked=function(){ reject(new Error("文件库被其他标签页占用")); };
  });
  return idbPromise;
}
function idbPut(key,blob){
  return openIDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(STORE,"readwrite");
      tx.objectStore(STORE).put(blob,key);
      tx.oncomplete=function(){res(true);};
      tx.onerror=function(e){rej(e.target.error);};
    });
  });
}
function idbGet(key){
  return openIDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(STORE,"readonly");
      var rq=tx.objectStore(STORE).get(key);
      rq.onsuccess=function(){res(rq.result);};
      rq.onerror=function(e){rej(e.target.error);};
    });
  });
}
function idbDel(key){
  return openIDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(STORE,"readwrite");
      tx.objectStore(STORE).delete(key);
      tx.oncomplete=function(){res(true);};
      tx.onerror=function(e){rej(e.target.error);};
    });
  });
}
function fmtSize(n){
  if(!n) return "—";
  if(n<1024) return n+" B";
  if(n<1048576) return (n/1024).toFixed(1)+" KB";
  return (n/1048576).toFixed(2)+" MB";
}
function extOf(name){
  var m=/\.([a-z0-9]+)$/i.exec(name||"");
  return m?m[1].toUpperCase():"FILE";
}

var MODULES=["综合","计划看板","质量会议","质量培训","质量活动统计","在建项目","QC 活动","质量检查","方案内审","技术交底","风险识别","质量管理机构","作业指导书","办法制度"];

/* 页面级筛选：跨 window.render("files") 保留，避免上传后筛选被重置 */
var UI={mod:"",status:"",proj:""};
function projOptions(cur,blank){
  var h='<option value="">'+esc(blank||"全部项目")+'</option>';
  (DB().projects||[]).forEach(function(p){
    var nm=String(p.name||"");
    h+='<option value="'+esc(p.id)+'"'+(cur===p.id?" selected":"")+' title="'+esc(nm)+'">'+
       esc(nm.length>16?nm.slice(0,16)+"…":nm)+'</option>';
  });
  return h;
}

/* ---------- 上传 ---------- */
function addFiles(files,pickedModule,projectId){
  var arr=Array.prototype.slice.call(files||[]);
  if(!arr.length) return;
  var mod=pickedModule||"综合";
  var tasks=arr.map(function(f){
    var rec={
      id:A.uid("f"), name:f.name, size:f.size, type:f.type||"",
      module:mod, projectId:projectId||"", date:A.todayStr(), note:"",
      mode:f.size>5*1024*1024?"path":"idb", path:"", key:"",
      status:"pending", statusAt:window.fileNowStr?window.fileNowStr():""
    };
    if(rec.mode==="path"){
      var p=prompt("「"+f.name+"」超过 5MB（"+fmtSize(f.size)+"），将只登记路径索引。\n请填写该文件在电脑上的完整路径：","E:\\workbuddy 缓存\\workbuddy\\总工作台\\raw\\a资源\\2026公司质量管理台账\\");
      if(p===null) return Promise.resolve(false);
      rec.path=p.trim();
      DB().files.push(rec);
      return Promise.resolve(true);
    }
    rec.key=rec.id;
    return idbPut(rec.id,f).then(function(){
      DB().files.push(rec);
      return true;
    }).catch(function(e){
      // IndexedDB 不可用 → 降级为路径索引
      rec.mode="path";
      var p=prompt("本地文件库不可用（"+(e.message||idbErr||"未知原因")+"）。\n「"+f.name+"」将改为登记路径索引，请填写完整路径：","E:\\workbuddy 缓存\\workbuddy\\总工作台\\raw\\a资源\\2026公司质量管理台账\\");
      rec.path=(p||"").trim();
      DB().files.push(rec);
      return true;
    });
  });
  Promise.all(tasks).then(function(rs){
    var n=rs.filter(Boolean).length;
    A.save();
    toast("已加入 "+n+" 个文件","ok");
    window.render("files");
    /* v1.9：上传即排队解析，解析结果可自动落库或进差异预览 */
    if(window.IMPORT&&window.IMPORT.enqueue){
      var ids=DB().files.slice(-arr.length).map(function(f){ return f.id; });
      setTimeout(function(){ try{ window.IMPORT.enqueue(ids); }catch(e){} },300);
    }
  });
}

function downloadFile(id){
  var f=DB().files.filter(function(x){return x.id===id;})[0]; if(!f) return;
  if(f.mode==="path"){
    if(window.copyText) window.copyText(f.path); else toast(f.path||"（空）","ok");
    return;
  }
  idbGet(f.key).then(function(blob){
    if(!blob){ toast("浏览器中找不到该文件，可能已被清理","err"); return; }
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=f.name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },500);
  }).catch(function(e){ toast("读取失败："+e.message,"err"); });
}
window.fileDownload=downloadFile;

/* ---------- 共用文件行与状态按钮（文件中心 / 模块卡片 / 项目详情） ---------- */

    '</div>'+
    '<div class="row-actions">'+acts+'</div></div>';
}
/* 统一绑定：确认 / 撤回 / 打开。onChange 由调用方决定"怎么重绘"，本函数不猜 */
function fileBind(scope,onChange){
  $$("[data-fok]",scope).forEach(function(b){
    b.onclick=function(){
      if(window.fileSetStatus(this.getAttribute("data-fok"),"confirmed")){
        toast("已确认","ok"); if(onChange) onChange();
      }
    };
  });
  $$("[data-frev]",scope).forEach(function(b){
    b.onclick=function(){
      if(window.fileSetStatus(this.getAttribute("data-frev"),"pending")){
        toast("已撤回，转为待确认","ok"); if(onChange) onChange();
      }
    };
  });
  $$("[data-fopen]",scope).forEach(function(b){
    b.onclick=function(){ downloadFile(this.getAttribute("data-fopen")); };
  });
}
window.fileRowHTML=fileRowHTML;

function previewFile(id){
  var f=DB().files.filter(function(x){return x.id===id;})[0]; if(!f) return;
  if(!window.ImgView){ toast("预览模块未加载，请重新构建页面","err"); return; }
  var hit=null, hitDone=false;
  window.ImgView.open({
    name:f.name, size:f.size, path:f.path||"",
    getBlob:function(escalate){
      if(f.mode!=="path") return blobOf(f.id);
      var q=(hitDone?Promise.resolve(hit):window.QD.routeByPath(f.path));
      return q.then(function(h){
        hit=h; hitDone=true;
        if(!h) throw new Error("NO_ROUTE");
        if(h.perm==="granted") return h;
        if(!escalate) throw new Error("NEED_PERM");
        return window.QD.ensurePerm(h.route,"read").then(function(){
          h.perm="granted"; return h;
        });
      }).then(function(h){ return window.QD.readBlob(h.route,h.rel); });
    },
    onDetail:function(){ showFileRec(f); }
  });
}

}
