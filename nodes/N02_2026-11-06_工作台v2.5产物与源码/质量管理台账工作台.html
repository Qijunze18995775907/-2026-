    '<div class="card"><div class="card-h"><h3>说明</h3></div><div class="card-b" style="font-size:12.5px;line-height:2;color:var(--ink-2)">'+
      '<div>· <b>待确认</b>：上传或归档后先进入待确认，在「在建项目」或本页逐条确认归属；确认后仍可撤回。</div>'+
      '<div>· <b>双轨存储</b>：小文件以二进制存入浏览器数据库，换电脑后需重新上传；大文件只登记路径，原件始终在 E 盘。</div>'+
      '<div>· <b>数据备份</b>：任务、项目、检查等结构化数据存于 localStorage，可一键导出 JSON；换设备时用「从备份恢复」导入。</div>'+
      '<div>· <b>打印归档</b>：各台账页的「打印」按钮生成 A4 版式，浏览器中直接打印或另存为 PDF，可盖章归档。</div>'+
      '<div>· <b>容量上限</b>：localStorage 约 5MB（仅存数据，不含文件），IndexedDB 通常可用数百 MB。</div>'+
    '</div></div>';

    function paint(){
      var box=$("#fileList",host);
      var mod=UI.mod, st=UI.status;
      var list=listAll().filter(function(f){
        if(mod&&f.module!==mod) return false;
        if(st&&window.fileStatus(f)!==st) return false;
        return true;
      });
      if(!list.length){
        var why=st==="pending"?"没有待确认的文件。":
                st==="confirmed"?"没有已确认的文件。":
                mod?"该模块暂无文件。":"暂无文件。可拖入公司台账原件，或在各模块录入时登记路径。";
        box.innerHTML='<div class="empty">'+why+
          ((st||mod)?'　<button class="btn sm" id="fltClear">清除筛选</button>':'')+'</div>';
        var cb=$("#fltClear",box);
        if(cb) cb.onclick=function(){
          UI.mod=""; UI.status="";
          var fm=$("#fltModule",host), fs=$("#fltStatus",host);
          if(fm) fm.value=""; if(fs) fs.value="";
          paint();
        };
        return;
      }
      box.innerHTML=list.map(function(f){
        var isPath=f.mode==="path";
        var isImg=(window.QD&&window.QD.isImg)?window.QD.isImg(f.name):false;
        var imgAttr=isImg?' data-img="'+esc(f.id)+'"':'';
        var pen=window.fileIsPending(f);
        return '<div class="file-item">'+
          '<div class="file-ic"'+imgAttr+' title="'+(isImg?"点击预览":"")+'" style="'+(isPath?"background:var(--amber-soft);color:var(--amber)":"")+(isImg?";cursor:pointer":"")+'">'+esc(extOf(f.name))+'</div>'+
          '<div class="file-main">'+
            '<div'+imgAttr+' style="font-size:13px;font-weight:600;word-break:break-all'+(isImg?";cursor:pointer":"")+'">'+esc(f.name)+'</div>'+
            '<div style="font-size:11.5px;color:var(--muted);margin-top:2px">'+
              fmtSize(f.size)+' · '+esc(f.module)+' · '+esc(f.date)+
              ' · '+window.fileTag(f)+
              (window.IMPORT&&window.IMPORT.badge?' · '+window.IMPORT.badge(f):'')+
              (f.projectId?'':' · <span class="tag t-gray">未关联项目</span>')+
              (isPath?' · <span style="color:var(--amber)">路径索引</span>':' · <span style="color:var(--green)">已存入浏览器</span>')+
              (f.src==="ws"?' · <span style="color:var(--brand-2)">工作空间站</span>'
                :f.src==="folder"?' · <span style="color:var(--brand-2)">本地文件夹</span>'
                :' · 手动上传')+
            '</div>'+
            (isPath&&f.path?'<div style="font-size:11px;color:var(--muted);margin-top:3px;word-break:break-all">'+esc(f.path)+'</div>':'')+
            (!isPath&&f.rel?'<div style="font-size:11px;color:var(--muted);margin-top:3px;word-break:break-all">'+esc(f.rel)+'</div>':'')+
          '</div>'+
          '<div class="row-actions">'+
            (f.parse&&f.parse.state==="preview"?'<button class="btn sm primary" data-imp="'+esc(f.id)+'">采纳</button>':'')+
            (isImg?'<button class="btn sm" data-pv="'+esc(f.id)+'">预览</button>':'')+
            '<button class="btn sm" data-dl="'+esc(f.id)+'">'+(isPath?"复制路径":"下载")+'</button>'+
            '<button class="btn sm'+(pen?' primary':' ghost')+'" data-'+(pen?"fok":"frev")+'="'+esc(f.id)+'">'+(pen?"确认":"撤回")+'</button>'+
            '<button class="btn sm ghost" style="color:#c0392b" data-rm="'+esc(f.id)+'">删</button>'+
          '</div></div>';
      }).join("");
      $$("[data-pv]",box).forEach(function(b){ b.onclick=function(){ previewFile(this.getAttribute("data-pv")); }; });
      $$("[data-img]",box).forEach(function(el){ el.onclick=function(){ previewFile(this.getAttribute("data-img")); }; });
      $$("[data-dl]",box).forEach(function(b){ b.onclick=function(){ downloadFile(this.getAttribute("data-dl")); }; });
      $$("[data-rm]",box).forEach(function(b){ b.onclick=function(){ delFile(this.getAttribute("data-rm")); }; });
      $$("[data-imp]",box).forEach(function(b){
        b.onclick=function(){ if(window.IMPORT) window.IMPORT.preview(this.getAttribute("data-imp")); };
      });
      window.fileBind(box,function(){ paint(); paintKpi(); if(window.refreshNav) window.refreshNav(); });
    }
    paint(); paintKpi();
    window.__filesRepaint=function(){ try{ paint(); paintKpi(); }catch(e){} };

    var dz=$("#dropZone",host), fi=$("#fileInput",host);
    dz.onclick=function(){ fi.click(); };
    function upNow(files){
      var m=$("#upModule",host).value, pj=$("#upProject",host).value;
      UI.mod=m; UI.status="";
      var fm=$("#fltModule",host), fs=$("#fltStatus",host);
      if(fm) fm.value=m; if(fs) fs.value="";
      addFiles(files,m,pj);
    }
    fi.onchange=function(){ upNow(this.files); this.value=""; };
    dz.addEventListener("dragover",function(e){ e.preventDefault(); dz.classList.add("over"); });
    dz.addEventListener("dragleave",function(){ dz.classList.remove("over"); });
    dz.addEventListener("drop",function(e){
      e.preventDefault(); dz.classList.remove("over");
      upNow(e.dataTransfer.files);
    });
    $("#fltModule",host).onchange=function(){ UI.mod=this.value; paint(); };
    $("#fltStatus",host).onchange=function(){ UI.status=this.value; paint(); };
    $("#btnAudit",host).onclick=function(){
      if(!window.IMPORT){ toast("同步引擎未加载","err"); return; }
      var r=window.IMPORT.auditText();
      window.openModal({
        title:"数据对账 · 文件 ↔ 台账",
        okText:"关闭", noCancel:true,
        body:'<div class="imp-log">'+esc(r.text)+'</div>'+
          '<div style="margin-top:12px;font-size:12.5px" class="'+(r.pass?"imp-pass":"imp-fail")+'">'+
          (r.pass?"判定：通过（孤儿文件 / 孤儿行 / 失联行 / 重复行 均为 0）":"判定：不通过，请处理上述差异")+'</div>'
      });
    };
    $("#btnBackup",host).onclick=function(){ window.backupJSON(); };
    $("#btnRestore",host).onclick=function(){ window.restoreJSON(); };

    // 预检文件库可用性
    openIDB().catch(function(e){
      var el=$("#dropZone",host);
      if(el){
        el.style.borderColor="#c0392b";
        el.innerHTML='<div style="font-size:14px;font-weight:600;color:#c0392b;margin-bottom:4px">本地文件库不可用</div>'+
          '<div style="font-size:12px">原因：'+esc(e.message||idbErr)+'。上传时将自动转为路径索引，不影响台账数据。</div>'+
          '<div style="font-size:11.5px;margin-top:6px;color:var(--muted)">建议用 Chrome / Edge 打开，或将本文件放在 http 服务下访问。</div>';
      }
    });
  }
});
})();

</script>
<script>
/* ===== 质量检查单附件：整改通知单附件 / 整改回复单附件 =====
   设计要点（v2.4，经设计确认）：
   1) 独立数组 DB().inspAttachments，字段 inspId 关联检查单、kind 区分两类附件，
      不写进 inspections 的任何业务字段 → 不触发 beforeSave，不改整改状态机，
      原有整改回复流程与已有数据完全不受影响。
   2) 二进制复用文件中心同一 IndexedDB 库（key 加 ia_ 前缀），≤20MB 存浏览器、
      >20MB 或文件库不可用时降级为路径索引；文件中心自身仍保持 5MB 阈值。
   3) 权限沿用 schema.readonly（只读台账只可下载）；另按检查单提供「归档锁定」，
      锁定后禁止该单增删附件、仍可下载，状态存 DB.ui 随 JSON 备份。
   4) 上传结果、下载异常均给出明确 toast，不静默失败；
      同类同名附件二次确认后替换旧版（连旧二进制一起删）。
   5) 检查单被删后附件保留，但总览标出「孤儿附件」并提供整批清理。
   6) 不按整改状态硬拦截上传，只给软提示。 */
(function(){
"use strict";
var A=window.APP, $=A.$, $$=A.$$, esc=A.esc;
function DB(){return A.db;}
function toast(m,t){ if(window.toast) window.toast(m,t); else console.log(m); }

var KINDS=[
  {k:"notice",l:"整改通知单附件",d:"检查下发形成的通知单、检查记录表扫描件"},
  {k:"reply", l:"整改回复单附件",d:"项目部报送的整改回复单及整改佐证材料"}
];
var ATT_LIMIT=20*1024*1024;                 /* 附件单独放宽；文件中心仍为 5MB */
function validKind(k){ return k==="notice"||k==="reply"; }
function fmtSize(n){ return window.fileFmtSize?window.fileFmtSize(n):((n||0)+" B"); }
function extOf(n){ return window.fileExtOf?window.fileExtOf(n):"FILE"; }
function limit(){ return ATT_LIMIT; }
function limitText(){ return "20MB"; }

/* 懒初始化：不改 SEED、不动已有数据，旧库首次打开自动得到空数组 */
function all(){
  if(!DB().inspAttachments) DB().inspAttachments=[];
  return DB().inspAttachments;
}
function list(inspId,kind){
  return all().filter(function(a){ return a.inspId===inspId && (!kind||a.kind===kind); });
}
function count(inspId){ return list(inspId).length; }
function sheetOf(id){
  return (DB().inspections||[]).filter(function(r){return r.id===id;})[0]||null;
}
function orphans(){ return all().filter(function(a){ return !sheetOf(a.inspId); }); }

/* ---------- 权限 ---------- */
function lockMap(){
  if(!DB().ui) DB().ui={};
  if(!DB().ui.inspAttachLock) DB().ui.inspAttachLock={};
  return DB().ui.inspAttachLock;
}
function globalWritable(){
  var def=window.SCHEMA&&window.SCHEMA.inspections;
  return !(def&&def.readonly);
}
function isLocked(inspId){ return inspId?!!lockMap()[inspId]:false; }
function canWrite(inspId){
  if(!globalWritable()) return false;
  if(inspId&&isLocked(inspId)) return false;
  return true;
}
function setLock(inspId,on){
  if(!globalWritable()){ toast("当前台账为只读，不能修改归档锁定","err"); return false; }
  if(on) lockMap()[inspId]=true; else delete lockMap()[inspId];
  if(A.save()){ toast(on?"已归档锁定：该单禁止增删附件，仍可下载":"已解除归档锁定","ok"); return true; }
  toast("锁定状态保存失败：本地存储写入异常","err");
  return false;
}
function dropRec(rec){
  DB().inspAttachments=all().filter(function(a){return a.id!==rec.id;});
  if(rec.mode==="idb"&&window.fileBlobDel) window.fileBlobDel(rec.key).catch(function(){});
}

/* ---------- 上传 ---------- */
function upload(inspId,kind,files,onDone){
  if(!sheetOf(inspId)){ toast("上传失败：所属质量检查单不存在或已被删除","err"); if(onDone) onDone(0,0); return; }
  if(!validKind(kind)){ toast("上传失败：附件分类无效","err"); if(onDone) onDone(0,0); return; }
  if(!globalWritable()){ toast("当前台账为只读，不能上传附件","err"); if(onDone) onDone(0,0); return; }
  if(isLocked(inspId)){ toast("该检查单已归档锁定，不能上传附件；请先解除锁定","err"); if(onDone) onDone(0,0); return; }
  var arr=Array.prototype.slice.call(files||[]);
  if(!arr.length){ if(onDone) onDone(0,0); return; }
  var added=[];
  var tasks=arr.map(function(f){
    if(!f||!f.name){ toast("已跳过 1 个无名文件","err"); return Promise.resolve(false); }
    if(!f.size){ toast("「"+f.name+"」为 0 字节空文件，已跳过","err"); return Promise.resolve(false); }
    /* 同类同名：二次确认后替换旧版；取消则放弃本次上传，不产生两份 */
    var dup=list(inspId,kind).filter(function(a){return a.name===f.name;})[0];
    if(dup){
      if(!window.confirm("该类别下已存在同名附件「"+f.name+"」。\n点「确定」替换旧版，点「取消」放弃本次上传。")){
        toast("已取消上传："+f.name+"（存在同名附件）","err");
        return Promise.resolve(false);
      }
      dropRec(dup);
      toast("已替换同名旧版附件："+f.name,"ok");
    }
    var rec={
      id:A.uid("ia"), inspId:inspId, kind:kind,
      name:f.name, size:f.size, type:f.type||"", date:A.todayStr(),
      mode:f.size>limit()?"path":"idb", key:"", path:""
    };
    /* 超大文件：沿用双轨规则降级为路径索引 */
    if(rec.mode==="path"){
      var p=window.prompt("「"+f.name+"」超过 "+limitText()+"（"+fmtSize(f.size)+"），将只登记路径索引。\n请填写该附件在电脑上的完整路径：","");
      if(p===null){ toast("已取消上传："+f.name,"err"); return Promise.resolve(false); }
      rec.path=(p||"").trim();
      if(!rec.path){ toast("「"+f.name+"」未填写路径，已跳过","err"); return Promise.resolve(false); }
      all().push(rec); added.push(rec);
      toast("已登记路径索引："+f.name,"ok");
      return Promise.resolve(true);
    }
    rec.key="ia_"+rec.id;
    var put;
    try{ put=window.fileBlobPut?window.fileBlobPut(rec.key,f):Promise.reject(new Error("文件库未加载")); }
    catch(e){ put=Promise.reject(e); }
    return put.then(function(){
      all().push(rec); added.push(rec);
      toast("已上传："+f.name+"（"+fmtSize(f.size)+"）","ok");
      return true;
    }).catch(function(e){
      /* 权限/容量异常 → 与文件中心一致，降级为路径索引并明确告知 */
      var p2=window.prompt("本地文件库不可用（"+((e&&e.message)||"未知原因")+"）。\n「"+f.name+"」改为登记路径索引，请填写完整路径：","");
      if(p2===null){ toast("上传失败："+f.name+" 未保存","err"); return false; }
      rec.mode="path"; rec.key=""; rec.path=(p2||"").trim();
      all().push(rec); added.push(rec);
      toast("文件库不可用，「"+f.name+"」已改为路径索引（不能直接下载）","err");
      return true;
    });
  });
  Promise.all(tasks).then(function(rs){
    var okN=rs.filter(Boolean).length, badN=rs.length-okN;
    if(added.length&&!A.save()){
      /* 落库失败：回滚本次新增记录与已写入的二进制，避免产生孤儿文件 */
      var ids={}; added.forEach(function(r){ids[r.id]=1;});
      DB().inspAttachments=all().filter(function(r){return !ids[r.id];});
      added.forEach(function(r){
        if(r.mode==="idb"&&window.fileBlobDel) window.fileBlobDel(r.key).catch(function(){});
      });
      toast("上传已撤销：本地存储写入失败，请先在文件中心清理空间","err");
      okN=0; badN=rs.length;
    }
    toast("上传完成：成功 "+okN+" 个"+(badN?"，失败/取消 "+badN+" 个":""),okN?"ok":"err");
    if(onDone) onDone(okN,badN);
  }).catch(function(e){
    toast("上传异常："+((e&&e.message)||"未知错误"),"err");
    if(onDone) onDone(0,arr.length);
  });
}

/* ---------- 下载 ---------- */
function download(id){
  var rec=all().filter(function(a){return a.id===id;})[0];
  if(!rec){ toast("下载失败：附件记录不存在或已被删除","err"); return; }
  if(!sheetOf(rec.inspId)){ toast("下载失败：所属质量检查单已删除，附件无法定位","err"); return; }
  if(rec.mode==="path"){
    if(window.copyText) window.copyText(rec.path||"");
    toast("该附件为路径索引，浏览器内不存原件，无法直接下载；已复制路径","err");
    return;
  }
  if(!window.fileBlobGet){ toast("下载失败：文件库未加载，请重新构建页面","err"); return; }
  window.fileBlobGet(rec.key).then(function(blob){
    if(!blob) throw new Error("浏览器中找不到该文件原件（可能已清理浏览器数据或更换设备）");
    var url;
    try{ url=URL.createObjectURL(blob); }
    catch(e){ throw new Error("无法生成下载链接："+((e&&e.message)||"浏览器不支持")); }
    var a=document.createElement("a");
    a.href=url; a.download=rec.name||"附件";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{URL.revokeObjectURL(url);}catch(_e){} a.remove(); },500);
    toast("已开始下载："+(rec.name||"附件"),"ok");
  }).catch(function(e){
    toast("下载失败："+((e&&e.message)||"文件库读取异常"),"err");
  });
}

/* ---------- 删除 ---------- */
function remove(id,onDone){
  var rec=all().filter(function(a){return a.id===id;})[0];
  if(!rec){ toast("删除失败：附件记录不存在","err"); return; }
  if(!globalWritable()){ toast("当前台账为只读，不能删除附件","err"); return; }
  if(isLocked(rec.inspId)){ toast("该检查单已归档锁定，不能删除附件；请先解除锁定","err"); return; }
  if(!window.confirm("确定删除附件「"+rec.name+"」？此操作不可撤销。")) return;
  var p=(rec.mode==="idb"&&window.fileBlobDel)?window.fileBlobDel(rec.key).catch(function(){}):Promise.resolve();
  p.then(function(){
    DB().inspAttachments=all().filter(function(a){return a.id!==id;});
    if(A.save()) toast("已删除附件："+rec.name,"ok");
    else toast("删除失败：本地存储写入异常","err");
    if(onDone) onDone();
  }).catch(function(e){
    toast("删除失败："+((e&&e.message)||"文件库异常"),"err");
  });
}

/* ---------- 孤儿附件整批清理 ---------- */
function prune(onDone){
  if(!globalWritable()){ toast("当前台账为只读，不能清理附件","err"); return; }
  var os=orphans();
  if(!os.length){ toast("没有需要清理的孤儿附件","ok"); return; }
  var names=os.map(function(a,i){
    return (i+1)+". "+a.name+"（"+(a.kind==="reply"?"回复单":"通知单")+"）";
  }).join("\n");
  if(!window.confirm("以下 "+os.length+" 个附件的所属质量检查单已删除，确定清理？\n\n"+names+
      "\n\n将同时删除浏览器中的文件原件，不可撤销。")) return;
  var ids={}; os.forEach(function(a){ids[a.id]=1;});
  var tasks=os.map(function(a){
    return (a.mode==="idb"&&window.fileBlobDel)?window.fileBlobDel(a.key).catch(function(){}):Promise.resolve();
  });
  Promise.all(tasks).then(function(){
    DB().inspAttachments=all().filter(function(a){return !ids[a.id];});
    if(A.save()) toast("已清理 "+os.length+" 个孤儿附件","ok");
    else toast("清理失败：本地存储写入异常","err");
    if(onDone) onDone();
  });
}

/* ---------- 弹窗 UI：两类附件分栏管理 ---------- */
function statusTip(st){
  if(st==="已闭环") return "该单已闭环，新增附件请确认属补录归档材料。";
  if(st==="已回复待复核") return "该单已报送回复单待复核，上传回复单附件后请核对报送版本。";
  if(st==="复核退回") return "该单复核退回，重新报送后请更新回复单附件。";
  if(st==="待整改"||st==="整改中") return "该单尚在整改阶段，回复单附件可在报送后补传。";
  return "";
}
function listHTML(inspId,kind){
  var rows=list(inspId,kind).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
  if(!rows.length) return '<div class="empty" style="padding:22px 10px">暂无'+
    (kind==="notice"?"整改通知单":"整改回复单")+'附件</div>';
  var w=canWrite(inspId);
  return rows.map(function(r){
    var isPath=r.mode==="path";
    return '<div class="file-item">'+
      '<div class="file-ic" style="'+(isPath?"background:var(--amber-soft);color:var(--amber)":"")+'">'+esc(extOf(r.name))+'</div>'+
      '<div class="file-main">'+
        '<div style="font-size:13px;font-weight:600;word-break:break-all">'+esc(r.name)+'</div>'+
        '<div style="font-size:11.5px;color:var(--muted);margin-top:2px">'+
          esc(fmtSize(r.size))+' · '+esc(r.date||"—")+
          (isPath?' · <span style="color:var(--amber)">路径索引</span>':' · <span style="color:var(--green)">已存入浏览器</span>')+
        '</div>'+
        (isPath&&r.path?'<div style="font-size:11px;color:var(--muted);margin-top:3px;word-break:break-all">'+esc(r.path)+'</div>':'')+
      '</div>'+
      '<div class="row-actions">'+
        '<button class="btn sm" data-ia-dl="'+esc(r.id)+'">'+(isPath?"复制路径":"下载")+'</button>'+
        (w?'<button class="btn sm ghost" style="color:#c0392b" data-ia-rm="'+esc(r.id)+'">删</button>':'')+
      '</div></div>';
  }).join("");
}

function paint(mask,inspId){
  KINDS.forEach(function(k){
    var box=$("[data-ia-list='"+k.k+"']",mask);
    if(box) box.innerHTML=listHTML(inspId,k.k);
    var cnt=$("[data-ia-count='"+k.k+"']",mask);
    if(cnt) cnt.textContent="（"+list(inspId,k.k).length+"）";
  });
  /* 权限状态同步：readonly 与归档锁定切换时，上传入口/删除按钮随之隐藏，下载始终保留 */
  var w=canWrite(inspId), gw=globalWritable();
  $$("[data-ia-up]",mask).forEach(function(b){ b.style.display=w?"":"none"; });
  $$(".ia-drop",mask).forEach(function(d){ d.style.display=w?"":"none"; });
  var lk=$("[data-ia-lock]",mask);
  if(lk){ lk.checked=isLocked(inspId); lk.disabled=!gw; }
  var lkTip=$("[data-ia-locktip]",mask);
  if(lkTip) lkTip.textContent=isLocked(inspId)?"已归档锁定：仅可下载，禁止上传/删除":"";
  $$("[data-ia-dl]",mask).forEach(function(b){
    b.onclick=function(){ download(this.getAttribute("data-ia-dl")); };
  });
  $$("[data-ia-rm]",mask).forEach(function(b){
    b.onclick=function(){ remove(this.getAttribute("data-ia-rm"),function(){ paint(mask,inspId); }); };
  });
}

function open(inspId){
  var s=sheetOf(inspId);
  if(!s){ toast("所属质量检查单不存在或已被删除","err"); return; }
  var w=canWrite(inspId), gw=globalWritable(), tip=statusTip(s.fixStatus);
  var head='<div class="qd-info" style="margin-bottom:10px">'+
    '<div class="qd-info-r"><span>检查编号</span><b>'+esc(s.no||"—")+'</b></div>'+
    '<div class="qd-info-r"><span>检查日期</span><b>'+esc(s.date||"—")+'</b></div>'+
    '<div class="qd-info-r"><span>整改状态</span><b>'+esc(s.fixStatus||"—")+'</b></div>'+
    '</div>'+
    (tip?'<div class="hint" style="margin-bottom:8px;color:#b9770e">'+esc(tip)+'</div>':'')+
    '<div class="hint" style="margin-bottom:10px;line-height:1.7">两类附件分别管理，仅关联本检查单；'+
    '上传附件<b>不会改变整改状态</b>，也不影响原有整改回复流程。'+
    '≤'+limitText()+' 存入浏览器可离线下载，&gt;'+limitText()+' 只登记路径索引（只能复制路径）。'+
    (gw?'':'<br><b style="color:#c0392b">当前台账为只读，仅可下载附件。</b>')+'</div>'+
    (gw?'<label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;margin-bottom:10px">'+
        '<input type="checkbox" data-ia-lock="1"> 归档锁定（禁止上传/删除附件，仅可下载）'+
        '</label> <span data-ia-locktip="" style="font-size:11.5px;color:#c0392b"></span>':'');
  var cards='<div class="ia-grid">'+KINDS.map(function(k){
    return '<div class="card" style="margin:0">'+
      '<div class="card-h"><h3>'+esc(k.l)+'<span data-ia-count="'+k.k+'"></span></h3>'+
        '<div class="spacer"></div>'+
        (w?'<button class="btn sm primary" data-ia-up="'+k.k+'">+ 上传</button>'+
           '<input type="file" data-ia-file="'+k.k+'" multiple style="display:none" '+
           'accept=".doc,.docx,.pdf,.xls,.xlsx,.jpg,.jpeg,.png,.zip">':'')+
      '</div>'+
      '<div class="card-b" style="padding:12px 0 0">'+
        (w?'<div class="drop ia-drop" data-ia-drop="'+k.k+'" style="margin:0 12px;padding:14px">'+
           '<div style="font-size:12px;font-weight:600;color:var(--ink-2)">拖拽文件到此，或点击上传</div>'+
           '<div style="font-size:11px;margin-top:4px">'+esc(k.d)+'</div></div>':'')+
        '<div data-ia-list="'+k.k+'" style="margin-top:10px"></div>'+
      '</div></div>';
  }).join("")+'</div>';

  var mask=window.openModal({
    title:"检查单附件 · "+(s.no||""),
    body:head+cards,
    okText:"关闭", noCancel:true,
    afterRender:function(mask){
      paint(mask,inspId);
      var lk=$("[data-ia-lock]",mask);
      if(lk) lk.onchange=function(){
        if(setLock(inspId,this.checked)) paint(mask,inspId);
        else this.checked=isLocked(inspId);
      };
      $$("[data-ia-up]",mask).forEach(function(b){
        b.onclick=function(){ $("[data-ia-file='"+b.getAttribute("data-ia-up")+"']",mask).click(); };
      });
      $$("[data-ia-file]",mask).forEach(function(inp){
        inp.onchange=function(){
          var kind=this.getAttribute("data-ia-file"), fs=this.files;
          this.value="";
          upload(inspId,kind,fs,function(){ paint(mask,inspId); });
        };
      });
      $$("[data-ia-drop]",mask).forEach(function(dz){
        var kind=dz.getAttribute("data-ia-drop");
        dz.onclick=function(){ $("[data-ia-file='"+kind+"']",mask).click(); };
        dz.addEventListener("dragover",function(e){ e.preventDefault(); dz.classList.add("over"); });
        dz.addEventListener("dragleave",function(){ dz.classList.remove("over"); });
        dz.addEventListener("drop",function(e){
          e.preventDefault(); dz.classList.remove("over");
          upload(inspId,kind,e.dataTransfer.files,function(){ paint(mask,inspId); });
        });
      });
    }
  });
  /* 两栏并排需要更宽的画布；只作用于本弹窗，其他弹窗仍为 640px。
     窄屏下 width:100% + 视口约束会自动退回单栏，不影响移动端。 */
  var box=mask.querySelector(".modal");
  if(box) box.style.maxWidth="920px";
}

/* ---------- 总览：按检查单分组 + 孤儿附件标记与清理 ---------- */
function allHTML(){
  var sheets=(DB().inspections||[]).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
  var orph=orphans(), total=all().length;
  var h='<div class="hint" style="margin-bottom:10px;line-height:1.7">共 '+sheets.length+
    ' 张检查单、'+total+' 个附件。两张单据分别归到各自的检查单下；'+
    '选择一张检查单，即可分别上传、下载「整改通知单附件」与「整改回复单附件」。</div>';
  if(orph.length){
    h+='<div class="card" style="margin:0 0 12px;border-left:3px solid #c0392b">'+
      '<div class="card-h"><h3 style="color:#c0392b">孤儿附件（'+orph.length+'）</h3><div class="spacer"></div>'+
      (globalWritable()?'<button class="btn sm" data-ia-prune="1">清理孤儿附件</button>':'')+'</div>'+
      '<div class="card-b" style="padding:8px 14px;font-size:12px;line-height:1.9;color:var(--muted)">'+
      '所属质量检查单已删除，附件仍保留但无法下载；确认后可整批清理（含浏览器中的文件原件）。<br>'+
      orph.map(function(a){
        return '· '+esc(a.name)+'（'+(a.kind==="reply"?"回复单":"通知单")+'，'+esc(fmtSize(a.size))+'）';
      }).join("<br>")+'</div></div>';
  }
  h+='<div class="card" style="margin:0"><div class="card-b" style="padding:0">'+
    (sheets.length? sheets.map(function(s){
      var a=list(s.id,"notice").length, b=list(s.id,"reply").length;
      return '<div class="file-item">'+
        '<div class="file-main">'+
          '<div style="font-size:13px;font-weight:600">'+esc(s.no||"—")+
            '　<span style="font-size:11.5px;font-weight:400;color:var(--muted)">'+esc(s.date||"—")+
            ' · '+esc(s.fixStatus||"—")+'</span>'+
            (isLocked(s.id)?' <span class="tag t-gray">已归档锁定</span>':'')+'</div>'+
          '<div style="font-size:11.5px;color:var(--muted);margin-top:2px">'+
            '整改通知单附件 '+a+' 个 · 整改回复单附件 '+b+' 个</div>'+
        '</div>'+
        '<div class="row-actions"><button class="btn sm" data-ia-go="'+esc(s.id)+'">管理附件</button></div>'+
      '</div>';
    }).join("") : '<div class="empty" style="padding:22px 10px">暂无质量检查单</div>')+
    '</div></div>';
  return h;
}
function openAll(){
  window.openModal({
    title:"检查单附件总览",
    body:'<div data-ia-all="1"></div>',
    okText:"关闭", noCancel:true,
    afterRender:function(mask){
      function repaint(){
        var box=$("[data-ia-all]",mask);
        if(box) box.innerHTML=allHTML();
        $$("[data-ia-go]",mask).forEach(function(b){
          b.onclick=function(){
            var id=this.getAttribute("data-ia-go");
            var cb=mask.querySelector("[data-close]"); if(cb) cb.click();
            open(id);
          };
        });
        var pb=$("[data-ia-prune]",mask);
        if(pb) pb.onclick=function(){ prune(repaint); };
      }
      repaint();
    }
  });
}

window.InspAttach={
  open:open, openAll:openAll, upload:upload, download:download, remove:remove, prune:prune,
  list:list, count:count, all:all, orphans:orphans, kinds:KINDS,
  canWrite:canWrite, isLocked:isLocked, setLock:setLock, lockMap:lockMap, limit:limit
};
})();

</script>
<script>
/* ===== 施工方案内审记录附件：施工方案 / 审查记录 =====
   设计要点（v2.5，经设计确认）：
   1) 独立数组 DB().reviewAttachments，字段 reviewId 关联内审方案、kind 区分两类附件。
      **按 id 绑定**（不按方案名称）→ 方案改名不失联、新增方案自动覆盖。
      不写进 reviews 的任何业务字段 → 不触发 beforeSave，不改 KPI/CSV/导入器，
      原有内审记录功能与已有 6 条方案数据完全不受影响。
   2) 二进制复用文件中心同一 IndexedDB 库（key 加 ra_ 前缀），≤20MB 存浏览器、
      >20MB 或文件库不可用时降级为路径索引；文件中心自身仍保持 5MB 阈值。
   3) 「查看」= 页内即时完成：图片/PDF 用浏览器原生预览，doc/docx/pdf/xls/xlsx/
      txt/md 用工作台自带零依赖 Parse.parse 抽正文在弹窗内阅读；无文本层（扫描件、
      图片型 PDF）明确提示，可用 tools/review_attach_md.py（markitdown）转 .md 后
      作为普通附件重新上传（不新增第三类、不新增数据字段，.md 已在 Parse 白名单）。
   4) 权限沿用 schema.readonly；另按方案提供「归档锁定」，锁定后禁增删、仍可查看/下载。
   5) 上传逐条 + 汇总提示；查看/下载/删除对记录不存在、方案已删、路径索引、
      原件丢失、解析失败等均给明确提示，不静默失败。
   6) 同类同名附件二次确认后替换旧版（连旧二进制一起删）；方案被删后附件保留，
      总览标出「孤儿附件」并提供整批清理。
   7) 不按修改闭环状态硬拦截上传，只给软提示。 */
(function(){
"use strict";
var A=window.APP, $=A.$, $$=A.$$, esc=A.esc;
function DB(){return A.db;}
function toast(m,t){ if(window.toast) window.toast(m,t); else console.log(m); }

var KINDS=[
  {k:"plan",  l:"施工方案", tag:"t-p2",    d:"经审批的施工组织设计、专项施工方案正文及报审版扫描件"},
  {k:"record",l:"审查记录", tag:"t-amber", d:"内审意见表、审查记录、意见回复与修改闭环佐证材料"}
];
var ATT_LIMIT=20*1024*1024;                 /* 附件单独放宽；文件中心仍为 5MB */
function validKind(k){ return k==="plan"||k==="record"; }
function kindOf(k){ return KINDS.filter(function(x){return x.k===k;})[0]||KINDS[0]; }
function kindLabel(k){ return kindOf(k).l; }
function fmtSize(n){ return window.fileFmtSize?window.fileFmtSize(n):((n||0)+" B"); }
function extOf(n){ return window.fileExtOf?window.fileExtOf(n):"FILE"; }
function ext(n){ var m=/\.([a-z0-9]+)$/i.exec(String(n||"")); return m?m[1].toLowerCase():""; }
function isExcerpt(n){ return /^(md|markdown)$/.test(ext(n)); }
function limit(){ return ATT_LIMIT; }
function limitText(){ return "20MB"; }

/* 懒初始化：不改 SEED、不动已有数据，旧库首次打开自动得到空数组 */
function all(){
  if(!DB().reviewAttachments) DB().reviewAttachments=[];
  return DB().reviewAttachments;
}
function list(reviewId,kind){
  return all().filter(function(a){ return a.reviewId===reviewId && (!kind||a.kind===kind); });
}
function count(reviewId){ return list(reviewId).length; }
function planOf(id){
  return (DB().reviews||[]).filter(function(r){return r.id===id;})[0]||null;
}
function orphans(){ return all().filter(function(a){ return !planOf(a.reviewId); }); }

/* ---------- 权限 ---------- */
function lockMap(){
  if(!DB().ui) DB().ui={};
  if(!DB().ui.reviewAttachLock) DB().ui.reviewAttachLock={};
  return DB().ui.reviewAttachLock;
}
function globalWritable(){
  var def=window.SCHEMA&&window.SCHEMA.reviews;
  return !(def&&def.readonly);
}
function isLocked(reviewId){ return reviewId?!!lockMap()[reviewId]:false; }
function canWrite(reviewId){
  if(!globalWritable()) return false;
  if(reviewId&&isLocked(reviewId)) return false;
  return true;
}
function setLock(reviewId,on){
  if(!globalWritable()){ toast("当前台账为只读，不能修改归档锁定","err"); return false; }
  if(on) lockMap()[reviewId]=true; else delete lockMap()[reviewId];
  if(A.save()){ toast(on?"已归档锁定：该方案禁止增删附件，仍可查看与下载":"已解除归档锁定","ok"); return true; }
  toast("锁定状态保存失败：本地存储写入异常","err");
  return false;
}
function dropRec(rec){
  DB().reviewAttachments=all().filter(function(a){return a.id!==rec.id;});
  if(rec.mode==="idb"&&window.fileBlobDel) window.fileBlobDel(rec.key).catch(function(){});
}

/* ---------- 上传 ---------- */
function upload(reviewId,kind,files,onDone){
  if(!planOf(reviewId)){ toast("上传失败：所属内审方案不存在或已被删除","err"); if(onDone) onDone(0,0); return; }
  if(!validKind(kind)){ toast("上传失败：附件分类无效","err"); if(onDone) onDone(0,0); return; }
  if(!globalWritable()){ toast("当前台账为只读，不能上传附件","err"); if(onDone) onDone(0,0); return; }
  if(isLocked(reviewId)){ toast("该方案已归档锁定，不能上传附件；请先解除锁定","err"); if(onDone) onDone(0,0); return; }
  var arr=Array.prototype.slice.call(files||[]);
  if(!arr.length){ if(onDone) onDone(0,0); return; }
  var added=[];
  var tasks=arr.map(function(f){
    if(!f||!f.name){ toast("已跳过 1 个无名文件","err"); return Promise.resolve(false); }
    if(!f.size){ toast("「"+f.name+"」为 0 字节空文件，已跳过","err"); return Promise.resolve(false); }
    /* 同类同名：二次确认后替换旧版；取消则放弃本次上传，不产生两份 */
    var dup=list(reviewId,kind).filter(function(a){return a.name===f.name;})[0];
    if(dup){
      if(!window.confirm("「"+kindLabel(kind)+"」下已存在同名附件「"+f.name+"」。\n点「确定」替换旧版，点「取消」放弃本次上传。")){
        toast("已取消上传："+f.name+"（存在同名附件）","err");
        return Promise.resolve(false);
      }
      dropRec(dup);
      toast("已替换同名旧版附件："+f.name,"ok");
    }
    var rec={
      id:A.uid("ra"), reviewId:reviewId, kind:kind,
      name:f.name, size:f.size, type:f.type||"", date:A.todayStr(),
      mode:f.size>limit()?"path":"idb", key:"", path:""
    };
    /* 超大文件：沿用双轨规则降级为路径索引 */
    if(rec.mode==="path"){
      var p=window.prompt("「"+f.name+"」超过 "+limitText()+"（"+fmtSize(f.size)+"），将只登记路径索引。\n请填写该附件在电脑上的完整路径：","");
      if(p===null){ toast("已取消上传："+f.name,"err"); return Promise.resolve(false); }
      rec.path=(p||"").trim();
      if(!rec.path){ toast("「"+f.name+"」未填写路径，已跳过","err"); return Promise.resolve(false); }
      all().push(rec); added.push(rec);
      toast("已登记路径索引："+f.name,"ok");
      return Promise.resolve(true);
    }
    rec.key="ra_"+rec.id;
    var put;
    try{ put=window.fileBlobPut?window.fileBlobPut(rec.key,f):Promise.reject(new Error("文件库未加载")); }
    catch(e){ put=Promise.reject(e); }
    return put.then(function(){
      all().push(rec); added.push(rec);
      toast("已上传："+f.name+"（"+kindLabel(kind)+"，"+fmtSize(f.size)+"）","ok");
      return true;
    }).catch(function(e){
      /* 权限/容量异常 → 与文件中心一致，降级为路径索引并明确告知 */
      var p2=window.prompt("本地文件库不可用（"+((e&&e.message)||"未知原因")+"）。\n「"+f.name+"」改为登记路径索引，请填写完整路径：","");
      if(p2===null){ toast("上传失败："+f.name+" 未保存","err"); return false; }
      rec.mode="path"; rec.key=""; rec.path=(p2||"").trim();
      all().push(rec); added.push(rec);
      toast("文件库不可用，「"+f.name+"」已改为路径索引（不能直接下载）","err");
      return true;
    });
  });
  Promise.all(tasks).then(function(rs){
    var okN=rs.filter(Boolean).length, badN=rs.length-okN;
    if(added.length&&!A.save()){
      /* 落库失败：回滚本次新增记录与已写入的二进制，避免产生孤儿文件 */
      var ids={}; added.forEach(function(r){ids[r.id]=1;});
      DB().reviewAttachments=all().filter(function(r){return !ids[r.id];});
      added.forEach(function(r){
        if(r.mode==="idb"&&window.fileBlobDel) window.fileBlobDel(r.key).catch(function(){});
      });
      toast("上传已撤销：本地存储写入失败，请先在文件中心清理空间","err");
      okN=0; badN=rs.length;
    }
    toast("上传完成：成功 "+okN+" 个"+(badN?"，失败/取消 "+badN+" 个":""),okN?"ok":"err");
    if(onDone) onDone(okN,badN);
  }).catch(function(e){
    toast("上传异常："+((e&&e.message)||"未知错误"),"err");
    if(onDone) onDone(0,arr.length);
  });
}

/* ---------- 下载 ---------- */
function download(id){
  var rec=all().filter(function(a){return a.id===id;})[0];
  if(!rec){ toast("下载失败：附件记录不存在或已被删除","err"); return; }
  if(!planOf(rec.reviewId)){ toast("下载失败：所属内审方案已删除，附件无法定位","err"); return; }
  if(rec.mode==="path"){
    if(window.copyText) window.copyText(rec.path||"");
    toast("该附件为路径索引，浏览器内不存原件，无法直接下载；已复制路径","err");
    return;
  }
  if(!window.fileBlobGet){ toast("下载失败：文件库未加载，请重新构建页面","err"); return; }
  window.fileBlobGet(rec.key).then(function(blob){
    if(!blob) throw new Error("浏览器中找不到该文件原件（可能已清理浏览器数据或更换设备）");
    var url;
    try{ url=URL.createObjectURL(blob); }
    catch(e){ throw new Error("无法生成下载链接："+((e&&e.message)||"浏览器不支持")); }
    var a=document.createElement("a");
    a.href=url; a.download=rec.name||"附件";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{URL.revokeObjectURL(url);}catch(_e){} a.remove(); },500);
    toast("已开始下载："+(rec.name||"附件"),"ok");
  }).catch(function(e){
    toast("下载失败："+((e&&e.message)||"文件库读取异常"),"err");
  });
}

/* ---------- 查看（页内即时，零外部依赖） ---------- */
function toBuf(blob){
  if(blob.arrayBuffer) return blob.arrayBuffer().then(function(ab){return new Uint8Array(ab);});
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ res(new Uint8Array(fr.result)); };
    fr.onerror=function(){ rej(new Error("文件读取失败")); };
    fr.readAsArrayBuffer(blob);
  });
}
function viewHead(rec){
  var p=planOf(rec.reviewId);
  return '<div class="qd-info" style="margin-bottom:10px">'+
    '<div class="qd-info-r"><span>附件名称</span><b style="word-break:break-all">'+esc(rec.name||"—")+'</b></div>'+
    '<div class="qd-info-r"><span>附件类别</span><b>'+esc(kindLabel(rec.kind))+
      (isExcerpt(rec.name)?' · 文本摘录':'')+'</b></div>'+
    '<div class="qd-info-r"><span>所属方案</span><b style="word-break:break-all">'+esc(p&&p.title?p.title:"—")+'</b></div>'+
    '<div class="qd-info-r"><span>大小 / 上传</span><b>'+esc(fmtSize(rec.size))+' · '+esc(rec.date||"—")+'</b></div>'+
    '</div>';
}
function bindViewerDl(mask,rec){
  $$("[data-ra-vdl]",mask).forEach(function(b){
    b.onclick=function(){ download(rec.id); };
  });
}
function wide(mask){
  var box=mask&&mask.querySelector?mask.querySelector(".modal"):null;
  if(box) box.style.maxWidth="920px";
}
function openViewer(rec,blob){
  var e=ext(rec.name);
  var isImg=/^(jpg|jpeg|png|gif|bmp|webp|svg|ico|avif)$/.test(e);
  var head=viewHead(rec);
  var foot='<div class="hint" style="margin-top:8px;line-height:1.7">'+
    '查看不改变任何内审记录数据。'+
    (isExcerpt(rec.name)?'该附件为文本摘录（.md），正文直接显示在下方。':'')+
    '<button class="btn sm" data-ra-vdl="1" style="margin-left:8px">下载原件</button></div>';

  if(isImg||e==="pdf"){
    var url;
    try{ url=URL.createObjectURL(blob); }
    catch(err){ toast("查看失败：无法生成预览链接（"+((err&&err.message)||"浏览器不支持")+"）","err"); return; }
    var inner=isImg
      ? '<img src="'+url+'" alt="'+esc(rec.name)+'" style="display:block;max-width:100%;max-height:56vh;margin:0 auto;border-radius:6px">'
      : '<iframe src="'+url+'" style="width:100%;height:56vh;border:1px solid var(--line);border-radius:6px;background:#fff"></iframe>';
    var m=window.openModal({
      title:"查看附件 · "+(rec.name||""),
      body:head+'<div class="ra-view" style="padding:8px;background:var(--bg-2,#f6f8fa);border-radius:8px">'+inner+'</div>'+foot,
      okText:"关闭", noCancel:true,
      onClose:function(){ try{URL.revokeObjectURL(url);}catch(_e){} },
      afterRender:function(mask){ bindViewerDl(mask,rec); }
    });
    wide(m);
    toast("已打开「"+rec.name+"」的"+(isImg?"图片预览":"PDF 预览"),"ok");
    return;
  }

  toBuf(blob).then(function(u8){
    var res=window.Parse?window.Parse.parse(rec.name,u8):{type:"other",text:"",err:"解析器未加载"};
    var txt=res&&res.text?String(res.text):"";
    var tip="";
    if(!window.Parse) tip="解析器未加载，请重新构建页面。";
    else if(res.type==="err") tip="解析失败："+(res.err||"未知原因")+"，原件可能损坏或不是可解析的文档。";
    else if(!txt.trim()) tip="该附件没有可提取的文字内容（常见于扫描件、图片型 PDF 或压缩包）。"+
      "可用 tools/review_attach_md.py 转成 .md 后作为普通附件重新上传，即可在此查看正文；也可直接下载原件。";
    else if(res.type==="other") tip="该格式不支持在线解析正文，请下载后用对应软件打开。";
    var shown=txt.length>30000?txt.slice(0,30000)+"\n\n…（内容过长，仅显示前 30000 字，完整内容请下载原件）":txt;
    var body=head+
      (tip?'<div class="hint" style="margin-bottom:8px;color:#b9770e;line-height:1.7">'+esc(tip)+'</div>':'')+
      (txt.trim()?'<div class="ra-view" style="padding:12px 14px;background:var(--bg-2,#f6f8fa);border-radius:8px;'+
        'max-height:52vh;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.8">'+esc(shown)+'</div>'
        :'<div class="empty" style="padding:22px 10px">暂无可显示的正文内容</div>')+
      foot;
    var m=window.openModal({
      title:"查看附件 · "+(rec.name||""),
      body:body, okText:"关闭", noCancel:true,
      afterRender:function(mask){ bindViewerDl(mask,rec); }
    });
    wide(m);
    toast("已打开「"+rec.name+"」的正文"+(txt.trim()?"（"+txt.length+" 字）":"（无文本层）"),txt.trim()?"ok":"err");
  }).catch(function(err){
    toast("查看失败："+((err&&err.message)||"文件读取异常"),"err");
  });
}
function view(id){
  var rec=all().filter(function(a){return a.id===id;})[0];
  if(!rec){ toast("查看失败：附件记录不存在或已被删除","err"); return; }
  if(!planOf(rec.reviewId)){ toast("查看失败：所属内审方案已删除，附件无法定位","err"); return; }
  if(rec.mode==="path"){
    if(window.copyText) window.copyText(rec.path||"");
    toast("该附件为路径索引，浏览器内不存原件，无法在线查看；已复制路径，请在电脑中打开","err");
    return;
  }
  if(!window.fileBlobGet){ toast("查看失败：文件库未加载，请重新构建页面","err"); return; }
  window.fileBlobGet(rec.key).then(function(blob){
    if(!blob) throw new Error("浏览器中找不到该文件原件（可能已清理浏览器数据或更换设备）");
    openViewer(rec,blob);
  }).catch(function(e){
    toast("查看失败："+((e&&e.message)||"文件库读取异常"),"err");
  });
}

/* ---------- 删除 ---------- */
function remove(id,onDone){
  var rec=all().filter(function(a){return a.id===id;})[0];
  if(!rec){ toast("删除失败：附件记录不存在","err"); return; }
  if(!globalWritable()){ toast("当前台账为只读，不能删除附件","err"); return; }
  if(isLocked(rec.reviewId)){ toast("该方案已归档锁定，不能删除附件；请先解除锁定","err"); return; }
  if(!window.confirm("确定删除「"+kindLabel(rec.kind)+"」附件「"+rec.name+"」？此操作不可撤销。")) return;
  var p=(rec.mode==="idb"&&window.fileBlobDel)?window.fileBlobDel(rec.key).catch(function(){}):Promise.resolve();
  p.then(function(){
    DB().reviewAttachments=all().filter(function(a){return a.id!==id;});
    if(A.save()) toast("已删除附件："+rec.name,"ok");
    else toast("删除失败：本地存储写入异常","err");
    if(onDone) onDone();
  }).catch(function(e){
    toast("删除失败："+((e&&e.message)||"文件库异常"),"err");
  });
}

/* ---------- 孤儿附件整批清理 ---------- */
function prune(onDone){
  if(!globalWritable()){ toast("当前台账为只读，不能清理附件","err"); return; }
  var os=orphans();
  if(!os.length){ toast("没有需要清理的孤儿附件","ok"); return; }
  var names=os.map(function(a,i){
    return (i+1)+". "+a.name+"（"+kindLabel(a.kind)+"）";
  }).join("\n");
  if(!window.confirm("以下 "+os.length+" 个附件的所属内审方案已删除，确定清理？\n\n"+names+
      "\n\n将同时删除浏览器中的文件原件，不可撤销。")) return;
  var ids={}; os.forEach(function(a){ids[a.id]=1;});
  var tasks=os.map(function(a){
    return (a.mode==="idb"&&window.fileBlobDel)?window.fileBlobDel(a.key).catch(function(){}):Promise.resolve();
  });
  Promise.all(tasks).then(function(){
    DB().reviewAttachments=all().filter(function(a){return !ids[a.id];});
    if(A.save()) toast("已清理 "+os.length+" 个孤儿附件","ok");
    else toast("清理失败：本地存储写入异常","err");
    if(onDone) onDone();
  });
}

/* ---------- 弹窗 UI：两类附件分栏管理 ---------- */
function statusTip(st){
  if(st==="已闭环") return "该方案已闭环，新增附件请确认属补录归档材料。";
  if(st==="整改中") return "该方案正在整改闭环，上传审查记录后请核对意见回复版本。";
  if(st==="未开始") return "该方案尚未开始修改闭环，可先上传施工方案正文与审查记录。";
  return "";
}
function listHTML(reviewId,kind){
  var k=kindOf(kind);
  var rows=list(reviewId,kind).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
  if(!rows.length) return '<div class="empty" style="padding:18px 10px;line-height:1.8">'+
    '<div>暂未上传「'+esc(k.l)+'」附件</div>'+
    '<div class="hint" style="margin-top:4px">'+esc(k.d)+'</div></div>';
  var w=canWrite(reviewId);
  return rows.map(function(r){
    var isPath=r.mode==="path";
    return '<div class="file-item">'+
      '<div class="file-ic" style="'+(isPath?"background:var(--amber-soft);color:var(--amber)":"")+'">'+esc(extOf(r.name))+'</div>'+
      '<div class="file-main">'+
        '<div style="font-size:13px;font-weight:600;word-break:break-all">'+esc(r.name)+'</div>'+
        '<div style="font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;align-items:center;gap:4px">'+
          '<span class="tag '+k.tag+'">'+esc(k.l)+'</span>'+
          (isExcerpt(r.name)?'<span class="tag t-gray">文本摘录</span>':'')+
          '<span>'+esc(fmtSize(r.size))+' · '+esc(r.date||"—")+
          (isPath?' · <span style="color:var(--amber)">路径索引</span>':' · <span style="color:var(--green)">已存入浏览器</span>')+'</span>'+
        '</div>'+
        (isPath&&r.path?'<div style="font-size:11px;color:var(--muted);margin-top:3px;word-break:break-all">'+esc(r.path)+'</div>':'')+
      '</div>'+
      '<div class="row-actions">'+
        '<button class="btn sm" data-ra-view="'+esc(r.id)+'">查看</button>'+
        '<button class="btn sm" data-ra-dl="'+esc(r.id)+'">'+(isPath?"复制路径":"下载")+'</button>'+
        (w?'<button class="btn sm ghost" style="color:#c0392b" data-ra-rm="'+esc(r.id)+'">删</button>':'')+
      '</div></div>';
  }).join("");
}

function paint(mask,reviewId){
  KINDS.forEach(function(k){
    var box=$("[data-ra-list='"+k.k+"']",mask);
    if(box) box.innerHTML=listHTML(reviewId,k.k);
    var cnt=$("[data-ra-count='"+k.k+"']",mask);
    if(cnt) cnt.textContent="（"+list(reviewId,k.k).length+"）";
  });
  var w=canWrite(reviewId), gw=globalWritable();
  $$("[data-ra-up]",mask).forEach(function(b){ b.style.display=w?"":"none"; });
  $$(".ra-drop",mask).forEach(function(d){ d.style.display=w?"":"none"; });
  var lk=$("[data-ra-lock]",mask);
  if(lk){ lk.checked=isLocked(reviewId); lk.disabled=!gw; }
  var lkTip=$("[data-ra-locktip]",mask);
  if(lkTip) lkTip.textContent=isLocked(reviewId)?"已归档锁定：仅可查看/下载，禁止上传/删除":"";
  $$("[data-ra-view]",mask).forEach(function(b){
    b.onclick=function(){ view(this.getAttribute("data-ra-view")); };
  });
  $$("[data-ra-dl]",mask).forEach(function(b){
    b.onclick=function(){ download(this.getAttribute("data-ra-dl")); };
  });
  $$("[data-ra-rm]",mask).forEach(function(b){
    b.onclick=function(){ remove(this.getAttribute("data-ra-rm"),function(){ paint(mask,reviewId); }); };
  });
}

function open(reviewId){
  var s=planOf(reviewId);
  if(!s){ toast("所属内审方案不存在或已被删除","err"); return; }
  var w=canWrite(reviewId), gw=globalWritable(), tip=statusTip(s.closure);
  var head='<div class="qd-info" style="margin-bottom:10px">'+
    '<div class="qd-info-r"><span>方案名称</span><b style="word-break:break-all">'+esc(s.title||"—")+'</b></div>'+
    '<div class="qd-info-r"><span>方案类型</span><b>'+esc(s.type||"—")+'</b></div>'+
    '<div class="qd-info-r"><span>内审时间</span><b>'+esc(s.date||"—")+'</b></div>'+
    '<div class="qd-info-r"><span>修改闭环</span><b>'+esc(s.closure||"—")+'</b></div>'+
    '</div>'+
    (tip?'<div class="hint" style="margin-bottom:8px;color:#b9770e">'+esc(tip)+'</div>':'')+
    '<div class="hint" style="margin-bottom:10px;line-height:1.7">两类附件<b>分别管理、仅关联本方案</b>；'+
    '上传附件<b>不会改变内审记录的任何字段</b>，也不影响原有内审流程。'+
    '「查看」在页面内即时完成（图片/PDF 原生预览，Word/Excel/文本抽取正文）；'+
    '≤'+limitText()+' 存入浏览器可离线查看与下载，&gt;'+limitText()+' 只登记路径索引（只能复制路径）。'+
    '扫描件可用 tools/review_attach_md.py 转 .md 后上传查看正文。'+
    (gw?'':'<br><b style="color:#c0392b">当前台账为只读，仅可查看与下载附件。</b>')+'</div>'+
    (gw?'<label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;margin-bottom:10px">'+
        '<input type="checkbox" data-ra-lock="1"> 归档锁定（禁止上传/删除附件，仍可查看与下载）'+
        '</label> <span data-ra-locktip="" style="font-size:11.5px;color:#c0392b"></span>':'');
  var cards='<div class="ra-grid">'+KINDS.map(function(k){
    return '<div class="card" style="margin:0">'+
      '<div class="card-h"><h3>'+esc(k.l)+'附件<span data-ra-count="'+k.k+'"></span></h3>'+
        '<div class="spacer"></div>'+
        (w?'<button class="btn sm primary" data-ra-up="'+k.k+'">+ 上传</button>'+
           '<input type="file" data-ra-file="'+k.k+'" multiple style="display:none" '+
           'accept=".doc,.docx,.pdf,.xls,.xlsx,.md,.txt,.csv,.jpg,.jpeg,.png,.zip">':'')+
      '</div>'+
      '<div class="card-b" style="padding:12px 0 0">'+
        (w?'<div class="drop ra-drop" data-ra-drop="'+k.k+'" style="margin:0 12px;padding:14px">'+
           '<div style="font-size:12px;font-weight:600;color:var(--ink-2)">拖拽文件到此，或点击上传</div>'+
           '<div style="font-size:11px;margin-top:4px">'+esc(k.d)+'</div></div>':'')+
        '<div data-ra-list="'+k.k+'" style="margin-top:10px"></div>'+
      '</div></div>';
  }).join("")+'</div>';

  var mask=window.openModal({
    title:"方案附件 · "+(s.title&&s.title.length>22?s.title.slice(0,22)+"…":(s.title||"")),
    body:head+cards,
    okText:"关闭", noCancel:true,
    afterRender:function(mask){
      paint(mask,reviewId);
      var lk=$("[data-ra-lock]",mask);
      if(lk) lk.onchange=function(){
        if(setLock(reviewId,this.checked)) paint(mask,reviewId);
        else this.checked=isLocked(reviewId);
      };
      $$("[data-ra-up]",mask).forEach(function(b){
        b.onclick=function(){ $("[data-ra-file='"+b.getAttribute("data-ra-up")+"']",mask).click(); };
      });
      $$("[data-ra-file]",mask).forEach(function(inp){
        inp.onchange=function(){
          var kind=this.getAttribute("data-ra-file"), fs=this.files;
          this.value="";
          upload(reviewId,kind,fs,function(){ paint(mask,reviewId); });
        };
      });
      $$("[data-ra-drop]",mask).forEach(function(dz){
        var kind=dz.getAttribute("data-ra-drop");
        dz.onclick=function(){ $("[data-ra-file='"+kind+"']",mask).click(); };
        dz.addEventListener("dragover",function(e){ e.preventDefault(); dz.classList.add("over"); });
        dz.addEventListener("dragleave",function(){ dz.classList.remove("over"); });
        dz.addEventListener("drop",function(e){
          e.preventDefault(); dz.classList.remove("over");
          upload(reviewId,kind,e.dataTransfer.files,function(){ paint(mask,reviewId); });
        });
      });
    }
  });
  wide(mask);
}

/* ---------- 总览：按方案分组 + 孤儿附件标记与清理 ---------- */
function allHTML(){
  var plans=(DB().reviews||[]).slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
  var orph=orphans(), total=all().length;
  var h='<div class="hint" style="margin-bottom:10px;line-height:1.7">共 '+plans.length+
    ' 个内审方案、'+total+' 个附件。附件按「施工方案 / 审查记录」两类分别管理，'+
    '每个方案的附件相互独立；选择任一方案即可上传、查看、下载。</div>';
  if(orph.length){
    h+='<div class="card" style="margin:0 0 12px;border-left:3px solid #c0392b">'+
      '<div class="card-h"><h3 style="color:#c0392b">孤儿附件（'+orph.length+'）</h3><div class="spacer"></div>'+
      (globalWritable()?'<button class="btn sm" data-ra-prune="1">清理孤儿附件</button>':'')+'</div>'+
      '<div class="card-b" style="padding:8px 14px;font-size:12px;line-height:1.9;color:var(--muted)">'+
      '所属内审方案已删除，附件仍保留但无法查看与下载；确认后可整批清理（含浏览器中的文件原件）。<br>'+
      orph.map(function(a){
        return '· '+esc(a.name)+'（'+esc(kindLabel(a.kind))+'，'+esc(fmtSize(a.size))+'）';
      }).join("<br>")+'</div></div>';
  }
  h+='<div class="card" style="margin:0"><div class="card-b" style="padding:0">'+
    (plans.length? plans.map(function(s){
      var a=list(s.id,"plan").length, b=list(s.id,"record").length;
      return '<div class="file-item">'+
        '<div class="file-main">'+
          '<div style="font-size:13px;font-weight:600;word-break:break-all">'+esc(s.title||"—")+
            '　<span style="font-size:11.5px;font-weight:400;color:var(--muted)">'+esc(s.date||"—")+
            ' · '+esc(s.closure||"—")+'</span>'+
            (isLocked(s.id)?' <span class="tag t-gray">已归档锁定</span>':'')+'</div>'+
          '<div style="font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap">'+
            '<span class="tag t-p2">施工方案 '+a+'</span>'+
            '<span class="tag t-amber">审查记录 '+b+'</span>'+
            (!a||!b?'<span style="color:#b9770e">缺件提示：'+([]).concat(!a?["施工方案"]:[],!b?["审查记录"]:[]).join("、")+' 尚未上传</span>':'')+
          '</div>'+
        '</div>'+
        '<div class="row-actions"><button class="btn sm" data-ra-go="'+esc(s.id)+'">管理附件</button></div>'+
      '</div>';
    }).join("") : '<div class="empty" style="padding:22px 10px">暂无内审方案</div>')+
    '</div></div>';
  return h;
}
function openAll(){
  window.openModal({
    title:"方案附件总览",
    body:'<div data-ra-all="1"></div>',
    okText:"关闭", noCancel:true,
    afterRender:function(mask){
      function repaint(){
        var box=$("[data-ra-all]",mask);
        if(box) box.innerHTML=allHTML();
        $$("[data-ra-go]",mask).forEach(function(b){
          b.onclick=function(){
            var id=this.getAttribute("data-ra-go");
            var cb=mask.querySelector("[data-close]"); if(cb) cb.click();
            open(id);
          };
        });
        var pb=$("[data-ra-prune]",mask);
        if(pb) pb.onclick=function(){ prune(repaint); };
      }
      repaint();
    }
  });
}

window.ReviewAttach={
  open:open, openAll:openAll, upload:upload, view:view, download:download,
  remove:remove, prune:prune, list:list, count:count, all:all, orphans:orphans,
  kinds:KINDS, canWrite:canWrite, isLocked:isLocked, setLock:setLock,
  lockMap:lockMap, limit:limit, kindLabel:kindLabel, isExcerpt:isExcerpt
};
})();

</script>
<script>
/* ===== 工作空间站：本地文件夹扫描 → 规则识别 → 确认归档 ===== */
(function(){
"use strict";
var A=window.APP, $=A.$, $$=A.$$, esc=A.esc;
function DB(){return A.db;}

function wsCfg(){

/* ---------- 小工具 ---------- */
function pad(n){ return n<10?"0"+n:""+n; }
function nowStr(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function dateOf(ms){
  var d=ms?new Date(ms):new Date();
  if(isNaN(d.getTime())) d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function fmtSize(n){
  if(!n&&n!==0) return "—";
  if(n<1024) return n+" B";
  if(n<1048576) return (n/1024).toFixed(1)+" KB";
  return (n/1048576).toFixed(2)+" MB";
}
function extOf(name){
  var m=/\.([a-z0-9]+)$/i.exec(name||"");
  return m?m[1].toUpperCase():"FILE";
}
function joinPath(root,rel){
  var r=String(root||"").replace(/[\\/]+$/,"");
  var p=String(rel||"").replace(/\//g,"\\");
  return r? r+"\\"+p : p;
}
function cleanName(s){ return String(s||"").toLowerCase().replace(/\s+/g,""); }

/* ---------- 项目别名（弱匹配，只作提示） ---------- */
var ADMIN=/湖北省|黄石市|鄂州市|恩施州|宜昌市|黄冈市|大冶市|阳新县|罗田县|建始县|铁山区|西塞山区|鄂城区|夷陵区|黄石港区|下陆区/g;
function projAliases(){
  var out=[];
  (DB().projects||[]).forEach(function(p){
    var base=String(p.name||"").replace(ADMIN,"").replace(/[（）()、，,。\s]/g,"");
    var segs=base.split(/[县市区镇村组路及和等]/);
    var al=[];
    segs.forEach(function(s){
      if(s.length>=2) al.push(s.slice(0,4));
      if(s.length>=4) al.push(s.slice(0,3));
    });
    al.push(base.slice(0,3),base.slice(0,4),base.slice(0,5));
    al=al.filter(function(s){ return s.length>=2; });
    out.push({id:p.id,name:p.name,aliases:al});
  });
  return out;
}
function guessProject(text,pool){
  var t=String(text||"");
  var best=null,bestLen=0;
  pool.forEach(function(p){
    p.aliases.forEach(function(a){
      if(a.length>bestLen && t.indexOf(a)>=0){ best=p.id; bestLen=a.length; }
    });
  });
  return best||"";
}
function periodNote(s){
  var y=/(20\d{2})/.exec(s), m=/(\d{1,2})\s*月/.exec(s), out="";
  if(y) out+=y[1]+"年";
  if(m) out+=(+m[1])+"月";
  return out;
}

/* ---------- 识别引擎 ---------- */
function recognize(item,pool,cfg){
  cfg=cfg||wsCfg();
  var name=item.name, rel=item.rel;
  var dirs=rel.split("/").slice(0,-1);
  var hit="", module="", conf="";

  /* 1 目录映射：由深到浅，先精确、后包含 */
  var dirRules=cfg.dirRules||[];
  var i,j;
  for(i=dirs.length-1;i>=0&&!module;i--){
    for(j=0;j<dirRules.length;j++){
      if(dirs[i]===dirRules[j].dir){ module=dirRules[j].module; hit="目录「"+dirs[i]+"」"; conf="high"; break; }
    }
  }
  if(!module){
    for(i=dirs.length-1;i>=0&&!module;i--){
      for(j=0;j<dirRules.length;j++){
        if(dirs[i].indexOf(dirRules[j].dir)>=0){ module=dirRules[j].module; hit="目录「"+dirs[i]+"」"; conf="high"; break; }
      }
    }
  }

  /* 2 关键词：优先级高的先命中 */
  if(!module){
    var kws=(cfg.kwRules||[]).slice().sort(function(a,b){return (a.prio||2)-(b.prio||2);});
    var low=String(name||"").toLowerCase();
    for(i=0;i<kws.length;i++){
      if(kws[i].kw && low.indexOf(String(kws[i].kw).toLowerCase())>=0){
        module=kws[i].module; hit="关键词「"+kws[i].kw+"」"; conf="mid"; break;
      }
    }
  }

  /* 3 项目 + 期间（与模块判定并行） */
  var projectId=guessProject(rel+" "+name,pool);
  var note=periodNote(rel+" "+name);

  return {module:module,conf:conf||"low",hit:hit||"未命中规则",projectId:projectId,note:note};
}

/* ---------- 扫描结果状态 ---------- */
var ST={rows:[],snap:{},scanned:false,f:"all",q:"",open:{},rootName:"",ignored:0,gone:0,last:null};

var TEMP=/^(~\$|\.|thumbs\.db$|desktop\.ini$)/i;
function isTemp(name){ return TEMP.test(name)||/\.tmp$/i.test(name); }

function buildRows(fileList){
  var pool=projAliases();
  var cfg=wsCfg();
  var prev=(cfg.lastScan&&cfg.lastScan.snap)||{};
  var exist=DB().files||[];
  var relSet={},nameSize={};
  exist.forEach(function(f){
    if(f.rel) relSet[f.rel]=1;
    nameSize[(f.name||"")+"|"+(f.size||0)]=1;
  });

  var rows=[],snap={},rootName="",ignored=0;
  var arr=Array.prototype.slice.call(fileList||[]);
  for(var i=0;i<arr.length;i++){
    var f=arr[i];
    var rel=String(f.webkitRelativePath||f.name||"").replace(/\\/g,"/");
    if(rel.indexOf("/")>=0){
      var seg=rel.split("/");
      rootName=rootName||seg[0];
      rel=seg.slice(1).join("/");
    }
    var base=rel.split("/").pop();
    if(!base||isTemp(base)){ ignored++; continue; }
    var size=f.size||0, mt=f.lastModified||0;
    var key=size+"|"+mt;
    snap[rel]=key;
    var it={rel:rel,name:base,size:size,mt:mt,ext:extOf(base)};
    var r=recognize(it,pool,cfg);
    var dup = !!relSet[rel] || !!nameSize[base+"|"+size];
    var state = !prev[rel] ? "new" : (prev[rel]!==key ? "changed" : "same");
    rows.push({
      id:"r"+i, rel:rel, name:base, size:size, mt:mt, ext:it.ext,
      module:r.module, projectId:r.projectId, conf:r.conf, hit:r.hit, note:r.note,
      dup:dup, state:state,
      sel:!dup && !!r.module
    });
  }
  var gone=Object.keys(prev).filter(function(k){ return !snap[k]; }).length;
  ST.rows=rows; ST.snap=snap; ST.rootName=rootName; ST.ignored=ignored; ST.gone=gone; ST.scanned=true;
  ST.f="all"; ST.q=""; ST.open={};
  ST.rows.forEach(function(r){ if(!ST.open[r.module||"?"]) ST.open[r.module||"?"]=true; });
  ST.open["?"]=false;
}

/* 拖入文件夹：不依赖文件选择弹窗，走 DirectoryEntry 递归读取 */
function readEntry(entry,path,out,cb){
  if(!entry){ cb(); return; }
  if(entry.isFile){
    entry.file(function(f){
      out.push({name:f.name,size:f.size,lastModified:f.lastModified,
                webkitRelativePath:(path+entry.name)});
      cb();
    },function(){ cb(); });
    return;
  }
  if(entry.isDirectory){
    var reader=entry.createReader();
    (function batch(){
      reader.readEntries(function(list){
        if(!list||!list.length){ cb(); return; }
        var n=list.length,done=0;
        list.forEach(function(e){
          readEntry(e,path+entry.name+"/",out,function(){
            if(++done>=n) batch();
          });
        });
      },function(){ cb(); });
    })();
    return;
  }
  cb();
}
function handleDrop(e){
  var dt=e.dataTransfer;
  if(!dt) return;
  var entries=[],files=[];
  if(dt.items&&dt.items.length){
    for(var i=0;i<dt.items.length;i++){
      var it=dt.items[i];
      if(it.kind!=="file") continue;
      var en=it.webkitGetAsEntry?it.webkitGetAsEntry():null;
      if(en) entries.push(en); else if(it.getAsFile) files.push(it.getAsFile());
    }
  }
  if(!entries.length&&!files.length){
    if(dt.files&&dt.files.length) files=Array.prototype.slice.call(dt.files);
  }
  if(!entries.length){
    if(!files.length){ toast("没有识别到文件","err"); return; }
    handlePicked({files:files}); return;
  }
  toast("正在读取文件夹…","ok");
  var out=[],done=0;
  entries.forEach(function(en){
    readEntry(en,"",out,function(){
      if(++done>=entries.length){
        if(!out.length){ toast("文件夹里没有可读取的文件","err"); return; }
        if(out.length>1200){ toast("一次最多处理 1200 个文件，请拖入更小的子目录","err"); return; }
        buildRows(out);
        A.save();
        window.render("space");
        toast("已扫描 "+ST.rows.length+" 个文件","ok");
      }
    });
  });
}
function handlePicked(input){
  var files=input.files;
  if(!files||!files.length) return;
  if(files.length>1200){ toast("一次最多处理 1200 个文件，请选择更小的子目录","err"); return; }
  var cfg=wsCfg();
  if(files[0] && !files[0].webkitRelativePath){
    toast("未取得目录结构，已按文件名识别","err");
  }
  buildRows(files);
  cfg.lastRoot=ST.rootName||"";
  A.save();
  window.render("space");
  toast("已扫描 "+ST.rows.length+" 个文件","ok");
}

/* ---------- 统计 ---------- */
function statOf(){
  var s={total:ST.rows.length,newN:0,chg:0,same:0,dup:0,none:0};
  ST.rows.forEach(function(r){
    if(r.state==="new") s.newN++;
    else if(r.state==="changed") s.chg++;
    else s.same++;
    if(r.dup) s.dup++;
    if(!r.module) s.none++;
  });
  return s;
}
function visibleRows(){
  var q=ST.q?cleanName(ST.q):"";
  return ST.rows.filter(function(r){
    if(ST.f==="new"&&r.state!=="new") return false;
    if(ST.f==="changed"&&r.state!=="changed") return false;
    if(ST.f==="none"&&r.module) return false;
    if(ST.f==="dup"&&!r.dup) return false;
    if(q && cleanName(r.name+r.rel).indexOf(q)<0) return false;
    return true;
  });
}

/* ---------- 结果列表 ---------- */
function paintList(host){
  var box=$("#wsList",host); if(!box) return;
  var rows=visibleRows();
  var scroll=$(".ws-scroll",host);

  if(!rows.length){
    box.innerHTML='<div class="empty">没有符合筛选条件的文件</div>';
    syncAct(host);
    return;
  }

  /* 分组：按模块顺序 + 待定 */
  var order=MODULES.concat(["?"]);
  var groups={};
  rows.forEach(function(r){ var k=r.module||"?"; (groups[k]=groups[k]||[]).push(r); });

  var h="";
  order.forEach(function(k){
    var arr=groups[k]; if(!arr||!arr.length) return;
    var open=ST.open[k]!==false;
    var selN=arr.filter(function(r){return r.sel;}).length;
    h+='<div class="ws-grp">'+
      '<div class="ws-grp-h" data-grp="'+esc(k)+'">'+
        '<span class="ws-caret">'+(open?"▾":"▸")+'</span>'+
        '<b>'+(k==="?"?"待定（未识别）":esc(k))+'</b>'+
        '<span class="n">'+arr.length+' 个'+(selN?" · 已选 "+selN:"")+'</span>'+
        '<span class="spacer"></span>'+
        '<span class="ws-grp-go">'+(MOD_ROUTE[k]?'<button class="btn sm ghost" data-go="'+MOD_ROUTE[k]+'">进入模块</button>':'')+'</span>'+
      '</div>';
    if(open){
      h+='<div class="ws-rows">'+arr.map(rowHTML).join("")+'</div>';
    }
    h+='</div>';
  });
  box.innerHTML='<div class="ws-scroll">'+h+'</div>';

  if(scroll){ var st=scroll.scrollTop; var n=$(".ws-scroll",host); if(n) n.scrollTop=st; }

  $$("[data-grp]",box).forEach(function(el){
    el.onclick=function(e){
      if(e.target.closest("[data-go]")) return;
      var k=this.getAttribute("data-grp");
      ST.open[k]=ST.open[k]===false;
      paintList(host);
    };
  });
  $$("[data-go]",box).forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); location.hash="#/"+this.getAttribute("data-go"); }; });
  $$("[data-pick]",box).forEach(function(c){
    c.onchange=function(){
      var r=rowById(this.getAttribute("data-pick")); if(r) r.sel=this.checked;
      paintList(host);
    };
  });
  $$("[data-mod]",box).forEach(function(s){
    s.onchange=function(){
      var r=rowById(this.getAttribute("data-mod")); if(!r) return;
      r.module=this.value;
      r.sel=!!this.value && !r.dup;
      r.hit=this.value?"人工指定为「"+this.value+"」":"未指定";
      r.conf=this.value?"manual":"low";
      r.manual=true;
      if(!r.module) ST.open["?"]=true;
      paintList(host);
    };
  });
  $$("[data-proj]",box).forEach(function(s){
    s.onchange=function(){ var r=rowById(this.getAttribute("data-proj")); if(r) r.projectId=this.value; };
  });
  $$("[data-skip]",box).forEach(function(b){
    b.onclick=function(){ var r=rowById(this.getAttribute("data-skip")); if(r){ r.sel=false; r.skipped=true; paintList(host); } };
  });
  syncAct(host);
}

function rowById(id){ return ST.rows.filter(function(r){return r.id===id;})[0]; }

function rowHTML(r){
  var confTag = r.conf==="high"?'<span class="tag t-green">高</span>'
    : r.conf==="mid"?'<span class="tag t-amber">中</span>'

    : r.state==="changed"?'<span class="tag t-amber">变更</span>'

  return '<div class="ws-row'+(r.sel?" sel":"")+(r.dup?" dup":"")+'" data-row="'+esc(r.id)+'">'+
    '<input type="checkbox" class="ws-cb" data-pick="'+esc(r.id)+'"'+(r.sel?" checked":"")+'>'+
    '<div class="ws-ext">'+esc(r.ext.slice(0,4))+'</div>'+
    '<div class="ws-main">'+
      '<div class="ws-name" title="'+esc(r.rel)+'">'+esc(r.name)+'</div>'+

      '</select>'+

function syncAct(host){
  var sel=ST.rows.filter(function(r){return r.sel&&r.module;});
  var size=sel.reduce(function(s,r){return s+(r.size||0);},0);
  var none=ST.rows.filter(function(r){return !r.module;}).length;
  var el=$("#wsCount",host); if(el) el.textContent=sel.length;
  el=$("#wsSize",host); if(el) el.textContent=fmtSize(size);
  el=$("#wsHint",host);
  if(el) el.textContent = none? ("另有 "+none+" 个未识别，可在行内指定模块后再勾选") : "";
  el=$("#wsArchive",host);
  if(el) el.disabled = sel.length===0;
}

        '· 只登记路径索引，原件不会被移动、改名或删除；<br>'+

function execArchive(sel,root,solidify){
  var cfg=wsCfg();
  if(root){ cfg.root=root; }
  var batchId=A.uid("b");
  var at=nowStr();
  var cnt=0;
  var noProj=0;
  var newIds=[];
  var manualDirs={};

  sel.forEach(function(r){
    var rec={
      id:A.uid("f"), name:r.name, size:r.size, type:"", module:r.module,
      projectId:r.projectId||"", date:dateOf(r.mt), note:r.note||"",
      mode:"path", path:joinPath(root,r.rel), key:"",
      src:"ws", rel:r.rel, batchId:batchId, mt:r.mt, hit:r.hit||"",
      status:"pending", statusAt:fileNowStr()
    };
    DB().files.push(rec);
    newIds.push(rec.id);
    cnt++;
    if(!rec.projectId) noProj++;
    if(solidify && r.manual && r.module){
      var d=r.rel.split("/").slice(0,-1).pop()||"";
      if(d) manualDirs[d]=r.module;
    }
  });

  if(solidify){
    Object.keys(manualDirs).forEach(function(d){
      var ex=(cfg.dirRules||[]).filter(function(x){return x.dir===d;})[0];
      if(ex) ex.module=manualDirs[d];
      else (cfg.dirRules=cfg.dirRules||[]).push({id:newId("d"),dir:d,module:manualDirs[d]});
    });
  }

  var skipped=ST.rows.length-sel.length;
  (DB().wsBatches=DB().wsBatches||[]).unshift({
    id:batchId, at:at, root:root, total:ST.rows.length,
    archived:cnt, skipped:skipped, undone:false, byMod:cnt, noProj:noProj
  });

  cfg.lastScan={at:at, count:ST.rows.length, snap:ST.snap};

  A.save();
  /* v1.9：归档后批量解析（串行、不阻塞归档结果） */
  if(window.IMPORT&&window.IMPORT.enqueue&&newIds.length){
    setTimeout(function(){ try{ window.IMPORT.enqueue(newIds.slice(0,40)); }catch(e){} },600);
  }
  ST.last={batchId:batchId,count:cnt};
  ST.scanned=false; ST.rows=[];
  toast("已归档 "+cnt+" 个文件","ok");
  window.render("space");

  /* 归档完成提示 */
  setTimeout(function(){
    openModal({
      title:"归档完成",
      okText:"进入文件中心",
      noCancel:true,
      body:'<p style="margin:0 0 8px;font-size:13.5px">本次共归档 <b>'+cnt+'</b> 个文件，跳过 '+skipped+' 个。</p>'+
        '<p style="margin:0 0 8px;font-size:13px;color:#b9770e">这些记录均为<b>待确认</b>状态，请在文件中心或项目页逐条确认归属。</p>'+
        (noProj?'<p style="margin:0 0 8px;font-size:12.5px;color:var(--muted)">其中 <b>'+noProj+'</b> 个未识别到项目，可在文件中心「详情」里补关联项目。</p>':'')+
        '<p style="margin:0;font-size:12.5px;color:var(--muted);line-height:1.7">文件已登记到对应模块，原件仍在 '+
        esc(root||"原目录")+'。<br>如需回退，可在「归档批次」中撤销该批。</p>',
      onOk:function(){ location.hash="#/files"; }
    });
  },260);
}

/* ---------- 识别清单 CSV ---------- */
function dl(name,text,mime){
  var blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },400);
}
function cell(v){
  var s=v===null||v===undefined?"":String(v);
  s=s.replace(/"/g,'""');
  return /[",\n\r]/.test(s)?'"'+s+'"':s;
}
function exportScanCSV(){
  var head=["相对路径","文件名","大小","修改日期","识别模块","置信度","命中理由","关联项目","状态","是否已归档"];
  var lines=[head.join(",")];
  var confName={high:"高",mid:"中",manual:"人工",low:"待定"};
  ST.rows.forEach(function(r){
    var p=(DB().projects||[]).filter(function(x){return x.id===r.projectId;})[0];
    lines.push([r.rel,r.name,r.size,dateOf(r.mt),r.module||"待定",confName[r.conf]||"",r.hit,
      p?p.name:"",r.state==="new"?"新增":r.state==="changed"?"变更":"无变化",r.dup?"是":"否"].map(cell).join(","));
  });
  dl("工作空间站_识别清单_"+A.todayStr()+".csv","\ufeff"+lines.join("\r\n"),"text/csv;charset=utf-8");
  toast("已导出 "+ST.rows.length+" 条","ok");
}

      '<select data-prio>'+[1,2,3].map(function(p){return '<option value="'+p+'"'+(r&&r.prio===p?" selected":"")+'>'+(p===1?"优先 1":p===2?"优先 2":"优先 3")+'</option>';}).join("")+'</select>'+

    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;line-height:1.7">'+

    '<div id="ruleDir" class="ws-rule-box">'+cfg.dirRules.map(dirRow).join("")+'</div>'+
    '<button class="btn sm" id="addDir" style="margin:6px 0 14px">+ 添加目录规则</button>'+
    '<div class="ws-rule-h">关键词 → 模块 <span class="hint">共 <b id="rcKw">'+cfg.kwRules.length+'</b> 条</span></div>'+
    '<div id="ruleKw" class="ws-rule-box">'+cfg.kwRules.map(kwRow).join("")+'</div>'+
    '<button class="btn sm" id="addKw" style="margin:6px 0 12px">+ 添加关键词规则</button>'+

      '<button class="btn sm" id="impRules">导入规则 JSON</button>'+
      '<button class="btn sm" id="rstRules" style="color:#c0392b">恢复内置默认</button>'+
      '<input type="file" id="ruleFile" accept=".json,application/json" style="display:none">'+
    '</div>';

  var mask=openModal({
    title:"识别规则维护", body:body, okText:"保存规则",
    onOk:function(scope){
      var dirs=[],kws=[];
      $$('#ruleDir [data-kind="dir"]',scope).forEach(function(row){
        var d=$("[data-dir]",row).value.trim();
        if(!d) return;
        dirs.push({id:newId("d"),dir:d,module:$("[data-mod]",row).value});
      });
      $$('#ruleKw [data-kind="kw"]',scope).forEach(function(row){
        var k=$("[data-kw]",row).value.trim();
        if(!k) return;
        kws.push({id:newId("k"),kw:k,module:$("[data-mod]",row).value,prio:+$("[data-prio]",row).value||2});
      });
      cfg.dirRules=dirs; cfg.kwRules=kws;
      A.save(); toast("规则已保存","ok");
      if(ST.scanned){ reclassify(); window.render("space"); }
      return true;
    }

    $$("[data-del]",mask).forEach(function(b){

/* 规则变更后对当前扫描结果重新识别（保留人工指定） */
function reclassify(){
  var pool=projAliases();
  var cfg=wsCfg();

    h+='<div style="padding:9px 14px;font-size:12px;color:var(--muted)">另有 '+moreP+
      ' 个待确认文件未在此显示，<button class="btn sm ghost" data-mf-go="1">去文件中心处理</button></div>';
  }

  $$("[data-mf-go]",host).forEach(function(b){ b.onclick=function(){ location.hash="#/files"; }; });
  $$("[data-mf-all]",host).forEach(function(b){ b.onclick=function(){ opt.projectId=""; rerender(); }; });
  var sel=$("[data-mf-proj]",host);
  if(sel) sel.onchange=function(){ opt.projectId=this.value; rerender(); };
  /* 兜底行（data-mf-path）仅在 fileRowHTML 缺失时存在 */
  $$("[data-mf-path]",host).forEach(function(b){
    b.onclick=function(){
      var id=this.getAttribute("data-mf-path");
      var f=(DB().files||[]).filter(function(x){return x.id===id;})[0]; if(!f) return;
      if(f.mode==="idb" && window.fileDownload) window.fileDownload(f.id);
      else if(window.copyText) window.copyText(f.path||"");

    };
  });
  if(window.fileBind){
    window.fileBind(host,function(){ rerender(); if(window.refreshNav) window.refreshNav(); });
  }
};

    rq.onsuccess=function(){ idbDb=rq.result; res(idbDb); };
    rq.onerror=function(){ rej(rq.error||new Error("打开数据库失败")); };
  });
