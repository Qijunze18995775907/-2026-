<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>2026年公司质量管理台账 · 工作台</title>
<style>
/* ===== 2026年公司质量管理台账工作台 ===== */
:root{
  --bg:#eef2f7; --panel:#ffffff; --panel-2:#f8fafc;
  --ink:#16202c; --ink-2:#3d4a5c; --muted:#6b7a8d; --line:#dfe5ec;
  --brand:#0f4c81; --brand-2:#1a6fa8; --brand-soft:#e7f0f8;
  --red:#c0392b; --red-soft:#fdecea;
  --green:#1f8b4c; --green-soft:#e8f5ee;
  --amber:#b9770e; --amber-soft:#fdf3e2;
  --blue:#1a6fa8; --blue-soft:#e7f0f8;
  --gray-soft:#eef1f5;
  --shadow:0 1px 2px rgba(16,32,48,.06),0 8px 24px rgba(16,32,48,.06);
  --shadow-lg:0 12px 40px rgba(16,32,48,.16);
  --r:10px; --r-sm:7px;
  --sidebar:236px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans SC",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand-2);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c8d2de;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);background:#0d3350;color:#cfe0ef;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;
}
.brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand h1{font-size:15px;margin:0 0 3px;color:#fff;font-weight:700;letter-spacing:.3px;line-height:1.4}
.brand p{margin:0;font-size:11.5px;color:#8fb3ce;letter-spacing:.4px}
.nav{flex:1;overflow-y:auto;padding:10px 8px 20px}
.nav::-webkit-scrollbar-thumb{background:#1d4b6d;border-color:#0d3350}
.nav-group{font-size:11px;color:#6f96b4;padding:12px 10px 6px;letter-spacing:1px}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  color:#c9dceb;font-size:13px;margin-bottom:2px;cursor:pointer;border:0;background:none;
  width:100%;text-align:left;transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--brand-2);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav-item .ic{width:16px;text-align:center;font-size:14px;flex:0 0 16px}
.nav-item .badge{margin-left:auto;background:rgba(255,255,255,.16);border-radius:9px;padding:1px 7px;font-size:11px}
.nav-item.active .badge{background:rgba(0,0,0,.22)}
.side-foot{padding:10px 14px 14px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#7fa3bf}
.side-foot b{color:#a9c8de;font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30;flex-wrap:wrap;
}
.topbar h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
.topbar .sub{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.content{padding:20px 22px 60px;min-width:0}
.menu-btn{display:none}

/* ===== 通用组件 ===== */
.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  color:var(--ink-2);padding:7px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:500;
  transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#c3d0dd;background:var(--panel-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{background:var(--gray-soft);color:var(--ink)}
.btn.danger{color:var(--red);border-color:#f0cfcb}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;font-weight:700}
.card-h .hint{font-size:12px;color:var(--muted)}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}

.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-p0{background:var(--red-soft);color:var(--red)}
.t-p1{background:var(--amber-soft);color:var(--amber)}
.t-p2{background:var(--blue-soft);color:var(--blue)}
.t-done{background:var(--green-soft);color:var(--green)}
.t-doing{background:var(--blue-soft);color:var(--blue)}
.t-todo{background:var(--gray-soft);color:var(--muted)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-green{background:var(--green-soft);color:var(--green)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-gray{background:var(--gray-soft);color:var(--muted)}

.kpi{padding:15px 16px}
.kpi .k{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:5px}
.up{color:var(--red)} .down{color:var(--green)}

/* 表格 */
.table-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:#fff}
table.tb{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.tb th{
  background:#f4f7fa;text-align:left;padding:9px 12px;font-weight:600;color:var(--ink-2);
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2;font-size:12.5px;
}
table.tb td{padding:9px 12px;border-bottom:1px solid #eef1f5;vertical-align:top}
table.tb tbody tr:hover{background:#fafcfe}
table.tb tbody tr:last-child td{border-bottom:0}
table.tb td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tb .cell-main{font-weight:600;color:var(--ink)}
table.tb .cell-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px}
.row-actions{display:flex;gap:4px;white-space:nowrap;flex:0 0 auto}

/* 筛选栏 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{
  border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;background:#fff;outline:none;
  transition:border-color .15s,box-shadow .15s;min-width:0;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(26,111,168,.12)}
textarea{resize:vertical;min-height:64px;width:100%}
.search{position:relative;flex:1;min-width:150px;max-width:280px}
.search input{width:100%;padding-left:30px}
.search::before{content:"⌕";position:absolute;left:10px;top:6px;color:var(--muted);font-size:15px}

/* 进度条 */
.bar{height:7px;background:#e8edf3;border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand-2);border-radius:6px;transition:width .4s ease}
.bar.g > i{background:var(--green)} .bar.r > i{background:var(--red)} .bar.a > i{background:var(--amber)}

/* 模态框 */
.modal-mask{
  position:fixed;inset:0;background:rgba(11,26,40,.5);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto;
}
.modal{
  background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);
  animation:pop .18s ease;margin:auto;
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-size:15.5px;flex:1}
.modal-b{padding:18px 20px;max-height:calc(100vh - 240px);overflow:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--panel-2);border-radius:0 0 12px 12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.form-grid textarea{min-height:76px}
.close-x{border:0;background:none;font-size:21px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px}
.close-x:hover{background:var(--gray-soft);color:var(--ink)}

/* 提示条 */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:#16283a;color:#fff;padding:9px 16px;border-radius:22px;font-size:13px;
  box-shadow:var(--shadow-lg);animation:tin .2s ease;max-width:90vw;
}
.toast.ok{background:#1a7a48} .toast.err{background:#a93226}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 计划看板 */
.tabs{display:flex;gap:4px;background:var(--gray-soft);padding:3px;border-radius:9px;flex-wrap:wrap}
.tab{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:600}
.tab.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(16,32,48,.12)}
.task-row{
  display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid #eef1f5;
  background:#fff;transition:background .12s;
}
.task-row:hover{background:#fafcfe}
.task-row:last-child{border-bottom:0}
.task-row .chk{
  flex:0 0 17px;width:17px;height:17px;border:1.8px solid #b9c6d4;border-radius:5px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:.15s;
}
.task-row .chk:hover{border-color:var(--brand-2)}
.task-row.done .chk{background:var(--green);border-color:var(--green);color:#fff}
.task-row.done .t-title{text-decoration:line-through;color:var(--muted)}
.task-row .body{flex:1;min-width:0}
.task-row .t-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.45;word-break:break-word}
.task-row .t-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:11.5px;color:var(--muted)}
.task-row.overdue{border-left:3px solid var(--red);background:#fffafa}
.task-row .ovd{color:var(--red);font-weight:700}
.overdue-flag{background:var(--red-soft);color:var(--red);border-radius:4px;padding:0 5px;font-weight:700;font-size:11px}

/* 仪表盘 */
.ring{position:relative;width:100%;max-width:150px;margin:0 auto}
.ring svg{display:block;width:100%;height:auto;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-size:23px;font-weight:700;letter-spacing:-.6px;line-height:1}
.ring .val span{font-size:11px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);justify-content:center;margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}

/* 项目卡 */
.proj-card{padding:14px 16px;cursor:pointer;transition:.15s;border-left:3px solid transparent}
.proj-card:hover{background:var(--panel-2);border-left-color:var(--brand-2)}
.proj-card .pn{font-size:13.5px;font-weight:700;line-height:1.45;margin-bottom:6px}
.proj-card .pm{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:8px}

/* 文件 */
.drop{
  border:2px dashed #c8d5e2;border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--muted);
  background:var(--panel-2);transition:.15s;cursor:pointer;
}
.drop:hover,.drop.over{border-color:var(--brand-2);background:var(--brand-soft);color:var(--brand)}
.file-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eef1f5}
.file-item:last-child{border-bottom:0}
.file-ic{width:30px;height:30px;border-radius:6px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 30px}
.file-main{flex:1;min-width:0}

/* 打印 */
@media print{
  .sidebar,.topbar,.toolbar,.btn,.nav,.modal-mask{display:none !important}
  body{background:#fff}
  .content{padding:0}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
  table.tb th{background:#eee !important;-webkit-print-color-adjust:exact}
}

/* 响应式 */
@media (max-width:1080px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  :root{--sidebar:0px}
  .sidebar{
    position:fixed;left:0;top:0;width:250px;flex-basis:250px;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:var(--shadow-lg);
  }
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex}
  .content{padding:14px 12px 70px}
  .topbar{padding:10px 12px}
  .g3,.g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid{grid-template-columns:1fr}
  .modal-mask{padding:12px 8px}
  .modal-b{max-height:calc(100vh - 200px)}
  table.tb{font-size:12.5px}
  table.tb th,table.tb td{padding:8px 9px}
}
@media (max-width:520px){
  .g4{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:22px}
  .topbar h2{font-size:15px}
  .task-row{flex-wrap:wrap}
  .task-row .row-actions{width:100%;justify-content:flex-end;margin-top:4px;padding-left:27px}
  .task-row .t-meta{gap:6px}
  .file-item{flex-wrap:wrap}
  .file-item .row-actions{order:3;width:100%;justify-content:flex-end;padding-left:40px;margin-top:4px}
  .card-h{padding:12px 14px}
}
.nav-scrim{display:none}
@media (max-width:860px){
  .nav-scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
}

/* 待处理事项 */
.grp-h{
  display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f4f7fa;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.3px;
}
.grp-h .n{font-weight:600;color:var(--muted);font-size:11.5px}
.task-row .chk.static{cursor:default;border-color:#e2e9f0;background:#fbfcfe}
@media (max-width:520px){
  .grp-h{padding:7px 12px}
}

/* ===== 仪表盘 KPI 可点击 ===== */
.kpi-link{display:block;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
.kpi-link:hover{border-color:#b9cfe3;box-shadow:0 8px 22px rgba(16,32,48,.10);transform:translateY(-1px)}
.kpi-link:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.kpi-arrow{margin-left:auto;color:#c3d0dd;font-size:13px;font-weight:700}
.kpi-link:hover .kpi-arrow{color:var(--brand-2)}

/* ===== 工作空间站 ===== */
.ws-setup{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.ws-btns{display:flex;gap:8px;flex-wrap:wrap}
.ws-stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.ws-stat b{color:var(--ink-2)}
.ws-tip{
  margin-top:10px;padding:9px 12px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--r-sm);font-size:12px;color:var(--ink-2);line-height:1.75;
}
.ws-tip b{color:var(--red)}
.ws-drop{
  margin-top:10px;border:2px dashed #cbd8e4;border-radius:var(--r-sm);padding:14px;text-align:center;
  color:var(--muted);background:#fcfdfe;cursor:pointer;transition:.15s;
}
.ws-drop:hover,.ws-drop.over{border-color:var(--brand-2);background:var(--brand-soft);color:var(--brand)}
.ws-drop-t{font-size:12.5px;font-weight:600}
.ws-drop-d{font-size:11.5px;margin-top:3px;opacity:.85}

.ws-figs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ws-fig{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;min-width:80px;text-align:center}
.ws-fig b{display:block;font-size:19px;line-height:1.2}
.ws-fig span{font-size:11px;color:var(--muted)}
.c-green{color:var(--green)} .c-red{color:var(--red)} .c-amber{color:var(--amber)} .c-muted{color:var(--muted)}
.ws-tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

.ws-grp{border-top:1px solid var(--line)}
.ws-grp:first-child{border-top:0}
.ws-grp-h{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f4f7fa;font-size:12.5px;cursor:pointer;user-select:none}
.ws-grp-h:hover{background:#eef3f8}
.ws-grp-h b{font-size:12.5px}
.ws-grp-h .n{color:var(--muted);font-size:11.5px;font-weight:400}
.ws-caret{color:var(--muted);font-size:10px;width:12px;flex:0 0 12px}
.ws-scroll{max-height:540px;overflow:auto}

.ws-row{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid #eef1f5;background:#fff}
.ws-row:hover{background:#fafcfe}
.ws-row.sel{background:#f7fbff}
.ws-row.dup{opacity:.72}
.ws-cb{width:16px;height:16px;margin-top:13px;flex:0 0 16px}
.ws-ext{
  width:34px;height:34px;border-radius:6px;background:var(--brand-soft);color:var(--brand);
  font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 34px;margin-top:2px;
}
.ws-main{flex:1;min-width:0}
.ws-name{font-size:13px;font-weight:600;word-break:break-all;line-height:1.45}
.ws-meta{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-all}
.ws-why{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:11px;color:var(--muted)}
.ws-op{display:flex;flex-direction:column;gap:5px;flex:0 0 156px}
.ws-op select{font-size:11.5px;padding:4px 6px;width:100%}

.ws-act{
  position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:0 0 var(--r) var(--r);
  box-shadow:0 -6px 16px rgba(16,32,48,.05);
}
.ws-act-txt{font-size:12.5px;color:var(--ink-2)}
.ws-act-sub{color:var(--muted);margin-left:8px;font-size:11.5px}
.ws-chk{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-left:auto}

.ws-empty{text-align:center;padding:34px 16px}
.ws-empty-ic{font-size:34px;color:#c3d0dd;line-height:1}
.ws-empty-t{font-size:15px;font-weight:700;margin-top:8px}
.ws-empty-d{font-size:12.5px;color:var(--muted);max-width:540px;margin:6px auto 0;line-height:1.85}
.ws-step{display:flex;gap:12px;align-items:flex-start}
.ws-step p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.7}
.ws-num{
  width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 26px;font-size:12px;
}

.ws-rule-h{font-size:12.5px;font-weight:700;margin:4px 0 6px;display:flex;gap:8px;align-items:center}
.ws-rule-h .hint{font-weight:400;color:var(--muted);font-size:11.5px}
.ws-rule-box{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.rule-row{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid #eef1f5}
.rule-row:last-child{border-bottom:0}
.rule-row input{flex:1;min-width:90px;padding:5px 8px;font-size:12px}
.rule-row select{font-size:12px;padding:5px 6px}

.ws-batch-row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eef1f5}
.ws-batch-row:last-child{border-bottom:0}
.ws-batch-row.undone{opacity:.62}

@media (max-width:860px){
  .ws-row{flex-wrap:wrap}
  .ws-op{flex:0 0 100%;flex-direction:row;padding-left:44px}
  .ws-scroll{max-height:none}
  .ws-act{position:static;box-shadow:none}
  .ws-chk{margin-left:0;width:100%}
  .ws-act .btn{flex:1}
  .rule-row{flex-wrap:wrap}
}

/* ===== 仪表盘 5 列 KPI ===== */
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}

/* ===== 快速入口（可绑定文件夹） ===== */
.qe-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qe{
  position:relative;display:flex;align-items:center;gap:6px;
  padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:#fbfcfe;color:var(--ink-2);font-size:13px;font-weight:600;
  transition:border-color .14s,background .14s,box-shadow .14s;min-width:0;
}
.qe:hover{border-color:#b9cfe3;background:#fff;box-shadow:0 6px 16px rgba(16,32,48,.07);color:var(--brand)}
.qe.bound{background:var(--brand-soft);border-color:#c5dcee;color:var(--brand)}
.qe-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.qe-n{
  font-size:11px;font-weight:700;color:#fff;background:var(--brand-2);
  border-radius:9px;padding:1px 6px;line-height:1.5;flex:0 0 auto;
}
.qe-dot{
  width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 7px;
  box-shadow:0 0 0 3px rgba(192,57,43,.14);
}
.qe-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
.qe-legend span{display:flex;align-items:center;gap:5px}
.qe-sw{width:11px;height:11px;border-radius:3px;border:1px solid var(--line);background:#fbfcfe;display:inline-block}
.qe-sw.bound{background:var(--brand-soft);border-color:#c5dcee}
.qe-sw.dot{width:7px;height:7px;border-radius:50%;background:var(--red);border:0;margin:0 2px}

/* ===== 本地文件夹：总览 ===== */
.qd-figs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qd-fig{
  flex:1 1 100px;min-width:96px;padding:9px 12px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:#fbfcfe;
}
.qd-fig b{display:block;font-size:19px;line-height:1.2}
.qd-fig span{font-size:11.5px;color:var(--muted)}
/* 未确认新增 / 变更：可点，定位到待确认卡 */
.qd-fig-link{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.qd-fig-link:hover{border-color:var(--brand-2);box-shadow:0 1px 6px rgba(23,76,132,.10)}
.qd-fig-link:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}

/* ===== 待确认文件（常驻卡片） ===== */
.qd-pend .card-h{flex-wrap:wrap;gap:8px}
.qd-pend-sum{font-size:12px;color:var(--muted)}
.qd-pend-sum b{color:var(--amber);font-size:13px}
.qd-pend-empty{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 16px;font-size:13px;color:var(--green)}
.qd-pend-empty span{font-size:11.5px;color:var(--muted)}
.qd-pgrp{border-top:1px solid #eef1f5}
.qd-pgrp:first-child{border-top:0}
.qd-pgrp-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 16px;background:#f8fafc;border-bottom:1px solid #eef1f5}
.qd-pgrp-h b{font-size:12.5px}
.qd-pgrp-p{font-size:11px;color:var(--muted);max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qd-prow{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid #f4f6f9;flex-wrap:wrap}
.qd-pf{flex:1 1 260px;min-width:0}
.qd-pf-n{font-size:12.5px;font-weight:600;word-break:break-all}
.qd-pf-n .tag{margin-left:6px;vertical-align:1px}
.qd-pf-p{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-all}
.qd-pf-m{flex:0 0 auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
.qd-mod{flex:0 0 auto;font-size:11.5px;color:var(--ink-2);background:#f1f5f9;border:1px dashed #c8d4e0;border-radius:999px;padding:2px 9px;cursor:pointer;font-family:inherit}
.qd-mod:hover{background:#e8eff7;border-color:var(--brand-2);color:var(--brand)}
.qd-pf-a{flex:0 0 auto;display:flex;gap:5px;white-space:nowrap}
.qd-pmore{padding:7px 16px 10px}
.qd-link{background:none;border:0;padding:0;font-size:12px;color:var(--brand-2);cursor:pointer;font-family:inherit}
.qd-link:hover{text-decoration:underline}
.flash{animation:qdFlash 1.2s ease}
@keyframes qdFlash{0%{box-shadow:0 0 0 0 rgba(185,119,14,.45)}100%{box-shadow:0 0 0 10px rgba(185,119,14,0)}}
.qd-tip{
  font-size:12px;line-height:1.9;color:var(--ink-2);background:#f6f9fc;
  border:1px solid #e3ebf3;border-left:3px solid var(--brand-2);
  border-radius:var(--r-sm);padding:10px 12px;
}
.qd-tip b{color:var(--brand)}
.qd-table{border-top:1px solid var(--line)}
.qd-tr{
  display:flex;gap:10px;align-items:center;padding:10px 16px;
  border-bottom:1px solid #eef1f5;flex-wrap:wrap;
}
.qd-tr:last-child{border-bottom:0}
.qd-td-name{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.qd-td-name b{font-size:13px}
.qd-path{font-size:11px;color:var(--muted);word-break:break-all}
.qd-td-st{display:flex;gap:4px;flex-wrap:wrap;flex:0 0 158px}
.qd-td-num{flex:0 0 66px;text-align:right;font-size:12.5px;font-weight:600}
.qd-td-act{flex:0 0 148px;display:flex;gap:5px;justify-content:flex-end}
.qd-muted{color:#b6c0cc;font-weight:400}

/* ===== 本地文件夹：详情 ===== */
.qd-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.qd-title h3{margin:0;font-size:15px}
.qd-pathline{
  font-size:11.5px;color:var(--muted);word-break:break-all;
  background:#f6f9fc;border:1px solid #e9eff6;border-radius:6px;padding:5px 9px;margin-bottom:9px;
}
.qd-stat{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.qd-stat b{color:var(--ink);font-weight:700}
.qd-alert{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;
  padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fbfcfe;
}
.qd-alert.warn{background:var(--amber-soft);border-color:#f2dcbb}
.qd-alert.info{background:var(--blue-soft);border-color:#cfe0ee}
.qd-alert-d{font-size:12px;color:var(--ink-2);line-height:1.75;margin-top:3px;max-width:640px}
.qd-crumb{display:flex;align-items:center;gap:3px;flex-wrap:wrap;min-width:0}
.qd-crumb-i{
  border:0;background:transparent;padding:2px 5px;border-radius:5px;
  font-size:12.5px;color:var(--brand-2);font-weight:600;
}
.qd-crumb-i:hover{background:var(--brand-soft)}
.qd-sep{color:#c3d0dd;font-size:11px}
.qd-dirs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid #eef1f5}
.qd-dir{
  display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:#fbfcfe;font-size:12.5px;font-weight:600;color:var(--ink-2);
}
.qd-dir:hover{border-color:#b9cfe3;background:#fff;color:var(--brand)}
.qd-dir-ic{color:#9db2c7;font-size:10px}
.qd-dir-c{color:var(--muted);font-weight:400;font-size:11.5px}
.qd-file{display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid #f1f4f8}
.qd-file:last-child{border-bottom:0}
.qd-file:hover{background:#fbfcfe}
.qd-ext{
  flex:0 0 42px;height:30px;border-radius:6px;background:var(--gray-soft);color:var(--ink-2);
  font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.2px;
}
.qd-fmain{flex:1;min-width:0}
.qd-fname{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap;word-break:break-all}
.qd-fmeta{font-size:11px;color:var(--muted);margin-top:2px;word-break:break-all}
.qd-fact{display:flex;gap:4px;flex-wrap:wrap;flex:0 0 auto}
.qd-note{
  font-size:11.5px;color:var(--muted);line-height:1.85;margin-top:12px;
  padding:9px 12px;border:1px dashed var(--line);border-radius:var(--r-sm);background:#fafcfe;
}
.qd-note b{color:var(--ink-2)}
.qd-empty{text-align:center;padding:38px 16px}
.qd-empty-ic{font-size:36px;color:#c3d0dd;line-height:1}
.qd-empty-t{font-size:15px;font-weight:700;margin-top:10px}
.qd-empty-d{font-size:12.5px;color:var(--muted);max-width:560px;margin:8px auto 0;line-height:1.85}
.qd-empty-p{font-size:12px;color:var(--ink-2);margin-top:10px}

/* ===== 编辑器 ===== */
.modal-wide{width:min(980px,94vw);max-width:980px}
.qd-ed-head{
  display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted);margin-bottom:8px;word-break:break-all;
}
.qd-ed-meta{color:var(--brand)}
.qd-ed{
  width:100%;height:min(58vh,520px);resize:vertical;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);
  font-family:"Cascadia Mono","Consolas","Microsoft YaHei",monospace;
  font-size:13px;line-height:1.75;background:#fbfcfe;color:var(--ink);
}
.qd-ed:focus{outline:0;border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 3px rgba(26,111,168,.10)}
.qd-ed-foot{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.qd-ed-warn{color:var(--amber)}
.qd-ed-kb{margin-left:auto;color:#9db2c7}
.qd-info-r{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed #eef1f5;font-size:12.5px}
.qd-info-r span{flex:0 0 78px;color:var(--muted)}
.qd-info-r b{font-weight:600}
.qd-row2{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.qd-chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.qd-hintbox{
  margin-top:12px;font-size:12px;color:var(--muted);line-height:1.75;
  background:#f6f9fc;border:1px solid #e9eff6;border-radius:6px;padding:8px 10px;
}

@media (max-width:1080px){
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .qe-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:860px){
  .g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qe-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qd-tr{gap:6px}
  .qd-td-st{flex:0 0 100%}
  .qd-td-num{flex:0 0 auto;min-width:54px}
  .qd-td-act{flex:1 1 100%;justify-content:flex-start}
  .qd-prow{gap:6px;padding:8px 12px}
  .qd-pf{flex:1 1 100%}
  .qd-pf-a{flex:1 1 100%;justify-content:flex-end}
  .qd-pgrp-h{padding:8px 12px}
  .qd-pgrp-p{display:none}
  .qd-pend .card-h .hint{display:none}
  .qd-file{flex-wrap:wrap}
  .qd-fact{flex:0 0 100%;padding-left:52px}
  .qd-alert .btn{flex:1}
  .qd-ed{height:min(50vh,420px)}
}
@media (max-width:520px){
  .g5{grid-template-columns:1fr 1fr}
  .qe-grid{grid-template-columns:1fr 1fr}
  .qd-title .btn{flex:1}
  .qd-fact{padding-left:0}
  .qd-stat{gap:10px}
}

/* ===== 图片预览（本地文件夹 / 文件中心共用） ===== */
.iv-mask{
  position:fixed;inset:0;z-index:120;background:rgba(9,17,26,.88);
  display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:hidden;cursor:zoom-out;animation:ivIn .16s ease;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
@keyframes ivIn{from{opacity:0}to{opacity:1}}
.iv-img{
  display:block;width:auto;height:auto;max-width:100%;
  max-height:calc(100vh - 48px);
  max-height:calc(100dvh - 48px);
  border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.55);
}
.iv-load{color:#cfe0ef;font-size:13px;letter-spacing:.5px}
.iv-panel{
  width:min(560px,92vw);background:#fff;border-radius:12px;
  padding:22px 24px;text-align:center;cursor:default;box-shadow:var(--shadow-lg);
}
.iv-ic{font-size:26px;line-height:1;color:var(--amber);font-weight:700}
.iv-t{font-size:15px;font-weight:700;margin-top:8px;color:var(--ink)}
.iv-d{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:8px;word-break:break-all}
.iv-p{color:var(--ink-2);font-size:11.5px}
.iv-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* 图片行的可点提示 */
.qd-imgrow .qd-ext{cursor:pointer;background:var(--brand-soft);color:var(--brand)}
.qd-imgrow .qd-ext:hover{background:#d8e8f4}
.qd-imgrow .qd-ext:focus{outline:0;box-shadow:0 0 0 3px rgba(26,111,168,.18)}
.qd-imgrow .qd-fname{cursor:pointer}
.qd-imgrow .qd-fname:hover{color:var(--brand-2)}

@media (max-width:860px){
  .iv-mask{padding:14px}
  .iv-img{max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px)}
}
@media (max-width:520px){
  .iv-mask{padding:0}
  .iv-img{max-width:100vw;max-height:100vh;max-height:100dvh;border-radius:0;box-shadow:none}
  .iv-panel{width:auto;margin:0 14px;padding:18px}
  .iv-acts .btn{flex:1 1 92px}
}

/* ===== 待办批量勾选 ===== */
.task-row .chk{color:#cfdae6}
.task-row .chk.checked{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.task-row .chk.disabled{cursor:default;opacity:.4;border-color:#e2e9f0;background:#fafcfe}
.task-row.sel{background:var(--brand-soft)}
.task-row.sel:hover{background:#dbeaf6}
.ib-bulk{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 12px;margin-bottom:4px;background:#f7fafd;
  border:1px solid #e3ebf3;border-radius:var(--r-sm);
}
.ib-all{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.ib-all input{width:15px;height:15px;accent-color:var(--brand-2);cursor:pointer}
.ib-cnt{font-size:12px;color:var(--muted)}
.ib-cnt b{color:var(--ink);font-weight:700}
.undo-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:var(--ink-2);line-height:1.7;
  background:var(--green-soft);border:1px solid #cfe8d9;border-radius:var(--r-sm);
}
.undo-bar b{color:var(--green);font-weight:700}
@media (max-width:520px){
  .ib-bulk{gap:8px;padding:8px 10px}
  .ib-bulk .spacer{display:none}
  .ib-bulk .btn{flex:1 1 46%}
  .ib-cnt{flex:1 1 100%}
  .undo-bar{gap:8px;padding:9px 11px}
  .undo-bar .btn{flex:1 1 92px}
}

/* ===== v1.9 导入预览 / 对账 ===== */
.imp-row{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border:1px solid var(--line);
  border-radius:7px;margin-bottom:6px;cursor:pointer;background:#fff}
.imp-row:hover{background:var(--panel-2)}
.imp-t{font-size:12.8px;font-weight:600;line-height:1.5;margin-bottom:4px;word-break:break-all}
.imp-kvs{display:flex;flex-wrap:wrap;gap:5px}
.imp-kv{font-size:11px;background:var(--panel-2);border-radius:4px;padding:2px 6px;color:var(--ink-2)}
.imp-kv i{font-style:normal;color:var(--muted);margin-right:4px}
.imp-pass{color:#1f8b4c;font-weight:700}
.imp-fail{color:#c0392b;font-weight:700}
.imp-log{font-size:12px;line-height:1.9;white-space:pre-wrap;word-break:break-all}
/* 预览层：旧值 → 新值 diff 与冲突裁决 */
.imp-head{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;margin-bottom:11px;font-size:12.5px;line-height:1.9;color:var(--ink-2)}
.imp-tip{color:var(--muted);font-size:11.5px;margin-top:2px}
.imp-bar{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.imp-bar .btn{font-size:11.5px;padding:4px 10px}
.imp-grp{margin-bottom:4px}
.imp-gt{font-size:12.5px;font-weight:700;margin:10px 0 6px;color:var(--ink)}
.imp-row.is-same{opacity:.55}
.imp-old{text-decoration:line-through;color:#b23b3b;background:#fdeeee;
  border-radius:3px;padding:0 4px;margin-right:4px;font-weight:400}
.imp-new{color:#1a7f45;background:#e9f7ee;border-radius:3px;padding:0 4px;font-weight:700}
.imp-nil{font-style:normal;color:var(--muted)}
.imp-old.is-empty{text-decoration:none;color:var(--muted);background:#f1f4f8;font-weight:400}
.imp-kv.is-conf{background:#fff6e8;border:1px solid #f0d3a0}
.imp-pick{display:inline-flex;gap:9px;margin-left:6px;padding-left:7px;
  border-left:1px dashed #f0d3a0;font-size:10.5px}
.imp-pick label{display:inline-flex;align-items:center;gap:3px;cursor:pointer;color:var(--ink-2)}
.imp-pick input{width:12px;height:12px;margin:0}
@media(max-width:520px){
  .imp-pick{display:flex;margin:4px 0 0;padding:5px 0 0;border-left:0;border-top:1px dashed #f0d3a0}
}
/* 来源追溯 */
.src-chip{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;
  font-size:10px;border-radius:4px;background:#e8f0fb;color:#3f7cd0;margin-right:5px;
  cursor:pointer;vertical-align:1px;user-select:none}
.src-chip:hover{background:#d3e3f9}
.src-chip.is-miss{background:#fdecec;color:#c0392b}
/* 源文件位置标识（问题表「源位置」列）：紧凑等宽，便于按行号回查 */
.loc-tag{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11.5px;line-height:18px;padding:0 6px;border-radius:4px;white-space:nowrap;

<script>
/* ===== 核心：存储 / 工具 / 路由 / 通用台账引擎 ===== */
(function(){
"use strict";

var DB_KEY = "ZLGL_DB_V1";
var DB = null;

/* ---------- 工具 ---------- */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function uid(p){return (p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function pad(n){return n<10?"0"+n:""+n;}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseD(s){if(!s) return null; var a=String(s).slice(0,10).split("-"); if(a.length<3) return null; var d=new Date(+a[0],+a[1]-1,+a[2]); return isNaN(d.getTime())?null:d;}
function fmtD(s){if(!s) return "—"; return String(s).slice(0,10);}
function diffDays(a,b){var x=parseD(a),y=parseD(b);if(!x||!y) return 0;return Math.round((y-x)/86400000);}
function addDays(s,n){var d=parseD(s)||new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function weekKey(dstr){
  var d=parseD(dstr)||new Date();
  var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var day=(t.getDay()+6)%7; t.setDate(t.getDate()-day+3);
  var first=new Date(t.getFullYear(),0,4);
  var fday=(first.getDay()+6)%7; first.setDate(first.getDate()-fday+3);
  var wk=1+Math.round((t-first)/604800000);
  return t.getFullYear()+"-W"+(wk<10?"0"+wk:""+wk);
}
function weekRange(wk){
  var m=/(\d{4})-W(\d{2})/.exec(wk); if(!m) return [todayStr(),todayStr()];
  var y=+m[1],w=+m[2];
  var jan4=new Date(y,0,4);
  var fday=(jan4.getDay()+6)%7;
  var w1=new Date(y,0,4-fday);
  var s=new Date(w1.getTime()+(w-1)*604800000);
  var e=new Date(s.getTime()+6*86400000);
  return [s.getFullYear()+"-"+pad(s.getMonth()+1)+"-"+pad(s.getDate()),
          e.getFullYear()+"-"+pad(e.getMonth()+1)+"-"+pad(e.getDate())];
}
function periodEnd(p){
  if(!p) return "";
  if(/^\d{4}$/.test(p)) return p+"-12-31";
  if(/^\d{4}-\d{2}$/.test(p)){var y=+p.slice(0,4),m=+p.slice(5,7);var d=new Date(y,m,0);return y+"-"+pad(m)+"-"+pad(d.getDate());}
  if(/-W\d{2}$/.test(p)) return weekRange(p)[1];
  return p;
}
function periodStart(p){
  if(!p) return "";
  if(/^\d{4}$/.test(p)) return p+"-01-01";
  if(/^\d{4}-\d{2}$/.test(p)) return p+"-01";
  if(/-W\d{2}$/.test(p)) return weekRange(p)[0];
  return p;
}
function pct(a,b){ if(!b) return 0; return Math.round(a/b*1000)/10; }
function nf(n){ if(n===null||n===undefined||n==="") return "—"; var v=+n; if(isNaN(v)) return "—"; return v.toLocaleString("zh-CN",{maximumFractionDigits:2}); }

/* ---------- 存储 ---------- */
function load(){
  try{
    var raw=localStorage.getItem(DB_KEY);
    if(!raw) return clone(window.SEED);
    var d=JSON.parse(raw);
    if(!d||!d.tasks) return clone(window.SEED);
    return d;
  }catch(e){ console.warn("读取本地数据失败",e); return clone(window.SEED); }
}
function save(){
  try{
    DB.meta.updatedAt=new Date().toISOString();
    localStorage.setItem(DB_KEY,JSON.stringify(DB));
    return true;
  }catch(e){
    toast("本地存储已满，请先在文件中心清理已上传文件","err");
    return false;
  }
}
/* 立即初始化，保证后续脚本加载时 DB 已就绪 */
DB = load();
if(!DB.meta) DB.meta={company:"",year:2026};

/* ---------- 单据核定数据并入（v2.3）----------
   只并入 window.INSPECT_DOC 中来自三份已上传单据的 3 张检查单 + 18 条问题；
   同时清退旧版 seed 里编造的演示行（仅限「未被人动过」的 i1-i6 / w1-w14，
   有来源、被编辑过、被标脏的一律保留）。用版本号保证幂等：
   并入后写库并落 _docVer，之后不再重复执行，用户删掉的行也不会复活。 */
var DOC_VER="2026-11-05";
var DEMO_SHEET={"i1":1,"i2":1,"i3":1,"i4":1,"i5":1,"i6":1};
var DEMO_ISSUE={"w1":1,"w2":1,"w3":1,"w4":1,"w5":1,"w6":1,"w7":1,"w8":1,
  "w9":1,"w10":1,"w11":1,"w12":1,"w13":1,"w14":1};
function untouched(r){ return !r.srcFileId && !r.srcRel && !r._df && !r.manualAt && !r.dirty; }
function mergeInspectDoc(){
  var doc=window.INSPECT_DOC;
  if(!doc || DB._docVer===DOC_VER) return false;
  var changed=false;
  var keepS=(DB.inspections||[]).filter(function(r){ return !(DEMO_SHEET[r.id]&&untouched(r)); });
  if(keepS.length!==(DB.inspections||[]).length){ DB.inspections=keepS; changed=true; }
  var keepI=(DB.issues||[]).filter(function(r){ return !(DEMO_ISSUE[r.id]&&untouched(r)); });
  if(keepI.length!==(DB.issues||[]).length){ DB.issues=keepI; changed=true; }
  DB.inspections=DB.inspections||[]; DB.issues=DB.issues||[];
  var sn={}, isn={};
  DB.inspections.forEach(function(r){ sn[r.no]=1; });
  DB.issues.forEach(function(r){ isn[r.no]=1; });
  (doc.sheets||[]).forEach(function(r){
    if(sn[r.no]) return; DB.inspections.push(clone(r)); sn[r.no]=1; changed=true;
  });
  (doc.rows||[]).forEach(function(r){
    if(isn[r.no]) return; DB.issues.push(clone(r)); isn[r.no]=1; changed=true;
  });
  DB._docVer=DOC_VER;
  return true;
}
try{ if(mergeInspectDoc()) save(); }catch(e){ console.warn("单据数据并入失败",e); }

window.APP = {
  get db(){return DB;},
  save:save,
  $:$, $$:$$, esc:esc, uid:uid, todayStr:todayStr, parseD:parseD, fmtD:fmtD,
  diffDays:diffDays, addDays:addDays, weekKey:weekKey, weekRange:weekRange,
  periodEnd:periodEnd, periodStart:periodStart, pct:pct, nf:nf, clone:clone
};

/* ---------- 质量检查整改状态机（v2.1）----------
   依据《质量问题整改通知单》《质量整改回复单》的实际流转确定：
       待整改 → 整改中 → 已回复待复核 → 已闭环
                                  ↘ 复核退回 → 整改中
   兼容：v2.0 及更早只写 待整改 / 整改中 / 已闭环 三个值，
   三者在状态集合内仍然合法，历史行无需迁移即可读取与统计。 */
var INSP_STATUS = ["待整改","整改中","已回复待复核","已闭环","复核退回"];
var INSP_FLOW = {
  "待整改":["整改中"],
  "整改中":["已回复待复核"],
  "已回复待复核":["已闭环","复核退回"],
  "复核退回":["整改中"],
  "已闭环":[]
};
var INSP_LEGACY = {"待整改":1,"整改中":1,"已闭环":1};
function inspIsClosed(v){ return v==="已闭环"; }
function inspIsVerifying(v){ return v==="已回复待复核"; }
function inspIsOpen(v){ return !inspIsClosed(v); }
function inspIsLegacy(v){ return !!INSP_LEGACY[v]; }
function inspNext(v){ return (INSP_FLOW[v]||[]).slice(); }
/* 是否允许从 from 流转到 to；from 为空（新增）一律放行 */
function inspCanGo(from,to){
  if(!from||from===to) return true;
  return (INSP_FLOW[from]||[]).indexOf(to)>=0;
}
window.INSP = {
  STATUS:INSP_STATUS, FLOW:INSP_FLOW, LEGACY:INSP_LEGACY,
  isClosed:inspIsClosed, isVerifying:inspIsVerifying, isOpen:inspIsOpen,
  isLegacy:inspIsLegacy, next:inspNext, canGo:inspCanGo
};
window.APP.insp = window.INSP;

/* ---------- 文件状态（v1.7）：待确认 / 已确认 ---------- */
function fileNowStr(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+
         pad(d.getHours())+":"+pad(d.getMinutes());
}
/* v1.6 遗留记录没有 status 字段，一律视为已确认（当时的归档/上传本身就是人工确认） */
function fileStatus(f){ return (f&&f.status==="pending")?"pending":"confirmed"; }
function fileIsPending(f){ return fileStatus(f)==="pending"; }
/* 唯一写入口：落库失败时回滚内存值，避免"界面已确认、刷新后回退" */
function fileSetStatus(id,st){
  var list=DB.files||[], f=null, i;
  for(i=0;i<list.length;i++){ if(list[i].id===id){ f=list[i]; break; } }
  if(!f) return false;
  if(f.status===st) return true;
  var oS=f.status, oA=f.statusAt;
  f.status=st; f.statusAt=fileNowStr();
  if(!save()){ f.status=oS; f.statusAt=oA; return false; }
  return true;
}
function fileTag(f){
  var p=fileIsPending(f);
  return '<span class="tag '+(p?"t-amber":"t-green")+'">'+(p?"待确认":"已确认")+'</span>';
}
window.APP.fileStatus=fileStatus;
window.APP.fileIsPending=fileIsPending;
window.APP.fileSetStatus=fileSetStatus;
window.APP.fileTag=fileTag;
window.APP.fileNowStr=fileNowStr;
window.fileStatus=fileStatus;
window.fileIsPending=fileIsPending;
window.fileSetStatus=fileSetStatus;
window.fileTag=fileTag;
window.fileNowStr=fileNowStr;

/* ---------- 提示 ---------- */
function toast(msg,type){
  var w=$("#toastWrap"); if(!w){w=document.createElement("div");w.id="toastWrap";w.className="toast-wrap";document.body.appendChild(w);}
  var t=document.createElement("div");
  t.className="toast "+(type||"");
  t.textContent=msg;
  w.appendChild(t);
  setTimeout(function(){ t.style.transition="opacity .25s"; t.style.opacity="0"; setTimeout(function(){t.remove();},260); },2400);
}
window.toast=toast;

/* ---------- 模态框 ---------- */
var modalStack=[];
function openModal(opt){
  var mask=document.createElement("div");
  mask.className="modal-mask";
  mask.innerHTML=
    '<div class="modal" role="dialog" aria-modal="true">'+
      '<div class="modal-h"><h3>'+esc(opt.title)+'</h3>'+
        '<button class="close-x" data-close="1" aria-label="关闭">×</button></div>'+
      '<div class="modal-b">'+opt.body+'</div>'+
      '<div class="modal-f">'+
        (opt.noCancel?'':'<button class="btn" data-close="1">取消</button>')+
        '<button class="btn primary" data-ok="1">'+esc(opt.okText||"保存")+'</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(mask);
  modalStack.push(mask);
  function close(){ mask.remove(); modalStack.pop(); if(opt.onClose) opt.onClose(); }
  $$("[data-close]",mask).forEach(function(b){b.onclick=close;});
  mask.addEventListener("click",function(e){ if(e.target===mask) close(); });
  var okBtn=$("[data-ok]",mask);
  if(opt.noOk) okBtn.style.display="none";
  okBtn.onclick=function(){
    var r=opt.onOk?opt.onOk(mask):true;
    if(r===false) return;
    close();
  };
  if(opt.afterRender) opt.afterRender(mask);
  var f=$("input,select,textarea",mask); if(f) setTimeout(function(){f.focus();},60);
  return mask;
}
window.openModal=openModal;
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&modalStack.length){ var m=modalStack.pop(); m.remove(); }
});

function fieldHTML(f,val,ctx){
  var v = val===undefined||val===null ? (f.def!==undefined?f.def:"") : val;
  var attrs='name="'+f.k+'" id="f_'+f.k+'"';
  var html="";
  if(f.t==="textarea"){
    html='<textarea '+attrs+' placeholder="'+esc(f.ph||"")+'">'+esc(v)+'</textarea>';
  }else if(f.t==="select"){
    var opts=typeof f.opts==="function"?f.opts():(f.opts||[]);
    html='<select '+attrs+'>';
    if(!f.req) html+='<option value="">—</option>';
    opts.forEach(function(o){
      var ov=Array.isArray(o)?o[0]:o, ol=Array.isArray(o)?o[1]:o;
      html+='<option value="'+esc(ov)+'"'+(String(v)===String(ov)?" selected":"")+'>'+esc(ol)+'</option>';
    });
    html+='</select>';
  }else if(f.t==="date"){
    html='<input type="date" '+attrs+' value="'+esc(v)+'">';
  }else if(f.t==="number"){
    html='<input type="number" step="'+(f.step||"any")+'" '+attrs+' value="'+esc(v)+'" placeholder="'+esc(f.ph||"")+'">';
  }else if(f.t==="checkbox"){
    html='<label style="display:flex;align-items:center;gap:8px;padding-top:22px">'+
      '<input type="checkbox" '+attrs+' '+(v?"checked":"")+' style="width:16px;height:16px"> '+
      '<span style="font-size:13px">'+esc(f.l)+'</span></label>';
    return '<div class="field">'+html+'</div>';
  }else if(f.t==="datalist"){
    var id="dl_"+f.k;
    html='<input type="text" '+attrs+' list="'+id+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||"")+'">'+
      '<datalist id="'+id+'">'+(f.opts||[]).map(function(o){return '<option value="'+esc(o)+'">';}).join("")+'</datalist>';
  }else{
    html='<input type="text" '+attrs+' value="'+esc(v)+'" placeholder="'+esc(f.ph||"")+'">';
  }
  return '<div class="field'+(f.full?" full":"")+'"><label for="f_'+f.k+'">'+esc(f.l)+(f.req?' <span style="color:#c0392b">*</span>':'')+'</label>'+html+'</div>';
}
function readForm(scope,fields){
  var o={};
  fields.forEach(function(f){
    var el=$("#f_"+f.k,scope); if(!el) return;
    if(f.t==="checkbox") o[f.k]=el.checked;
    else if(f.t==="number"){ o[f.k]= el.value===""?null:+el.value; }

  });

}
function formHTML(fields,row){

/* ---------- 通用台账引擎 ---------- */
/* schema: {key,title,prefix,cols:[{k,l,w,fmt}],fields:[...],filters:[{k,l,opts}],searchKeys:[],sortBy,defaultNew} */
var SCHEMA={};
function regSchema(k,def){ SCHEMA[k]=def; }
window.regSchema=regSchema; window.SCHEMA=SCHEMA;
window.APP.regSchema=regSchema;

var uiState={}; // 每个模块的搜索/筛选状态

/* ---------- 表格行顺序（手工调序）----------
   存储：DB().ui.tableOrder[模块key] = [行id, ...]
   语义：只决定显示次序，不写任何业务字段；不在顺序表里的行（如新导入的）
         按原 sortBy 排在末尾，绝不插队打乱已排好的部分 */
function tableUi(){ var d=DB; d.ui=d.ui||{}; d.ui.tableOrder=d.ui.tableOrder||{}; return d.ui; }
function tableOrder(key){ return tableUi().tableOrder[key]||null; }
function setTableOrder(key,ids){
  var u=tableUi();
  if(ids&&ids.length) u.tableOrder[key]=ids.slice();
  else delete u.tableOrder[key];
}
/* 把 rows 按给定 id 序列重排：表内有的按序，表外的保持原相对次序追加末尾 */
function applyOrder(rows,ids){
  if(!ids||!ids.length) return rows;
  var ix={}, i;
  for(i=0;i<ids.length;i++) ix[ids[i]]=i;
  var inList=[], rest=[];
  rows.forEach(function(r){ (ix[r.id]===undefined?rest:inList).push(r); });
  inList.sort(function(a,b){ return ix[a.id]-ix[b.id]; });
  return inList.concat(rest);
}

function getRows(key){ return DB[key]||[]; }

function renderCell(col,row){
  var v=row[col.k];
  if(col.fmt) return col.fmt(v,row);
  if(v===null||v===undefined||v==="") return '<span style="color:#b6c0cc">—</span>';
  return esc(v);
}

function renderTable(key,host){
  var def=SCHEMA[key], rows=getRows(key).slice();
  var st=uiState[key]||(uiState[key]={q:"",f:{}});

  if(st.q){
    var q=st.q.toLowerCase();
    rows=rows.filter(function(r){
      return (def.searchKeys||def.cols.map(function(c){return c.k;})).some(function(k){
        return String(r[k]||"").toLowerCase().indexOf(q)>=0;
      });
    });
  }
  (def.filters||[]).forEach(function(f){
    var v=st.f[f.k]; if(!v) return;
    rows=rows.filter(function(r){ return String(r[f.k])===String(v); });
  });
  /* 搜索/筛选生效时不允许调序：只能看到子集，拖动会打乱没显示的行 */
  var filtered=!!st.q||(def.filters||[]).some(function(f){ return !!st.f[f.k]; });
  if(st.ord&&filtered){ st.ord=null; }   /* 中途加了筛选就退出调序模式 */

  if(def.sortFn) rows.sort(def.sortFn);
  else if(def.sortBy) rows.sort(function(a,b){ var x=a[def.sortBy]||"",y=b[def.sortBy]||""; return x<y?1:x>y?-1:0; });

  /* 手工顺序优先于默认 sortBy */
  var ordering=!!st.ord;
  if(ordering) rows=applyOrder(rows,st.ord.work);
  else rows=applyOrder(rows,tableOrder(key));

  var bar;
  if(ordering){
    /* 排序模式：工具栏只留调序动作，避免误触搜索/新增 */
    bar='<div class="toolbar ord-bar">'+
      '<span class="ord-tip">'+
        '<b>调整顺序</b>　拖动行首手柄可跨行移动，或用 ↑ ↓ 逐行移动（首尾循环）；'+
        '数据不变，调序时已收起详情列；点「完成」保存，取消则还原'+
      '</span><div class="spacer"></div>'+
      '<button class="btn" data-act="ordReset">恢复默认顺序</button>'+
      '<button class="btn" data-act="ordCancel">取消</button>'+
      '<button class="btn primary" data-act="ordDone">完成</button>'+
    '</div>';
  }else{
    var canOrd=getRows(key).length>1;
    bar='<div class="toolbar">'+
      '<div class="search"><input type="search" placeholder="搜索'+esc(def.title)+'…" value="'+esc(st.q)+'" data-q="1"></div>'+
      (def.filters||[]).map(function(f){
        return '<select data-f="'+f.k+'"><option value="">全部'+esc(f.l)+'</option>'+
          f.opts.map(function(o){var ov=Array.isArray(o)?o[0]:o,ol=Array.isArray(o)?o[1]:o;
            return '<option value="'+esc(ov)+'"'+(String(st.f[f.k]||"")===String(ov)?" selected":"")+'>'+esc(ol)+'</option>';}).join("")+
          '</select>';
      }).join("")+
      '<div class="spacer"></div>'+
      (def.extraButtons?def.extraButtons():'')+
      (canOrd?(filtered
        ? '<button class="btn" disabled title="搜索或筛选生效时不可调序，请先清空条件">调整顺序</button>'
        : '<button class="btn" data-act="ordOn" title="拖拽或上下移动，改变行的显示次序">调整顺序</button>'):'')+
      (tableOrder(key)?'<button class="btn" data-act="ordReset" title="清除手工顺序，回到默认排序">恢复默认</button>':'')+
      '<button class="btn" data-act="csv">导出 CSV</button>'+
      '<button class="btn" data-act="print">打印</button>'+
      (def.readonly?'':'<button class="btn primary" data-act="add">+ 新增</button>')+
    '</div>';
  }

  var GRIP='<svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><g fill="currentColor">'+
    '<circle cx="3" cy="3" r="1.2"/><circle cx="7" cy="3" r="1.2"/>'+
    '<circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/>'+
    '<circle cx="3" cy="11" r="1.2"/><circle cx="7" cy="11" r="1.2"/></g></svg>';
  var ARROW_UP='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.2 10.4 8.4H1.6z" fill="currentColor"/></svg>';
  var ARROW_DN='<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 9.8 1.6 3.6h8.8z" fill="currentColor"/></svg>';

  /* 排序模式下收起「详情类」列：调序时只需看清是哪一行，避免新增两列后横向溢出 */
  var ORD_HIDE={level:1,photo:1,owner:1,note:1,requirement:1,measure:1,conclusion:1,checker:1,_pr:1};
  var dCols=ordering?def.cols.filter(function(c){ return !ORD_HIDE[c.k]; }):def.cols;

  var table='<div class="table-wrap"><table class="tb'+(ordering?' is-ord':'')+'"><thead><tr>'+
    (ordering?'<th style="width:66px">顺序</th>':'')+
    dCols.map(function(c){return '<th'+(c.w?' style="min-width:'+c.w+'px"':'')+'>'+esc(c.l)+'</th>';}).join("")+
    (ordering?'<th style="width:90px">移动</th>':(def.readonly?'':'<th style="width:88px">操作</th>'))+
    '</tr></thead><tbody>';
  if(!rows.length){
    table+='<tr><td colspan="'+(dCols.length+(ordering?2:1))+'"><div class="empty">没有符合条件的记录'+
      (def.readonly?'':'，点击右上角「+ 新增」开始录入')+'</div></td></tr>';
  }else{
    rows.forEach(function(r,i){
      var chip=(window.IMPORT&&window.IMPORT.srcChip)?window.IMPORT.srcChip(r):"";
      table+='<tr data-id="'+esc(r.id)+'"'+(ordering?' class="ord-row" draggable="true"':'')+'>';
      if(ordering){
        var edge=i===0?"已在首位，上移会转到末位":(i===rows.length-1?"已在末位，下移会转到首位":"");
        table+='<td class="ord-cell"'+(edge?' title="'+esc(edge)+'"':'')+'>'+
          '<span class="ord-no">'+(i+1)+'</span>'+
          '<span class="ord-grip" title="按住拖动可跨行移动">'+GRIP+'</span></td>';
      }
      table+=dCols.map(function(c,ci){
          return '<td'+(c.num?' class="num"':'')+'>'+(ci===0?chip:'')+renderCell(c,r)+'</td>';
        }).join("");
      if(ordering){
        table+='<td class="ord-acts">'+
          '<button class="btn sm ghost ord-btn" data-up="'+esc(r.id)+'" title="上移；已在首位则转到末位">'+ARROW_UP+'</button>'+
          '<button class="btn sm ghost ord-btn" data-down="'+esc(r.id)+'" title="下移；已在末位则转到首位">'+ARROW_DN+'</button>'+
        '</td>';
      }else if(!def.readonly){
        table+='<td><div class="row-actions">'+
          '<button class="btn sm ghost" data-edit="'+esc(r.id)+'">编辑</button>'+
          '<button class="btn sm ghost" data-del="'+esc(r.id)+'" style="color:#c0392b">删</button>'+
        '</div></td>';
      }
      table+='</tr>';
    });
  }
  table+='</tbody></table></div>';

  host.innerHTML = bar + table +
    '<div style="margin-top:10px;font-size:12px;color:var(--muted)">共 '+rows.length+' 条'+
      (rows.length!==getRows(key).length?'（已筛选，总计 '+getRows(key).length+' 条）':'')+'</div>';

  var qi=$("[data-q]",host);
  if(qi) qi.oninput=function(){ st.q=this.value; var pos=this.selectionStart; renderTable(key,host);
    var n=$("[data-q]",host); if(n){n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){}} };
  $$("[data-f]",host).forEach(function(s){ s.onchange=function(){ st.f[this.getAttribute("data-f")]=this.value; renderTable(key,host); }; });
  $$("[data-edit]",host).forEach(function(b){ b.onclick=function(){ editRow(key,this.getAttribute("data-edit")); }; });
  $$("[data-del]",host).forEach(function(b){ b.onclick=function(){ delRow(key,this.getAttribute("data-del")); }; });
  $$("[data-src]",host).forEach(function(b){ b.onclick=function(e){
    e.stopPropagation();
    if(window.IMPORT&&window.IMPORT.showSource) window.IMPORT.showSource(b.getAttribute("data-src"));
  }; });
  var add=$("[data-act=add]",host); if(add) add.onclick=function(){ editRow(key,null); };
  var csv=$("[data-act=csv]",host); if(csv) csv.onclick=function(){ exportCSV(key,def,rows); };
  var pr=$("[data-act=print]",host); if(pr) pr.onclick=function(){ printTable(key,def,rows); };

  /* ---------- 行顺序调整 ---------- */
  var on=$("[data-act=ordOn]",host);
  if(on) on.onclick=function(){
    st.ord={work:rows.map(function(r){return r.id;})};   /* 以当前显示顺序为基准 */
    renderTable(key,host);
  };
  var od=$("[data-act=ordDone]",host);
  if(od) od.onclick=function(){
    setTableOrder(key,st.ord.work); st.ord=null; save();
    toast("已保存行顺序","ok"); renderTable(key,host);
  };
  var oc=$("[data-act=ordCancel]",host);
  if(oc) oc.onclick=function(){ st.ord=null; renderTable(key,host); };
  var orr=$("[data-act=ordReset]",host);
  if(orr) orr.onclick=function(){
    setTableOrder(key,null); st.ord=null; save();
    toast("已恢复默认顺序","ok"); renderTable(key,host);
  };
  function moveBy(id,dir){
    var w=st.ord.work, i=w.indexOf(id); if(i<0) return;
    var j=i+dir;
    if(j<0) j=w.length-1; else if(j>=w.length) j=0;   /* 首尾循环 */
    w.splice(i,1); w.splice(j,0,id);
    renderTable(key,host);
  }
  $$("[data-up]",host).forEach(function(b){ b.onclick=function(){ moveBy(this.getAttribute("data-up"),-1); }; });
  $$("[data-down]",host).forEach(function(b){ b.onclick=function(){ moveBy(this.getAttribute("data-down"),1); }; });

  /* 拖拽：落点在目标行上半部=插到它前面，下半部=插到它后面（跨行一次到位） */
  if(ordering){
    var tbody=$("tbody",host), dragId=null;
    $$("tr.ord-row",tbody).forEach(function(tr){
      tr.ondragstart=function(e){
        dragId=this.getAttribute("data-id");
        this.classList.add("is-dragging");
        try{ e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragId); }catch(_e){}
      };
      tr.ondragend=function(){
        this.classList.remove("is-dragging"); dragId=null;
        $$("tr.ord-row",tbody).forEach(function(x){ x.classList.remove("drop-before","drop-after"); });
      };
      tr.ondragover=function(e){
        if(!dragId||dragId===this.getAttribute("data-id")) return;
        e.preventDefault();
        var rc=this.getBoundingClientRect(), after=(e.clientY-rc.top)>rc.height/2;
        this.classList.toggle("drop-after",after);
        this.classList.toggle("drop-before",!after);
      };
      tr.ondragleave=function(){ this.classList.remove("drop-before","drop-after"); };
      tr.ondrop=function(e){
        e.preventDefault();
        var tgt=this.getAttribute("data-id");
        if(!dragId||dragId===tgt) return;
        var rc=this.getBoundingClientRect(), after=(e.clientY-rc.top)>rc.height/2;
        var w=st.ord.work, from=w.indexOf(dragId);
        if(from<0) return;
        w.splice(from,1);
        var to=w.indexOf(tgt);
        if(to<0) to=w.length;
        else if(after) to=to+1;
        w.splice(to,0,dragId);
        renderTable(key,host);
      };
    });
  }

  if(def.afterRender) def.afterRender(host,rows);
}

function editRow(key,id){
  var def=SCHEMA[key];
  var row = id ? (getRows(key).filter(function(r){return r.id===id;})[0]) : clone(def.defaultNew||{});
  if(!row) return;
  var body=formHTML(def.fields,row);
  if(def.formNote) body='<div style="margin-bottom:12px;font-size:12.5px;color:var(--muted);background:var(--panel-2);padding:9px 12px;border-radius:7px">'+def.formNote+'</div>'+body;
  openModal({
    title:(id?"编辑 · ":"新增 · ")+def.title,
    body:body,
    onOk:function(scope){
      var data=readForm(scope,def.fields);
      for(var i=0;i<def.fields.length;i++){
        var f=def.fields[i];
        if(f.req && (data[f.k]===""||data[f.k]===null)){ toast("请填写「"+f.l+"」","err"); $("#f_"+f.k,scope).focus(); return false; }
      }
      /* 校验先于落库：beforeSave 返回 false 时整条不写入，弹窗保持让用户继续改 */
      if(def.beforeSave && def.beforeSave(data,id)===false){ return false; }
      if(id){
        var idx=getRows(key).findIndex(function(r){return r.id===id;});
        if(idx>=0){
          var old=DB[key][idx];
          /* 字段级人工编辑留痕：只有真正被改过的字段才进入冲突保护，
             避免"改了一个字段、整行都不让文件更新" */
          var df={}, chg=false;
          for(var k in data){
            if(!Object.prototype.hasOwnProperty.call(data,k)) continue;
            if(String(old[k]===undefined?"":old[k])!==String(data[k]===undefined?"":data[k])){ df[k]=1; chg=true; }
          }
          DB[key][idx]=Object.assign({},old,data);
          if(chg){
            var r=DB[key][idx];
            r.dirty=true;
            r._df=Object.assign({},r._df||{},df);
            r.manualAt=new Date().toISOString().slice(0,10);
          }
        }
      }else{
        data.id=uid(def.prefix||"r");
        DB[key].push(data);
      }
      save(); toast(id?"已更新":"已新增","ok"); render(currentRoute);
    }
  });
}
window.editRow=editRow;

function delRow(key,id){
  var def=SCHEMA[key];
  var row=getRows(key).filter(function(r){return r.id===id;})[0]; if(!row) return;
  var name=row[def.cols[0].k]||"该记录";
  openModal({
    title:"确认删除",
    body:'<p style="margin:0 0 10px">确定删除「<b>'+esc(name)+'</b>」？</p><p style="margin:0;font-size:12.5px;color:var(--muted)">删除后可在「数据备份」中通过导出文件找回，但无法撤销。</p>',
    okText:"删除",
    onOk:function(){
      var target=getRows(key).filter(function(r){return r.id===id;})[0];
      /* 派生行被人工删除：登记忽略，否则下次扫描文件会把它原样补回来 */
      var muted="";
      if(target&&target.srcFileId){
        var f=(DB.files||[]).filter(function(x){return x.id===target.srcFileId;})[0];
        if(f){
          f.ignore=f.ignore||{};
          var ik=key+"|"+(target.srcKey||"");
          f.ignore[ik]=1;
          muted=(f.name||"文件");
        }
      }
      DB[key]=getRows(key).filter(function(r){return r.id!==id;});
      /* 同步清掉手工顺序里的这一行，避免顺序表越积越长 */
      var ord=tableUi().tableOrder[key];
      if(ord){
        var oi=ord.indexOf(id);
        if(oi>=0){ ord.splice(oi,1); if(!ord.length) delete tableUi().tableOrder[key]; }
      }
      if(def.onDelete) def.onDelete(id);
      save();
      toast(muted?("已删除，并忽略来自「"+muted+"」的同名记录（重新解析可恢复）"):"已删除","ok");
      render(currentRoute);
    }
  });
}
window.delRow=delRow;

    if(s.charAt(st)==="\r") st++;
    if(s.charAt(st)==="\n") st++;
    var e=s.indexOf("endstream",st);
    if(e<0) break;
    if(!/\/Image|DCTDecode|JPXDecode|CCITTFaxDecode|JBIG2Decode/.test(dict)){
      var out=null;
      try{ out=/FlateDecode/.test(dict)?inflateZlib(u.subarray(st,e)):u.subarray(st,e); }catch(err){ out=null; }
      if(out&&out.length){
        var t=latin1(out);
        if(t.indexOf("BT")>=0&&(t.indexOf("TJ")>=0||t.indexOf("Tj")>=0)) chunks.push(t);
      }
    }
    i=e+9;
  }
  var text=chunks.map(function(t){ return pdfText(t,fonts); }).join("\n");
  /* 未映射字体产生的控制字符直接剔除，避免污染字段 */
  text=text.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFD]/g,"")
           .replace(/[ \t]{2,}/g," ").replace(/\n{3,}/g,"\n\n").trim();
  res.text=text;
  var cjk=(text.match(/[\u4e00-\u9fa5]/g)||[]).length;
  res.cjk=cjk;
  res.scan = cjk<8;
  if(res.scan) res.err="NO_TEXT_LAYER";
  return res;
}

/* ---------------- 入口 ---------------- */
var EXT={
  xlsx:"table", xls:"table", csv:"table", tsv:"table",
  docx:"doc", doc:"doc", pdf:"pdf",
  txt:"text", md:"text", json:"text", log:"text",
  jpg:"img", jpeg:"img", png:"img", gif:"img", bmp:"img", webp:"img", tif:"img", tiff:"img", heic:"img",
  zip:"other", rar:"other", "7z":"other", lnk:"other", db:"other"
};
function extOf(name){ var m=/\.([a-z0-9]+)$/i.exec(String(name||"")); return m?m[1].toLowerCase():""; }
function sniff(name){ return EXT[extOf(name)]||"other"; }
function decodeText(u8){
  var u=u8;
  if(u.length>=3&&u[0]===0xEF&&u[1]===0xBB&&u[2]===0xBF){ try{ return new TextDecoder("utf-8").decode(u.subarray(3)); }catch(e){} }
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(u); }
  catch(e){
    try{ return new TextDecoder("gbk").decode(u); }catch(e2){ return new TextDecoder("utf-8").decode(u); }
  }
}
function parseCsv(text){
  var rows=[], row=[], cell="", q=false, i=0;
  for(;i<text.length;i++){
    var c=text.charAt(i);
    if(q){
      if(c==='"'){ if(text.charAt(i+1)==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===","||c==="\t"){ row.push(cell); cell=""; }
      else if(c==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
      else if(c==="\r"){}
      else cell+=c;
    }
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return {type:"csv", sheets:[{name:"CSV", rows:rows.map(function(r){
    return r.map(function(v){ var n=parseFloat(v); return (v!==""&&!isNaN(n)&&/^-?\d+(\.\d+)?$/.test(v))?n:v; });
  }), merges:[]}]};
}
/* Excel 序列号 → YYYY-MM-DD */
function xlDate(v){
  var n=+v; if(isNaN(n)||n<20000||n>80000) return "";
  var d=new Date(Date.UTC(1899,11,30)+n*86400000);
  if(isNaN(d.getTime())) return "";
  var p=function(x){return x<10?"0"+x:""+x;};
  return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate());
}
function parse(name, buf){
  var kind=sniff(name);
  var e=extOf(name);
  /* Word/Excel 打开时生成的 ~$ 锁文件不是正文，直接跳过 */
  if(/^~\$/.test(String(name||""))) return {type:"temp", text:""};
  try{
    if(kind==="table"){
      if(e==="xlsx") return parseXlsx(buf);
      if(e==="xls") return parseXls(buf);
      return parseCsv(decodeText(buf instanceof Uint8Array?buf:new Uint8Array(buf)));
    }
    if(kind==="doc") return e==="doc"?parseDoc(buf):parseDocx(buf);
    if(kind==="pdf") return parsePdf(buf);
    if(kind==="text") return {type:"text", text:decodeText(buf instanceof Uint8Array?buf:new Uint8Array(buf))};
    return {type:"other", text:""};
  }catch(err){
    return {type:"err", err:(err&&err.message)||String(err), text:""};
  }
}

G.Parse={
  inflateRaw:inflateRaw, inflateZlib:inflateZlib, unzip:unzip, unesc:unesc,
  parseXlsx:parseXlsx, parseXls:parseXls, parseDocx:parseDocx, parseDoc:parseDoc,
  parsePdf:parsePdf, parseCsv:parseCsv, decodeText:decodeText, sniff:sniff, extOf:extOf,
  xlDate:xlDate, parse:parse, oleStream:oleStream
};
if(typeof module!=="undefined"&&module.exports) module.exports=G.Parse;
})();

<script>
/* ===== 计划看板 / 拆解引擎 / 逾期顺延 / 仪表盘 ===== */
(function(){
"use strict";
var A=window.APP, $=A.$, $$=A.$$, esc=A.esc;
var DB=A.db;
/* 整改状态机（core.js 定义，模块页与仪表盘共用同一套判定） */
var INS=window.INSP;

var MAX_CARRY=3; // 超过 3 次不再自动顺延，转「滞留」待人工处理

/* ---------- 逾期顺延 ---------- */
function nextDue(today,due,level){
  var gap=A.diffDays(due,today); // >0 表逾期天数
  if(gap<=0) return null;
  var d=due;
  if(level==="day") d=A.addDays(due,gap);
  else if(level==="week") d=A.addDays(due,Math.ceil(gap/7)*7);
  else if(level==="month"){
    var dt=A.parseD(due), n=0;
    while((dt.getFullYear()+"-"+((dt.getMonth()+1)<10?"0":"")+(dt.getMonth()+1)+"-"+(dt.getDate()<10?"0":"")+dt.getDate()) < today && n<40){
      dt.setMonth(dt.getMonth()+1); n++;
    }
    d=dt.getFullYear()+"-"+((dt.getMonth()+1)<10?"0":"")+(dt.getMonth()+1)+"-"+(dt.getDate()<10?"0":"")+dt.getDate();
  }else{
    d=today.slice(0,4)+due.slice(4);
    if(d<today) d=(+today.slice(0,4)+1)+due.slice(4);
  }
  return d;
}
function periodOfLevel(level,due){
  if(level==="year") return due.slice(0,4);
  if(level==="month") return due.slice(0,7);
  if(level==="week") return A.weekKey(due);
  return due;
}
function rollover(){
  var today=A.todayStr(), changed=0, stuck=0;
  DB.tasks.forEach(function(t){
    if(t.status==="done"||!t.due) return;
    if(t.due>=today) return;
    if(t.lastRoll===today) return;
    if((t.carried||0)>=MAX_CARRY){ t.stuck=true; stuck++; return; }
    var nd=nextDue(today,t.due,t.level);
    if(!nd) return;
    if(!t.originDue) t.originDue=t.due;
    t.carried=(t.carried||0)+1;
    t.carriedDays=(t.carriedDays||0)+A.diffDays(t.due,today);
    t.lastRoll=today;
    t.due=nd;
    t.period=periodOfLevel(t.level,nd);
    (t.log=t.log||[]).push({at:today,from:t.due,days:A.diffDays(t.due,today)});
    changed++;
  });
  if(changed||stuck){ A.save(); }
  return {changed:changed,stuck:stuck};
}
window.rolloverTasks=rollover;
window.onBoot=function(){
  var r=rollover();
  window.__rollInfo=r;
};

/* ---------- 统计 ---------- */
function collect(level,period){
  var today=A.todayStr();
  var arr=DB.tasks.filter(function(t){
    if(level==="all") return true;
    if(level==="week"){
      if(t.level==="week") return !period||t.period===period;
      if(t.level==="day"){ var r=A.weekRange(period); return t.due>=r[0]&&t.due<=r[1]; }
      return false;
    }
    if(level==="month"){
      if(t.level==="month") return !period||t.period===period;
      if(t.level==="week"||t.level==="day") return String(t.due||"").slice(0,7)===period;
      return false;
    }
    return !period||t.period===period;
  });
  var tw=0,dw=0,done=0,od=0,cd=0;
  arr.forEach(function(t){
    var w=t.weight||1; tw+=w;
    if(t.status==="done"){ dw+=w; done++; }
    else if(t.due&&t.due<today){ od++; }
    if(t.carried) cd++;
  });
  return {list:arr,total:arr.length,done:done,rate:tw?Math.round(dw/tw*1000)/10:0,overdue:od,carried:cd};
}

/* ---------- 通用小部件 ---------- */
function ring(rate,color,label,sub){
  var r=54,c=2*Math.PI*r,off=c*(1-Math.min(rate,100)/100);
  return '<div class="ring"><svg viewBox="0 0 130 130" aria-label="'+esc(label)+' '+rate+'%">'+
    '<circle cx="65" cy="65" r="54" fill="none" stroke="#e8edf3" stroke-width="13"/>'+
    '<circle cx="65" cy="65" r="54" fill="none" stroke="'+color+'" stroke-width="13" stroke-linecap="round" '+
      'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
    '<div class="val"><b style="color:'+color+'">'+rate+'<span style="font-size:13px">%</span></b>'+
    '<span>'+esc(sub||label)+'</span></div></div>';
}
function kpi(k,v,unit,d,color,link){
  var inner='<div class="k">'+esc(k)+(link?'<span class="kpi-arrow">→</span>':'')+'</div>'+
    '<div class="v" style="'+(color?"color:"+color:"")+'">'+esc(v)+(unit?'<small>'+esc(unit)+'</small>':'')+'</div>'+
    (d?'<div class="d">'+d+'</div>':'');
  if(link) return '<a class="card kpi kpi-link" href="'+esc(link)+'" title="查看详情">'+inner+'</a>';
  return '<div class="card kpi">'+inner+'</div>';
}

/* ---------- 任务行 ---------- */
function levelName(l){ return {year:"年度",month:"月度",week:"周",day:"日"}[l]||l; }
function priorityTag(p){ return '<span class="tag t-'+String(p||"P2").toLowerCase()+'">'+esc(p||"P2")+'</span>'; }
function statusTag(s){ return '<span class="tag t-'+s+'">'+({todo:"未开始",doing:"进行中",done:"已完成"}[s]||s)+'</span>'; }

function taskRow(t,opts){
  opts=opts||{};
  var today=A.todayStr();
  var over = t.status!=="done" && t.due && t.due<today;
  var carried = (t.carried||0)>0 && t.status!=="done";
  var proj = t.projectId ? (DB.projects.filter(function(p){return p.id===t.projectId;})[0]||{}).name : "";
  var meta=[];
  meta.push('<span class="tag t-gray">'+levelName(t.level)+'</span>');
  meta.push(priorityTag(t.priority));
  meta.push('<span>'+esc(t.owner||"未指派")+'</span>');
  if(t.due) meta.push('<span>截止 '+esc(t.due)+'</span>');
  if(over) meta.push('<span class="ovd">逾期 '+A.diffDays(t.due,today)+' 天</span>');
  if(carried) meta.push('<span class="overdue-flag">已顺延 '+(t.carried)+' 次</span>');
  if(t.stuck) meta.push('<span class="overdue-flag">滞留待处理</span>');
  if(t.status!=="done"&&!over) meta.push(statusTag(t.status));
  if(proj) meta.push('<span>· '+esc(proj.length>18?proj.slice(0,18)+"…":proj)+'</span>');

  return '<div class="task-row '+(t.status==="done"?"done ":"")+(over?"overdue":"")+'" data-tid="'+esc(t.id)+'">'+
    '<div class="chk" data-toggle="'+esc(t.id)+'" role="checkbox" aria-checked="'+(t.status==="done")+'" tabindex="0">'+
      (t.status==="done"?'<svg width="11" height="11" viewBox="0 0 12 12"><path d="M2 6.2 4.6 8.8 10 3.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'')+
    '</div>'+
    '<div class="body">'+
      '<div class="t-title">'+esc(t.title)+'</div>'+
      '<div class="t-meta">'+meta.join("")+'</div>'+
      (t.note?'<div style="font-size:11.5px;color:var(--muted);margin-top:4px">'+esc(t.note)+'</div>':'')+
    '</div>'+
    '<div class="row-actions">'+
      '<button class="btn sm ghost" data-tedit="'+esc(t.id)+'">编辑</button>'+
      (t.status!=="done"?'<button class="btn sm ghost" data-tdone="'+esc(t.id)+'">完成</button>':'')+
      '<button class="btn sm ghost" style="color:#c0392b" data-tdel="'+esc(t.id)+'">删</button>'+
    '</div>'+
  '</div>';
}

function bindTaskRows(host){
  $$("[data-toggle]",host).forEach(function(el){
    el.onclick=function(){ toggle(this.getAttribute("data-toggle")); };
    el.onkeydown=function(e){ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); toggle(this.getAttribute("data-toggle")); } };
  });
  $$("[data-tdone]",host).forEach(function(b){ b.onclick=function(){ toggle(this.getAttribute("data-tdone"),"done"); }; });
  $$("[data-tedit]",host).forEach(function(b){ b.onclick=function(){ taskForm(this.getAttribute("data-tedit")); }; });
  $$("[data-tdel]",host).forEach(function(b){ b.onclick=function(){
    var id=this.getAttribute("data-tdel");
    var t=DB.tasks.filter(function(x){return x.id===id;})[0];
    if(!confirm("确定删除「"+(t?t.title:"")+"」？")) return;
    DB.tasks=DB.tasks.filter(function(x){return x.id!==id;});
    A.save(); toast("已删除","ok"); render(A.getRoute?A.getRoute():window.getRoute());
  };});
}
function toggle(id,force){
  var t=DB.tasks.filter(function(x){return x.id===id;})[0]; if(!t) return;
  if(force==="done") t.status="done";
  else t.status = t.status==="done"?"todo":"done";
  if(t.status==="done"){ t.doneAt=A.todayStr(); t.stuck=false; }
  A.save();
  var r=window.getRoute();
  window.render(r);
}

/* ---------- 任务表单 ---------- */
function taskForm(id){
  var t = id ? DB.tasks.filter(function(x){return x.id===id;})[0] : {level:"month",period:A.todayStr().slice(0,7),status:"todo",priority:"P1",weight:3,owner:"",source:"项目实际"};
  if(!t) return;

  var body=
   '<div class="form-grid">'+

    '<div class="field"><label for="f_parent">上级目标</label><select id="f_parent"><option value="">— 无 —</option>'+
      parentOpts.map(function(o){return '<option value="'+esc(o[0])+'"'+(t.parent===o[0]?" selected":"")+'>'+esc(o[1])+'</option>';}).join("")+'</select></div>'+
    '<div class="field"><label for="f_owner">负责人</label><input type="text" id="f_owner" value="'+esc(t.owner||"")+'" list="olist" placeholder="姓名">'+

  openModal({

/* ---------- 自动拆解 ---------- */
function breakdown(){
  var months=DB.tasks.filter(function(t){return t.level==="month"&&t.status!=="done";});
  if(!months.length){ toast("没有可拆解的月度目标","err"); return; }
  var body='<p style="margin:0 0 12px;font-size:13px;color:var(--ink-2)">选择一个月度目标，系统将按<b>剩余工作日</b>自动生成周任务；当前周再拆出每日待办。已存在的子任务不会重复生成。</p>'+
   '<div class="field"><label for="f_m">月度目标</label><select id="f_m" style="width:100%">'+
    months.map(function(m){return '<option value="'+m.id+'">'+esc(m.period+"｜"+m.title.slice(0,40))+'</option>';}).join("")+
   '</select></div>'+
   '<div class="field" style="margin-top:12px"><label for="f_n">每层生成粒度</label><select id="f_n" style="width:100%">'+
    '<option value="both">周任务 + 每日待办（推荐）</option>'+
    '<option value="week">仅周任务</option>'+
   '</select></div>'+
   '<div style="margin-top:14px;font-size:12px;color:var(--muted);line-height:1.7">'+
    '规则：以目标截止日为终点，从今天起按自然周切分；每周任务的权重按周数均分，截止日取该周末（不超过月目标截止日）；'+
    '当前周再按工作日生成日待办，每天一条，标题带推进序号。</div>';
  openModal({
    title:"自动拆解 · 月度目标 → 周 → 日",
    body:body, okText:"开始拆解",
    onOk:function(scope){
      var mid=$("#f_m",scope).value, mode=$("#f_n",scope).value;
      var m=DB.tasks.filter(function(t){return t.id===mid;})[0];
      if(!m) return false;
      var today=A.todayStr();
      var end=m.due||A.periodEnd(m.period);
      var start=today> A.periodStart(m.period) ? today : A.periodStart(m.period);
      if(end<start) end=A.addDays(start,7);
      var weeks=[], cur=start;
      while(cur<=end){
        var wk=A.weekKey(cur);
        var rg=A.weekRange(wk);
        var wEnd=rg[1]>end?end:rg[1];
        weeks.push({key:wk,start:cur>rg[0]?cur:rg[0],end:wEnd});
        cur=A.addDays(rg[1],1);
      }
      weeks=weeks.slice(0,10);
      var per=Math.max(1,Math.round((m.weight||3)/Math.max(1,weeks.length)*10)/10);
      var created=0;
      var existing=DB.tasks.filter(function(t){return t.parent===mid;});
      weeks.forEach(function(w,i){
        if(existing.some(function(e){return e.level==="week"&&e.period===w.key;})) return;
        DB.tasks.push({id:A.uid("t"),title:"周推进（"+w.key+"）："+m.title,level:"week",period:w.key,parent:mid,
          owner:m.owner,dept:m.dept,priority:m.priority,status:"todo",due:w.end,weight:per,
          source:"自动拆解",projectId:m.projectId,note:"由月度目标自动拆解，第 "+(i+1)+" / "+weeks.length+" 周"});
        created++;
      });
      if(mode==="both"){
        var thisWk=A.weekKey(today);
        var rg=A.weekRange(thisWk);
        var wkTask=DB.tasks.filter(function(t){return t.parent===mid&&t.level==="week"&&t.period===thisWk;})[0];
        var day=today;
        while(day<=rg[1] && day<=end){
          var dow=A.parseD(day).getDay();
          if(dow!==0&&dow!==6){
            var dup=DB.tasks.some(function(t){return t.parent===mid&&t.level==="day"&&t.period===day;});
            if(!dup){
              DB.tasks.push({id:A.uid("t"),title:"推进："+m.title.slice(0,26)+"（"+day.slice(5)+"）",level:"day",period:day,
                parent:wkTask?wkTask.id:mid,owner:m.owner,dept:m.dept,priority:m.priority,status:"todo",due:day,
                weight:1,source:"自动拆解",projectId:m.projectId,note:"本周每日推进项"});
              created++;
            }
          }
          day=A.addDays(day,1);
        }
      }
      A.save();
      toast("已生成 "+created+" 条子任务","ok");
      window.render(window.getRoute());
    }
  });
}
