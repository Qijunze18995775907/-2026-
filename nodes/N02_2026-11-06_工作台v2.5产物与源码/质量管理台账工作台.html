  var n=0, gone=0;

  var q=db.settings.quickDirs;
  if(q&&typeof q==="object") Object.keys(q).forEach(function(r){
    var c=q[r]; if(!c||typeof c.path!=="string") return;
    /* 快速入口以 DEF_MAP 为权威，旧台账路径一律按新默认目录重置 */
    var np=DEF_MAP.hasOwnProperty(r)?defPath(r):fixPath(c.path);
    if(np!==c.path){
      /* 句柄仍指向旧目录，重置状态要求重新授权，避免误读旧文件 */
      c.path=np; c.status="unbound"; c.idx=[]; c.seen={}; c.ack=[]; c.counts={total:0,new:0,chg:0,gone:0};
      n++;
    }
  });

  /* v1.9：旧配置一律 recurse=false，导致按月/按项目分层的目录整批漏扫，这里一次性校正 */
  if(db.settings.dirCfgV!==2){
    var qq=db.settings.quickDirs;
    if(qq&&typeof qq==="object") Object.keys(qq).forEach(function(r){
      if(qq[r]&&typeof qq[r]==="object") qq[r].recurse=!!DEF_RECURSE[r];
    });
    db.settings.dirCfgV=2; n++;
  }

  var w=db.settings.ws;
  if(w&&typeof w.root==="string"&&/公司级质量台账/.test(w.root)){ w.root=ROOT_PATH; n++; }

  Object.keys(db).forEach(function(k){
    var arr=db[k];
    if(!Array.isArray(arr)) return;
    arr.forEach(function(o){
      if(!o||typeof o!=="object") return;
      if(typeof o.path==="string"&&/公司级质量台账/.test(o.path)){
        var np=fixPath(o.path);
        if(np!==o.path){
          o.path=np; n++;
          if(!np){ gone++; o.note=(o.note?o.note+"；":"")+"原件未随台账迁入新目录，待补充"; }
        }
      }
      if(typeof o.root==="string"&&/公司级质量台账/.test(o.root)){
        var nr=fixPath(o.root);
        if(nr!==o.root){ o.root=nr; n++; }
      }
    });
  });

  if(n){
    db.settings.pathFixAt=nowStr();
    db.settings.pathFixCount=n;
    try{ A.save(); }catch(e){ console.warn("路径迁移保存失败",e); }
    console.info("[路径迁移] 已更正 "+n+" 处引用，其中 "+gone+" 处原件缺失已清空");
  }
  return n;
}

function cfgAll(){
  var db=DB();
  if(!db.settings) db.settings={};
  var q=db.settings.quickDirs;
  if(!q||typeof q!=="object") q=db.settings.quickDirs={};
  Object.keys(DEF_MAP).forEach(function(r){
    var c=q[r];
    if(!c||typeof c!=="object"){
      c=q[r]={};
    }
    if(typeof c.path!=="string") c.path=defPath(r);
    if(typeof c.recurse!=="boolean") c.recurse=!!DEF_RECURSE[r];
    if(typeof c.rw!=="boolean") c.rw=true;
    if(typeof c.status!=="string"||!c.status) c.status="unbound";
    if(typeof c.boundAt!=="string") c.boundAt="";
    if(typeof c.lastScanAt!=="string") c.lastScanAt="";
    if(!Array.isArray(c.idx)) c.idx=[];
    if(!c.seen||typeof c.seen!=="object") c.seen={};
    if(!Array.isArray(c.ack)) c.ack=[];
    if(!c.counts||typeof c.counts!=="object") c.counts={total:0,new:0,chg:0,gone:0};
  });
  return q;
}
function cfgOf(route){
  var q=cfgAll();
  if(!q[route]){
    q[route]={path:"",recurse:false,rw:true,status:"unbound",boundAt:"",lastScanAt:"",
              idx:[],seen:{},ack:[],counts:{total:0,new:0,chg:0,gone:0}};
  }
  return q[route];
}
function isBound(route){ var c=cfgOf(route); return c.status!=="unbound"; }
function boundRoutes(){
  var q=cfgAll();
  return Object.keys(q).filter(function(r){ return q[r].status!=="unbound"; });
}
function listAll(){
  var q=cfgAll();
  return Object.keys(q).map(function(r){
    return {route:r,label:LBL[r]||r,cfg:q[r]};
  }).sort(function(a,b){
    var ia=Object.keys(DEF_MAP).indexOf(a.route), ib=Object.keys(DEF_MAP).indexOf(b.route);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
}

/* ---------- 句柄缓存与权限 ---------- */
var HC={};
function handleOf(route){
  if(HC[route]) return Promise.resolve(HC[route]);
  return hGet(route).then(function(h){ if(h) HC[route]=h; return h; });
}
function permOf(handle,mode){
  if(!handle||!handle.queryPermission) return Promise.resolve("denied");
  return handle.queryPermission({mode:mode||"read"}).catch(function(){ return "denied"; });
}
/* 在用户手势内调用：申请读写授权 */
function ensurePerm(route,mode){
  if(!mode) mode=cfgOf(route).rw?"readwrite":"read";
  return handleOf(route).then(function(h){
    if(!h) throw new Error("NO_HANDLE");
    return permOf(h,mode).then(function(p){
      if(p==="granted") return true;
      if(!h.requestPermission) throw new Error("NO_PERM_API");
      return h.requestPermission({mode:mode}).then(function(p2){
        if(p2==="granted"){ setStatus(route,"ok"); return true; }
        setStatus(route,"denied");
        throw new Error("DENIED");
      });
    });
  });
}
function setStatus(route,st){
  var c=cfgOf(route);
  if(c.status!==st){ c.status=st; A.save(); }
}

/* ---------- 绑定 / 解绑 ---------- */
function pickDir(mode){
  if(!window.showDirectoryPicker) return Promise.reject(new Error("NO_PICKER"));
  return window.showDirectoryPicker({mode:mode||"readwrite",id:"qd_"+Date.now()});
}
function bind(route,opt){
  opt=opt||{};
  var c=cfgOf(route);
  var mode=c.rw?"readwrite":"read";
  return pickDir(mode).then(function(handle){
    HC[route]=handle;
    return hPut(route,handle).then(function(){
      c.path=opt.path||c.path||"";
      c.status="ok";
      c.boundAt=nowStr();
      c.seen={}; c.ack=[]; c.idx=[]; c.counts={total:0,new:0,chg:0,gone:0};
      A.save();
      return handle;
    });
  });
}
function unbind(route){
  var c=cfgOf(route);
  c.status="unbound"; c.path=defPath(route);
  c.boundAt=""; c.lastScanAt=""; c.idx=[]; c.seen={}; c.ack=[];
  c.counts={total:0,new:0,chg:0,gone:0};
  delete HC[route];
  A.save();
  hDel(route);
  return true;
}

/* ---------- 目录遍历 ---------- */
function skipName(name){
  if(!name) return true;
  if(TEMP.test(name)) return true;
  if(name==="$RECYCLE.BIN"||name==="System Volume Information") return true;
  return false;
}
function walk(dir,prefix,out,opt){
  return new Promise(function(resolve){
    var it;
    try{ it=dir.entries(); }catch(e){ resolve(out); return; }
    function step(){
      var nx;
      try{ nx=it.next(); }catch(e){ resolve(out); return; }
      Promise.resolve(nx).then(function(res){
        if(!res||res.done){ resolve(out); return; }
        var name=res.value[0], h=res.value[1];
        if(skipName(name)){ step(); return; }
        if(h.kind==="file"){
          if(out.length>=opt.maxFiles){ step(); return; }
          h.getFile().then(function(f){
            out.push({rel:prefix+name,name:name,size:f.size,mt:f.lastModified,dir:prefix,ok:true});
            step();
          }).catch(function(){
            out.push({rel:prefix+name,name:name,size:0,mt:0,dir:prefix,ok:false});
            step();
          });
        }else{
          if(!opt.recurse || opt.depth>=LIM.maxDepth){ step(); return; }
          walk(h,prefix+name+"/",out,{recurse:opt.recurse,depth:opt.depth+1,maxFiles:opt.maxFiles})
            .then(step);
        }
      }).catch(function(){ resolve(out); });
    }
    step();
  });
}
function scanOne(route){
  var c=cfgOf(route);
  if(c.status==="unbound") return Promise.resolve({route:route,skip:true});
  return handleOf(route).then(function(h){
    if(!h){ setStatus(route,"stale"); return {route:route,err:"NO_HANDLE"}; }
    return permOf(h,"read").then(function(p){
      if(p!=="granted"){ setStatus(route,"needauth"); return {route:route,err:"NEEDAUTH"}; }
      return walk(h,"",[],{recurse:!!c.recurse,depth:0,maxFiles:LIM.maxFiles}).then(function(list){
        var prevIdx=(c.idx||[]).slice();
        c.idx=list;
        c.lastScanAt=nowStr();
        recount(c);
        c.status="ok";
        A.save();
        /* 落库后再比对改名/删除，避免中途失败留下半截状态 */
        if(window.IMPORT&&window.IMPORT.onIndexChange){
          setTimeout(function(){
            try{ window.IMPORT.onIndexChange(route,prevIdx,list); }catch(e){ console.warn("差异同步失败",e); }
          },0);
        }
        return {route:route,list:list};
      });
    });
  }).catch(function(e){
    setStatus(route,"stale");
    return {route:route,err:(e&&e.message)||"ERR"};
  });
}
function recount(c){
  var map={},nw=0,chg=0,gone=0;
  (c.idx||[]).forEach(function(e){
    map[e.rel]=1;
    var k=(e.size||0)+"|"+(e.mt||0);
    if(!c.seen[e.rel]) nw++;
    else if(c.seen[e.rel]!==k) chg++;
  });
  Object.keys(c.seen||{}).forEach(function(rel){ if(!map[rel]) gone++; });
  c.counts={total:(c.idx||[]).length,new:nw,chg:chg,gone:gone};
  return c.counts;
}
/* 只扫权限已 granted 的，不弹授权框（用于自动同步） */
function scanAuto(){
  var rs=boundRoutes().filter(function(r){ var s=cfgOf(r).status; return s==="ok"||s==="stale"; });
  if(!rs.length) return Promise.resolve({changed:0,total:0});
  var before=snapshotCounts();
  return seq(rs,function(r){ return scanOne(r); }).then(function(){
    var after=snapshotCounts();
    var changed=after.nw!==before.nw||after.chg!==before.chg||after.total!==before.total||after.gone!==before.gone;
    return {changed:changed?1:0,total:after.total,nw:after.nw,chg:after.chg};
  });
}
function seq(arr,fn){
  var i=0;
  function next(){
    if(i>=arr.length) return Promise.resolve();
    var x=arr[i++];
    return Promise.resolve(fn(x)).then(next,next);
  }
  return next();
}
function snapshotCounts(){
  var s={total:0,nw:0,chg:0,gone:0,bound:0};
  boundRoutes().forEach(function(r){
    var c=cfgOf(r), n=recount(c);
    s.total+=n.total; s.nw+=n.new; s.chg+=n.chg; s.gone+=n.gone; s.bound++;
  });
  return s;
}
function totals(){ return snapshotCounts(); }
function countOf(route){
  var c=cfgOf(route);
  if(!c.idx||!c.idx.length) return {total:0,new:0,chg:0};
  return recount(c);
}

/* ---------- 路径解析（相对路径 → 文件句柄） ---------- */
function resolve(route,rel){
  return handleOf(route).then(function(h){
    if(!h) throw new Error("NO_HANDLE");
    var parts=String(rel||"").split("/").filter(Boolean);
    if(!parts.length) throw new Error("BAD_PATH");
    var cur=Promise.resolve(h);
    parts.slice(0,-1).forEach(function(seg){
      cur=cur.then(function(d){ return d.getDirectoryHandle(seg); });
    });
    return cur.then(function(d){ return d.getFileHandle(parts[parts.length-1]); });
  });
}

/* ---------- 二进制读取：不设体积上限，交给 <img> 自行解码 ---------- */
function readBlob(route,rel){
  return resolve(route,rel).then(function(fh){ return fh.getFile(); });
}

/* ---------- 绝对路径 → 已绑定入口（最长前缀） ---------- */
function normPath(p){
  var s=String(p||"").replace(/\//g,"\\").replace(/\\{2,}/g,"\\");
  return s.replace(/\\+$/,"");
}
/* 返回 Promise<{route,rel,perm}> 或 null；不做授权申请，避免非手势调用 */
function routeByPath(path){
  var raw=normPath(path), p=raw.toLowerCase(), best=null, q=cfgAll();
  if(!p) return Promise.resolve(null);
  Object.keys(q).forEach(function(r){
    var base=normPath(q[r].path).toLowerCase();
    if(!base||/^[a-z]:\\?$/.test(base)) return;
    if(p.indexOf(base+"\\")!==0) return;
    if(best&&base.length<=best.len) return;
    best={route:r,len:base.length,rel:raw.slice(base.length+1).replace(/\\/g,"/")};
  });
  if(!best) return Promise.resolve(null);
  return handleOf(best.route).then(function(h){
    if(!h) return null;
    return permOf(h,"read").then(function(perm){
      return {route:best.route, rel:best.rel, perm:perm};
    });
  });
}

/* ---------- 文本读写（编码 / 换行 / BOM） ---------- */
function decodeBuf(buf){
  var b=new Uint8Array(buf), bom=false, enc="utf-8", text="";
  if(b.length>=3&&b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF){ bom=true; b=b.subarray(3); }
  else if(b.length>=2&&b[0]===0xFF&&b[1]===0xFE){
    try{ text=new TextDecoder("utf-16le").decode(b.subarray(2)); }catch(e){ text=""; }
    return {text:text,enc:"utf-16le",bom:false};
  }else if(b.length>=2&&b[0]===0xFE&&b[1]===0xFF){
    try{ text=new TextDecoder("utf-16be").decode(b.subarray(2)); }catch(e){ text=""; }
    return {text:text,enc:"utf-16be",bom:false};
  }
  try{
    text=new TextDecoder("utf-8",{fatal:true}).decode(b);
    enc="utf-8";
  }catch(e){
    try{ text=new TextDecoder("gbk").decode(b); enc="gbk"; }
    catch(e2){ text=new TextDecoder("utf-8").decode(b); enc="utf-8"; }
  }
  return {text:text,enc:enc,bom:bom};
}
function eolOf(t){
  if(t.indexOf("\r\n")>=0) return "\r\n";
  if(t.indexOf("\r")>=0) return "\r";
  return "\n";
}
function readText(route,rel){
  return resolve(route,rel).then(function(fh){
    return fh.getFile();
  }).then(function(f){
    if(f.size>LIM.maxText) throw new Error("TOO_BIG");
    return f.arrayBuffer();
  }).then(function(buf){
    var d=decodeBuf(buf);
    return {text:d.text,enc:d.enc,bom:d.bom,eol:eolOf(d.text),size:0};
  });
}
function writeText(route,rel,text,opt){
  opt=opt||{};
  var c=cfgOf(route);
  if(!c.rw) return Promise.reject(new Error("READONLY"));
  return ensurePerm(route,"readwrite").then(function(){
    return resolve(route,rel);
  }).then(function(fh){
    return fh.createWritable().then(function(w){
      var data=text;
      if(opt.eol&&opt.eol!=="\n") data=text.replace(/\r\n|\r|\n/g,opt.eol);
      /* 浏览器没有 UTF-16/GBK 编码器：统一按 UTF-8 写回，需要时保留 BOM */
      var body=new TextEncoder().encode(data);
      var arr=opt.bom?new Uint8Array(body.length+3):body;
      if(opt.bom){ arr[0]=0xEF; arr[1]=0xBB; arr[2]=0xBF; arr.set(body,3); }
      var blob=new Blob([arr],{type:"text/plain;charset=utf-8"});
      return w.write(blob).then(function(){ return w.close(); });
    });
  }).then(function(){
    return scanOne(route);
  }).then(function(){ return true; });
}
/* 整文件替换（docx/xlsx 等二进制） */
function replaceFile(route,rel,file){
  var c=cfgOf(route);
  if(!c.rw) return Promise.reject(new Error("READONLY"));
  return ensurePerm(route,"readwrite").then(function(){
    return resolve(route,rel);
  }).then(function(fh){
    return fh.createWritable().then(function(w){
      return w.write(file).then(function(){ return w.close(); });
    });
  }).then(function(){ return scanOne(route); }).then(function(){ return true; });
}
function createFile(route,rel,blob){
  var c=cfgOf(route);
  if(!c.rw) return Promise.reject(new Error("READONLY"));
  return ensurePerm(route,"readwrite").then(function(){
    return handleOf(route);
  }).then(function(h){
    if(!h) throw new Error("NO_HANDLE");
    return h.getFileHandle(rel,{create:true}).then(function(fh){
      return fh.createWritable().then(function(w){
        return w.write(blob||new Blob([""],{type:"text/plain"})).then(function(){ return w.close(); });
      });
    });
  }).then(function(){ return scanOne(route); }).then(function(){ return true; });
}
function removeEntry(route,rel){
  return ensurePerm(route,"readwrite").then(function(){
    return handleOf(route);
  }).then(function(h){
    if(!h) throw new Error("NO_HANDLE");
    return h.removeEntry(rel);
  }).then(function(){ return scanOne(route); }).then(function(){ return true; });
}

/* ---------- 待确认（新增/变更）与知悉 ---------- */
function pendingOf(route){
  var c=cfgOf(route);
  var out=[];
  (c.idx||[]).forEach(function(e){
    var k=(e.size||0)+"|"+(e.mt||0);
    if(!c.seen[e.rel]) out.push({rel:e.rel,name:e.name,kind:"new",size:e.size,mt:e.mt});
    else if(c.seen[e.rel]!==k) out.push({rel:e.rel,name:e.name,kind:"chg",size:e.size,mt:e.mt});
  });
  return out;
}
/* 只标记知悉（清待确认计数），不写文件中心；opt.silent 时不落库，由调用方合并保存 */
function ack(route,rels,opt){
  var c=cfgOf(route);
  if(!Array.isArray(c.ack)) c.ack=[];
  (c.idx||[]).forEach(function(e){
    if(rels&&rels.length&&rels.indexOf(e.rel)<0) return;
    c.seen[e.rel]=(e.size||0)+"|"+(e.mt||0);
  });
  rels&&rels.forEach(function(r){ if(c.ack.indexOf(r)<0) c.ack.push(r); });
  if(c.ack.length>800) c.ack=c.ack.slice(-800);
  recount(c);
  if(!(opt&&opt.silent)) A.save();
  return true;
}

/* ---------- 确认（= 知悉 + 归档进文件中心） ---------- */
function absOf(route,rel){
  var base=String(cfgOf(route).path||"").replace(/[\\/]+$/,"");
  var rest=String(rel||"").replace(/\//g,"\\");
  return base?(base+"\\"+rest):rest;
}
/* 返回 {ok,n,snap}；snap 供撤销用（记下新增的 id 与被更新记录的原状态） */
function confirmFiles(route,rels,opt){
  opt=opt||{};
  var c=cfgOf(route);
  var ps=pendingOf(route), pend={};
  ps.forEach(function(p){ pend[p.rel]=p; });
  var list=(rels&&rels.length)?rels.slice():ps.map(function(p){ return p.rel; });
  var files=DB().files||(DB().files=[]);
  var snap={route:route,items:[],prevSeen:{},n:0};
  list.forEach(function(rel){
    var p=pend[rel]; if(!p) return;                 /* 已确认过 / 索引里没有：跳过 */
    var mod=typeof opt.mod==="function"?opt.mod(rel):(opt.mod||modOfRoute(route));
    var abs=absOf(route,rel), low=normPath(abs).toLowerCase(), hit=null;
    for(var i=0;i<files.length;i++){
      if(files[i]&&files[i].path&&normPath(files[i].path).toLowerCase()===low){ hit=files[i]; break; }
    }
    if(hit){
      snap.items.push({id:hit.id,isNew:false,prevStatus:hit.status,
        prevStatusAt:hit.statusAt,prevSize:hit.size,prevDate:hit.date});
      hit.status="confirmed"; hit.statusAt=nowStr();
      hit.size=p.size||hit.size; hit.date=dateOf(p.mt)||hit.date;
      hit.route=route; hit.rel=rel;
    }else{
      var id=A.uid("f");
      files.push({
        id:id, name:p.name, size:p.size||0, type:"", module:mod, projectId:"", note:"",
        date:dateOf(p.mt)||A.todayStr(), mode:"path", path:abs, key:"",
        src:"folder", route:route, rel:rel, status:"confirmed", statusAt:nowStr()
      });
      snap.items.push({id:id,isNew:true});
    }
    snap.prevSeen[rel]=c.seen?c.seen[rel]:undefined;
    if(!c.seen) c.seen={};
    c.seen[rel]=(p.size||0)+"|"+(p.mt||0);
    if(!Array.isArray(c.ack)) c.ack=[];
    if(c.ack.indexOf(rel)<0) c.ack.push(rel);
    snap.n++;
  });
  if(!snap.n) return {ok:false,n:0,snap:null};
  if(c.ack.length>800) c.ack=c.ack.slice(-800);
  recount(c);
  if(!opt.silent) A.save();
  /* 确认即触发解析：路径与入口此时已确定，是最佳时机 */
  if(!opt.noImport&&window.IMPORT&&window.IMPORT.enqueue){
    var ids=snap.items.map(function(x){ return x.id; });
    setTimeout(function(){ try{ window.IMPORT.enqueue(ids); }catch(e){} },opt.silent?600:0);
  }
  return {ok:true,n:snap.n,snap:snap};
}
/* 撤销：删掉本次新增的文件记录、还原被更新记录、可选还原 seen 指纹 */
function undoConfirm(snaps,restoreSeen){
  if(!snaps) return 0;
  if(!Array.isArray(snaps)) snaps=[snaps];
  var n=0;
  snaps.forEach(function(s){
    if(!s) return;
    var files=DB().files||[], c=cfgOf(s.route);
    (s.items||[]).forEach(function(it){
      var idx=-1;
      for(var i=0;i<files.length;i++){ if(files[i]&&files[i].id===it.id){ idx=i; break; } }
      if(it.isNew){ if(idx>=0) files.splice(idx,1); }
      else if(idx>=0){
        var f=files[idx];
        if(it.prevStatus===undefined) delete f.status; else f.status=it.prevStatus;
        if(it.prevStatusAt===undefined) delete f.statusAt; else f.statusAt=it.prevStatusAt;
        if(it.prevSize!==undefined) f.size=it.prevSize;
        if(it.prevDate!==undefined) f.date=it.prevDate;
      }
      n++;
    });
    if(restoreSeen!==false&&s.prevSeen){
      if(!c.seen) c.seen={};
      Object.keys(s.prevSeen).forEach(function(rel){
        var v=s.prevSeen[rel];
        if(v===undefined) delete c.seen[rel]; else c.seen[rel]=v;
        if(Array.isArray(c.ack)){
          var j=c.ack.indexOf(rel); if(j>=0) c.ack.splice(j,1);
        }
      });
      recount(c);
    }
  });
  A.save();
  return n;

function inboxItems(){

    ps.slice(0,20).forEach(function(p){

/* ---------- 自动同步 ---------- */
var TIMER=null, LAST=0, BUSY=false;
function refreshViews(){
  var r=(location.hash||"").replace(/^#\/?/,"").split("?")[0];
  if(r==="dash"||r==="folder"||r==="space"){
    if(window.render) window.render(r,true);

}
function autoScan(opt){
  opt=opt||{};
  if(BUSY) return Promise.resolve({skip:true});
  if(document.visibilityState!=="visible"&&!opt.force) return Promise.resolve({skip:true});
  BUSY=true;
  var t0=Date.now();
  return scanAuto().then(function(res){
    BUSY=false; LAST=Date.now();
    /* 扫描后若状态从 needauth 变 ok，仍需一次重新渲染 */
    if(res.changed||opt.force) refreshViews();
    return res;
  }).catch(function(e){ BUSY=false; console.warn("文件夹同步失败",e); return {err:1}; });
}
function startWatch(){
  if(TIMER) clearInterval(TIMER);
  TIMER=setInterval(function(){
    if(document.visibilityState!=="visible") return;
    if(Date.now()-LAST<55000) return;
    autoScan({});
  },60000);
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="visible") autoScan({});
  });
  window.addEventListener("focus",function(){
    if(Date.now()-LAST>20000) autoScan({});
  });
}
/* 首次进入：恢复句柄并检查权限（不弹窗） */
function restore(){
  var rs=boundRoutes();
  if(!rs.length) return Promise.resolve();
  return seq(rs,function(route){
    var c=cfgOf(route);
    return handleOf(route).then(function(h){
      if(!h){ if(c.status==="ok") { c.status="stale"; A.save(); } return; }
      return permOf(h,"read").then(function(p){
        if(p==="granted") return scanOne(route);
        if(c.status!=="unbound"){ c.status="needauth"; A.save(); }
      });
    });
  });
}

/* ---------- 错误文案 ---------- */
function errText(e){
  var m=(e&&e.message)||String(e||"");
  if(m==="NO_HANDLE") return "尚未授权该文件夹，请先点「授权文件夹」";
  if(m==="NEEDAUTH") return "访问权限已失效，请点「重新授权」";
  if(m==="DENIED") return "授权被拒绝，无法读写该文件夹";
  if(m==="READONLY") return "该入口为只读绑定，不能写回。可在绑定设置中改为读写";
  if(m==="TOO_BIG") return "文件超过 2 MB，不提供站内编辑";
  if(m==="BAD_PATH") return "文件路径无效";
  if(m==="NO_PICKER") return "当前浏览器不支持目录授权，请用 Edge 或 Chrome 打开本文件";
  if(/AbortError/.test(m)) return "";
  if(/NotAllowedError|SecurityError/.test(m)) return "浏览器拒绝了该操作，请重新点击按钮（需要在页面内直接点击）";
  if(/NoModificationAllowedError|NotReadableError|InvalidStateError/.test(m))
    return "文件正被其他程序占用（如 Word 已打开），请先关闭再保存";
  if(/NotFoundError/.test(m)) return "文件或文件夹已不存在，可能已改名或删除";
  if(/QuotaExceededError/.test(m)) return "磁盘空间不足";
  if(/TypeMismatchError/.test(m)) return "目标不是文件（可能被同名文件夹占用）";
  return "操作失败："+(m||"未知错误");
}

/* ---------- 导出 ---------- */
window.QD={
  LIM:LIM, LBL:LBL, DEF_MAP:DEF_MAP, MOD_ROUTE:MOD_ROUTE, ROUTE_MOD:ROUTE_MOD, modOfRoute:modOfRoute,
  cfgAll:cfgAll, cfgOf:cfgOf, listAll:listAll, isBound:isBound, boundRoutes:boundRoutes,
  guardPath:guardPath, nameOfPath:nameOfPath, fmtSize:fmtSize, dateOf:dateOf, extOf:extOf, isText:isText,
  IMG_EXT:IMG_EXT, IMG_MIME:IMG_MIME, isImg:isImg, readBlob:readBlob, routeByPath:routeByPath, normPath:normPath,
  bind:bind, unbind:unbind, handleOf:handleOf, ensurePerm:ensurePerm, permOf:permOf,
  scanOne:scanOne, scanAuto:scanAuto, restore:restore, startWatch:startWatch, autoScan:autoScan,
  totals:totals, countOf:countOf, pendingOf:pendingOf, ack:ack, inboxItems:inboxItems,
  confirmFiles:confirmFiles, undoConfirm:undoConfirm, absOf:absOf,
  readText:readText, writeText:writeText, replaceFile:replaceFile, createFile:createFile,
  removeEntry:removeEntry, resolve:resolve, errText:errText, nowStr:nowStr,
  _decode:decodeBuf, migrate:migrate, fixPath:fixPath, ROOT:ROOT_PATH, DEF:DEF_MAP,
  _recount:recount,
  _setHandle:function(route,h){ HC[route]=h; }
};

/* ---------- 启动 ---------- */
(function(){

<script>
/* ===== 图片预览：本地文件夹 / 文件中心 共用同一个弹层 ===== */
(function(){
"use strict";
var A=window.APP, esc=A.esc;

/* 单例：同一时刻只允许一个预览，保证只有一个 objectURL 存活 */
var cur=null;

/* ---------- 失败分类 ---------- */
var T={
  NO_HANDLE:{t:"该文件夹尚未授权",d:"浏览器没有保存这个文件夹的访问句柄。点「重试」会重新发起一次授权。"},
  BAD_PATH:{t:"文件路径无效",d:"索引里的相对路径为空，请回文件夹视图刷新后重试。"},
  NO_ROUTE:{t:"找不到文件所在的文件夹",d:"这条记录只登记了路径，且该路径不在任何已绑定入口下。请先到「本地文件夹」绑定所在目录。"},
  NEED_PERM:{t:"已定位到文件夹，但尚未授权",d:"点「重试」重新授权该文件夹即可预览。"},
  NOT_FOUND:{t:"文件已不存在",d:"可能被删除、改名或移动。请回「本地文件夹」刷新索引后再试。"},
  DENIED:{t:"浏览器收回了读取权限",d:"这是浏览器安全策略，需要你亲手点一次授权。"},
  UNREADABLE:{t:"文件无法读取",d:"可能正被其他程序占用，或 U 盘、网络盘已断开。"},
  TYPE_MISMATCH:{t:"目标不是文件",d:"该路径被同名文件夹占用。"},
  DECODE:{t:"浏览器无法显示这张图",d:"文件可能已损坏，或内容与扩展名不符（例如把 tif 改名成 png）。"},
  EMPTY:{t:"文件是空的",d:"0 字节，没有可显示的内容。"},
  NO_BLOB:{t:"浏览器文件库里找不到该文件",d:"可能清理过浏览器缓存或换了浏览器，需要重新上传。"},
  NO_IDB:{t:"本地文件库不可用",d:"浏览器禁用了 IndexedDB，或该库被其他标签页占用。"},
  UNKNOWN:{t:"预览失败",d:"发生了未预期的错误。"}
};

function mkErr(code){ var e=new Error(code); e.code=code; return e; }

function classify(e){
  var c=(e&&e.code)||"", n=(e&&e.name)||"", m=(e&&e.message)||String(e||"");
  if(c&&T[c]) return T[c];
  if(m==="NO_HANDLE") return T.NO_HANDLE;
  if(m==="BAD_PATH") return T.BAD_PATH;
  if(m==="NO_ROUTE") return T.NO_ROUTE;
  if(m==="NEED_PERM") return T.NEED_PERM;
  if(m==="NO_BLOB") return T.NO_BLOB;
  if(m==="NO_IDB") return T.NO_IDB;
  if(m==="DENIED"||m==="NO_PERM_API") return T.DENIED;
  if(n==="NotFoundError"||/NotFoundError/.test(m)) return T.NOT_FOUND;
  if(n==="NotAllowedError"||n==="SecurityError"||/NotAllowedError|SecurityError/.test(m)) return T.DENIED;
  if(n==="NotReadableError"||n==="InvalidStateError"||/NotReadableError|InvalidStateError/.test(m)) return T.UNREADABLE;
  if(n==="TypeMismatchError") return T.TYPE_MISMATCH;
  return {t:T.UNKNOWN.t,d:"原始错误："+(n||m||"未知")};
}

/* Windows 缺 .svg/.avif/.ico 的 MIME 映射时 File.type 为空，
   而 SVG 的 Content-Type 不对就不会渲染，这里按扩展名补齐 */
function fixType(blob,name){
  var m=/\.([a-z0-9]+)$/i.exec(name||"");
  var ext=m?m[1].toLowerCase():"";
  var want=(window.QD&&window.QD.IMG_MIME&&window.QD.IMG_MIME[ext])||"";
  if(!want) return blob;
  if(blob.type===want) return blob;
  if(blob.type&&/^image\//.test(blob.type)) return blob;
  try{ return new Blob([blob],{type:want}); }catch(e){ return blob; }
}

/* ---------- 主入口 ---------- */
function open(opt){
  opt=opt||{};
  if(!opt.getBlob){ return null; }
  if(cur) cur.close();

  var mask=document.createElement("div");
  mask.className="iv-mask";
  mask.innerHTML='<div class="iv-load">正在读取图片…</div>';
  document.body.appendChild(mask);

  var url=null, imgEl=null, alive=true, busy=false;
  var prevOv=document.body.style.overflow;
  document.body.style.overflow="hidden";

  function clearImg(){
    if(imgEl){
      imgEl.onload=null; imgEl.onerror=null;
      try{ imgEl.removeAttribute("src"); }catch(e){}
      imgEl=null;
    }
    if(url){ try{ URL.revokeObjectURL(url); }catch(e){} url=null; }
  }

  function dispose(){
    if(!alive) return;
    alive=false;
    clearImg();
    document.removeEventListener("keydown",onKey,true);
    window.removeEventListener("hashchange",dispose);
    window.removeEventListener("pagehide",dispose);
    document.body.style.overflow=prevOv;
    if(mask.parentNode) mask.parentNode.removeChild(mask);
    if(cur===ctl) cur=null;
  }

  function onKey(e){
    if(e.key!=="Escape"&&e.keyCode!==27) return;
    e.preventDefault();
    e.stopPropagation();
    dispose();
  }

  mask.addEventListener("click",function(e){
    var t=e.target;
    if(t&&t.nodeType===1&&(t.closest("[data-iv-act]")||t.closest(".iv-panel"))) return;
    dispose();
  });
  document.addEventListener("keydown",onKey,true);
  window.addEventListener("hashchange",dispose);
  window.addEventListener("pagehide",dispose);

  function paintImg(){
    mask.innerHTML="";
    mask.appendChild(imgEl);
  }

  function paintFail(info){
    var extra="";
    if(opt.size) extra=" · "+window.QD.fmtSize(opt.size);
    mask.innerHTML=
      '<div class="iv-panel">'+
        '<div class="iv-ic">!</div>'+
        '<div class="iv-t">'+esc(info.t)+'</div>'+
        '<div class="iv-d">'+esc(info.d)+
          (opt.path?'<br><span class="iv-p">'+esc(opt.path)+'</span>'+(extra?esc(extra):''):"")+
        '</div>'+
        '<div class="iv-acts">'+
          '<button class="btn primary" data-iv-act="retry">重试</button>'+
          '<button class="btn" data-iv-act="copy">复制路径</button>'+
          '<button class="btn" data-iv-act="detail">详情</button>'+
        '</div>'+
      '</div>';
    var r=mask.querySelector('[data-iv-act="retry"]');
    var c=mask.querySelector('[data-iv-act="copy"]');
    var d=mask.querySelector('[data-iv-act="detail"]');
    if(!opt.path) c.disabled=true;
    if(!opt.onDetail) d.disabled=true;
    r.onclick=function(ev){ ev.stopPropagation(); load(true); };
    c.onclick=function(ev){
      ev.stopPropagation();
      if(window.copyText) window.copyText(opt.path);
      else if(window.toast) window.toast(opt.path,"ok");
      if(window.toast) window.toast("路径已复制","ok");
    };
    d.onclick=function(ev){
      ev.stopPropagation();
      var fn=opt.onDetail;
      dispose();
      setTimeout(function(){ try{ fn(); }catch(e){ console.warn(e); } },0);
    };
  }

  function fail(e){
    busy=false;
    clearImg();
    paintFail(classify(e));
  }

  function load(escalate){
    if(!alive) return;
    busy=true;
    clearImg();
    mask.innerHTML='<div class="iv-load">正在读取图片…</div>';

    Promise.resolve().then(function(){
      return opt.getBlob(!!escalate);
    }).then(function(blob){
      if(!alive) return;
      if(!blob||!blob.size) throw mkErr("EMPTY");
      url=URL.createObjectURL(fixType(blob,opt.name));
      imgEl=new Image();
      imgEl.className="iv-img";
      imgEl.alt=opt.name||"";
      imgEl.onload=function(){
        if(!alive) return;
        busy=false;
        paintImg();
      };
      imgEl.onerror=function(){
        if(!alive) return;
        fail(mkErr("DECODE"));
      };
      imgEl.src=url;
    }).catch(function(e){
      if(alive) fail(e);
    });
  }

  var ctl={el:mask, close:dispose, retry:function(){ load(true); }};
  cur=ctl;
  load(false);
  return ctl;
}

function close(){ if(cur) cur.close(); }

window.ImgView={
  open:open, close:close,
  isOpen:function(){ return !!cur; },
  _classify:classify, _fixType:fixType, _T:T
};
})();

</script>
<script>
/* ===== 文件夹视图：快速入口 → 浏览 / 编辑 / 保存回本地 ===== */
(function(){

function QD(){return window.QD;}

  unbound:{l:"未授权",cls:"t-gray"},
  ok:{l:"已授权",cls:"t-green"},

function fileUrl(p){

}

var PUNDO=null;/* {snaps:[],n} 最近一次确认，供撤销 */

    var ps=QD().pendingOf(r);

/* 确认 / 忽略 / 撤销：只重绘待确认卡与计数，不动整页，避免丢滚动位置 */

function doIgnore(host,pairs){
  var snap={route:"",items:[],prevSeen:{},n:0}, n=0;

function pickModule(host,key){

  var mods=["综合","计划看板","质量会议","质量培训","质量活动统计","在建项目","QC 活动","质量检查",

    body:'<div class="field"><label>确认后归入哪个模块</label><select id="qdModSel">'+

function paintPending(host){

  }else{

/* ---------- 绑定 / 换绑弹窗 ---------- */
function openBind(route){
  var c=QD().cfgOf(route);
  var lbl=QD().LBL[route]||route;
  var body=
    '<div style="font-size:12.5px;color:var(--muted);line-height:1.75;margin-bottom:12px">'+
      '1) 先填写该文件夹在电脑上的完整路径（用于核对与复制）；<br>'+

      '3) 浏览器只把「你选中的目录」记成句柄，路径文字本身不能用来读文件。'+
    '</div>'+
    '<div class="field"><label>文件夹路径</label>'+
      '<input type="text" id="qdPath" value="'+esc(c.path||"")+'" placeholder="E:\\workbuddy 缓存\\workbuddy\\总工作台\\raw\\a资源\\2026公司质量管理台账\\1、质量会议（每月统计）"></div>'+
    '<div class="qd-row2">'+

    '</div>'+
    '<div class="qd-hintbox" id="qdHint">'+
      '授权后系统会立即扫描一次，列出文件数量与待确认项。'+
    '</div>';

  openModal({
    title:"绑定文件夹 · "+lbl,
    okText:"选择文件夹并授权",
    body:body,
    onOk:function(scope){
      var p=$("#qdPath",scope).value.trim();
      var g=QD().guardPath(p);
      if(!g.ok){ toast(g.msg,"err"); return false; }
      var cc=QD().cfgOf(route);
      cc.path=p; cc.rw=$("#qdRW",scope).checked; cc.recurse=$("#qdRec",scope).checked;
      A.save();
      var btn=$("[data-ok]",scope);
      btn.disabled=true; btn.textContent="等待选择…";
      QD().bind(route,{path:p}).then(function(handle){
        /* 文件夹名与路径末段不一致时提示（浏览器只给名字） */
        var pn=QD().nameOfPath(p);
        var back=function(){
          window.render("folder",true); toast("已绑定「"+handle.name+"」","ok");
        };
        return QD().scanOne(route).then(function(){
          var cnt=QD().countOf(route);

          }
          return {cnt:cnt};
        }).then(back);
      }).catch(function(e){
        btn.disabled=false; btn.textContent="选择文件夹并授权";
        if(/AbortError/.test((e&&e.message)||"")){ toast("已取消选择","err"); return; }
        toast(QD().errText(e),"err");
      });
      return false;
    }
  });
}

/* ---------- 列表 ---------- */
function paintList(host,route){
  var box=$("#qdList",host); if(!box) return;
  var c=QD().cfgOf(route);
  var q=VS.q.toLowerCase();
  var pending={};
  QD().pendingOf(route).forEach(function(p){ pending[p.rel]=p.kind; });

  /* 子目录：从索引的相对路径里推导当前层 */
  var base=VS.dir?VS.dir+"/":"";
  var dirs={}, files=[];
  (c.idx||[]).forEach(function(e){
    if(VS.dir && e.rel.indexOf(base)!==0) return;
    var rest=VS.dir?e.rel.slice(base.length):e.rel;
    if(rest.indexOf("/")>=0){
      var d=rest.split("/")[0];
      dirs[d]=(dirs[d]||0)+1;
    }else{
      files.push(e);
    }
  });

  if(q) files=files.filter(function(e){ return e.name.toLowerCase().indexOf(q)>=0; });
  if(VS.filter==="text") files=files.filter(function(e){ return QD().isText(e.name); });
  if(VS.filter==="pending") files=files.filter(function(e){ return !!pending[e.rel]; });

  if(VS.sort==="mt") files.sort(function(a,b){ return (b.mt||0)-(a.mt||0); });
  else if(VS.sort==="size") files.sort(function(a,b){ return (b.size||0)-(a.size||0); });
  else files.sort(function(a,b){ return String(a.name).localeCompare(String(b.name),"zh-CN"); });

  var h="";
  var dirNames=Object.keys(dirs).sort(function(a,b){ return a.localeCompare(b,"zh-CN"); });
  if(dirNames.length&&!q){
    h+='<div class="qd-dirs">'+dirNames.map(function(d){
      return '<button class="qd-dir" data-dir="'+esc(VS.dir?VS.dir+"/"+d:d)+'">'+
        '<span class="qd-dir-ic">▸</span><span class="qd-dir-n">'+esc(d)+'</span>'+
        '<span class="qd-dir-c">'+dirs[d]+'</span></button>';
    }).join("")+'</div>';
  }

  if(!files.length&&!dirNames.length){
    h+='<div class="empty">这个文件夹里没有可显示的文件'+
      (c.status!=="ok"?"（当前为快照，重新授权后可读取实际内容）":"")+'</div>';
  }else if(files.length){
    h+='<div class="qd-files">';
    files.forEach(function(e){
      var st=pending[e.rel];
      var isImg=QD().isImg(e.name);
      var canEdit=QD().isText(e.name)&&c.rw&&c.status==="ok";
      var imgAttr=isImg?' data-img="'+esc(e.rel)+'"':'';
      var actBtn=isImg
        ? '<button class="btn sm" data-view="'+esc(e.rel)+'">预览</button>'
        : QD().isText(e.name)
          ? '<button class="btn sm'+(canEdit?" primary":"")+'" data-edit="'+esc(e.rel)+'">'+(canEdit?"编辑":"查看")+'</button>'
          : '<button class="btn sm" data-view="'+esc(e.rel)+'">详情</button>';
      h+='<div class="qd-file'+(isImg?" qd-imgrow":"")+'">'+
        '<div class="qd-ext"'+imgAttr+(isImg?' role="button" tabindex="0" title="点击预览"':'')+'>'+
          esc((QD().extOf(e.name)||"—").slice(0,4).toUpperCase())+'</div>'+
        '<div class="qd-fmain">'+
          '<div class="qd-fname"'+imgAttr+' title="'+esc(e.rel)+'">'+esc(e.name)+
            (st==='new'?'<span class="tag t-p2">新增</span>':st==='chg'?'<span class="tag t-amber">已变更</span>':'')+
            (!QD().isText(e.name)?'<span class="tag t-gray">只读</span>':'')+
          '</div>'+
          '<div class="qd-fmeta">'+QD().fmtSize(e.size)+' · '+QD().dateOf(e.mt)+' · '+esc(e.rel.split("/").slice(0,-1).join("/")||"根目录")+'</div>'+
        '</div>'+
        '<div class="qd-fact">'+
          actBtn+
          (c.rw&&c.status==="ok"?'<button class="btn sm ghost" data-replace="'+esc(e.rel)+'">替换</button>':'')+
          '<button class="btn sm ghost" data-copy="'+esc(e.rel)+'">路径</button>'+
          (c.rw&&c.status==="ok"?'<button class="btn sm ghost" style="color:#c0392b" data-del="'+esc(e.rel)+'">删</button>':'')+
        '</div></div>';
    });
    h+='</div>';
  }
  box.innerHTML=h;

  $$("[data-dir]",box).forEach(function(b){
    b.onclick=function(){ VS.dir=this.getAttribute("data-dir"); VS.q=""; paintList(host,route); };
  });
  $$("[data-edit]",box).forEach(function(b){
    b.onclick=function(){ openEditor(route,this.getAttribute("data-edit")); };
  });
  $$("[data-view]",box).forEach(function(b){
    b.onclick=function(){
      var rel=this.getAttribute("data-view");
      if(QD().isImg(rel)) openImg(route,rel);
      else fileInfo(route,rel);
    };
  });
  /* 双入口：扩展名方块 + 文件名 */
  $$("[data-img]",box).forEach(function(el){
    el.onclick=function(){ openImg(route,this.getAttribute("data-img")); };
    if(el.getAttribute("role")==="button"){
      el.onkeydown=function(ev){
        if(ev.key==="Enter"||ev.key===" "){
          ev.preventDefault();
          openImg(route,this.getAttribute("data-img"));
        }
      };
    }
  });
  $$("[data-replace]",box).forEach(function(b){
    b.onclick=function(){ replacePick(route,this.getAttribute("data-replace")); };
  });
  $$("[data-copy]",box).forEach(function(b){
    b.onclick=function(){
      var rel=this.getAttribute("data-copy");
      var p=joinVar(QD().cfgOf(route).path,rel);
      if(window.copyText) window.copyText(p); else toast(p,"ok");
    };
  });
  $$("[data-del]",box).forEach(function(b){
    b.onclick=function(){
      var rel=this.getAttribute("data-del");
      if(!confirm("删除本地文件「"+rel+"」？\n此操作会直接删除 E 盘原件，不可撤销。")) return;
      QD().removeEntry(route,rel).then(function(){
        toast("已删除","ok"); window.render("folder",true);
      },function(e){ toast(QD().errText(e),"err"); });
    };
  });

  /* 面包屑点击 */
  $$("[data-crumb]",host).forEach(function(b){
    b.onclick=function(){ VS.dir=this.getAttribute("data-crumb"); VS.q=""; paintList(host,route); };
  });
  /* 工具条 */
  var qi=$("#qdQ",host);
  if(qi) qi.oninput=function(){ VS.q=this.value; var pos=this.selectionStart; paintList(host,route);
    var n=$("#qdQ",host); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } };
  var so=$("#qdSort",host);
  if(so) so.onchange=function(){ VS.sort=this.value; paintList(host,route); };
  var fi=$("#qdFilter",host);
  if(fi) fi.onchange=function(){ VS.filter=this.value; paintList(host,route); };
}

/* ---------- 文本编辑器 ---------- */
function openEditor(route,rel){
  var c=QD().cfgOf(route);
  var name=rel.split("/").pop();
  var mask=openModal({
    title:(c.rw?"编辑 · ":"查看 · ")+name,
    okText:c.rw?"保存写回":"关闭",
    noCancel:!c.rw,
    body:'<div class="qd-ed-head" id="qdEdHead">读取中…</div>'+
      '<textarea class="qd-ed" id="qdEd" spellcheck="false" disabled placeholder="正在读取文件…"></textarea>'+
      '<div class="qd-ed-foot" id="qdEdFoot"></div>',
    onOk:function(scope){
      if(!c.rw) return true;
      var ta=$("#qdEd",scope);
      if(ta.disabled) return false;
      var btn=$("[data-ok]",scope);
      btn.disabled=true; btn.textContent="保存中…";
      QD().writeText(route,rel,ta.value,{bom:mask._bom,eol:mask._eol,enc:mask._enc}).then(function(){
        toast("已保存到本地","ok");
        mask._saved=true;
        btn.disabled=false; btn.textContent="保存写回";
        window.render("folder",true);
      }).catch(function(e){
        btn.disabled=false; btn.textContent="保存写回";
        toast(QD().errText(e),"err");
      });
      return false;
    }
  });
  var modal=$(".modal",mask); if(modal) modal.classList.add("modal-wide");

  QD().readText(route,rel).then(function(d){
    var ta=$("#qdEd",mask);
    mask._bom=d.bom; mask._eol=d.eol; mask._enc=d.enc;
    ta.value=d.text;
    ta.disabled=false;
    ta.onkeydown=function(e){
      if((e.ctrlKey||e.metaKey)&&(e.key==="s"||e.key==="S")){
        e.preventDefault();
        var ok=$("[data-ok]",mask); if(ok&&!ok.disabled) ok.click();
      }
    };
    setTimeout(function(){ ta.focus(); },60);
    var encName=d.enc==="gbk"?"GBK":d.enc==="utf-16le"?"UTF-16 LE":d.enc==="utf-16be"?"UTF-16 BE":"UTF-8";
    $("#qdEdHead",mask).innerHTML='<span>'+esc(rel)+'</span><span class="qd-ed-meta">原编码 '+encName+
      (d.bom?" · 含 BOM":"")+' · 换行 '+(d.eol==="\r\n"?"CRLF":d.eol==="\r"?"CR":"LF")+'</span>';
    var warn="";
    if(d.enc==="gbk") warn="该文件为 GBK 编码，保存后将以 UTF-8 写回（记事本、Excel、WPS 均可正常打开）。";
    if(d.enc==="utf-16le"||d.enc==="utf-16be") warn="该文件为 UTF-16 编码，保存后将以 UTF-8 写回。";
    $("#qdEdFoot",mask).innerHTML='<span class="qd-ed-cnt" id="qdCnt">'+d.text.length+' 字</span>'+
      (warn?'<span class="qd-ed-warn">'+warn+'</span>':'')+
      '<span class="qd-ed-kb">Ctrl + S 保存</span>';
    ta.oninput=function(){ var el=$("#qdCnt",mask); if(el) el.textContent=this.value.length+" 字"; };
  },function(e){
    $("#qdEdHead",mask).textContent=QD().errText(e);
    toast(QD().errText(e),"err");
    var ok=$("[data-ok]",mask); if(ok) ok.style.display="none";
  });
}

/* ---------- 图片预览（走共用弹层） ---------- */
function openImg(route,rel){
  if(!window.ImgView){ toast("预览模块未加载，请重新构建页面","err"); return; }
  var c=QD().cfgOf(route);
  var it=(c.idx||[]).filter(function(x){ return x.rel===rel; })[0]||{};
  var full=joinVar(c.path,rel);
  window.ImgView.open({
    name:rel.split("/").pop(), size:it.size||0, path:full,
    getBlob:function(escalate){
      var pre=escalate?QD().ensurePerm(route,"read"):Promise.resolve();
      return pre.then(function(){ return QD().readBlob(route,rel); });
    },
    onDetail:function(){ fileInfo(route,rel); }
  });
}

/* ---------- 二进制文件信息 / 替换 / 新建 ---------- */
function fileInfo(route,rel){
  var c=QD().cfgOf(route);
  var idx=(c.idx||[]).filter(function(e){ return e.rel===rel; })[0]||{};
  var full=joinVar(c.path,rel);
  openModal({
    title:"文件详情",
    okText:"复制完整路径",
    body:'<div class="qd-info">'+
      '<div class="qd-info-r"><span>文件名</span><b>'+esc(idx.name||rel.split("/").pop())+'</b></div>'+
      '<div class="qd-info-r"><span>相对路径</span><b>'+esc(rel)+'</b></div>'+
      '<div class="qd-info-r"><span>完整路径</span><b style="word-break:break-all">'+esc(full)+'</b></div>'+
      '<div class="qd-info-r"><span>大小</span><b>'+QD().fmtSize(idx.size)+'</b></div>'+
      '<div class="qd-info-r"><span>修改时间</span><b>'+QD().dateOf(idx.mt)+'</b></div>'+
      '<div class="qd-info-r"><span>站内编辑</span><b>不支持（二进制格式）</b></div>'+
      '</div>'+
      '<div class="qd-tip" style="margin-top:10px">浏览器无法启动 Word / Excel，也不能修改二进制格式。'+
      '可以「复制完整路径」后在资源管理器中打开编辑；改完回到本页点「刷新」，仪表盘会同步大小与修改时间。</div>',
    onOk:function(){
      if(window.copyText) window.copyText(full);
      toast("路径已复制","ok");
      return true;
    }
  });
}
function replacePick(route,rel){
  var inp=document.createElement("input");
  inp.type="file";
  inp.onchange=function(){
    var f=this.files&&this.files[0]; if(!f) return;
    if(!confirm("用「"+f.name+"」覆盖写回「"+rel.split("/").pop()+"」？\n原文件内容会被替换。")) return;
    QD().replaceFile(route,rel,f).then(function(){
      toast("已替换写回","ok"); window.render("folder",true);
    },function(e){ toast(QD().errText(e),"err"); });
  };
  inp.click();
}
function newTextFile(route){
  var c=QD().cfgOf(route);
  openModal({
    title:"新建文本文件",
    okText:"创建",
    body:'<div class="field"><label>文件名（含扩展名）</label>'+
      '<input type="text" id="qdNewName" value="新建记录.txt" placeholder="如：2026-11 质量检查记录.txt"></div>'+
      '<div class="qd-hintbox" style="margin-top:10px">将创建在当前目录：<b>'+esc(VS.dir||"根目录")+
      '</b>。支持 .txt / .md / .csv / .json。</div>',
    onOk:function(scope){
      var n=$("#qdNewName",scope).value.trim();
      if(!n){ toast("请填写文件名","err"); return false; }
      if(/[\\/:*?"<>|]/.test(n)){ toast("文件名不能包含 \\ / : * ? \" < > |","err"); return false; }
      var rel=VS.dir?VS.dir+"/"+n:n;
      var blob=new Blob(["\ufeff"],{type:"text/plain;charset=utf-8"});
      QD().createFile(route,rel,blob).then(function(){
        toast("已创建","ok"); window.render("folder",true);
      },function(e){ toast(QD().errText(e),"err"); });
      return true;
    }
  });
}

/* ---------- 页面注册 ---------- */
window.regPage("folder",{
  sub:"快速入口绑定的本地文件夹：浏览、编辑、保存回原件",
  render:function(host){
    if(!window.QD){
      host.innerHTML='<div class="card"><div class="card-b empty">文件夹模块未加载</div></div>';
      return;
    }
    if(!window.showDirectoryPicker){
      host.innerHTML='<div class="card"><div class="card-b">'+
        '<div class="qd-alert warn"><div><b>当前浏览器不支持目录授权</b>'+
        '<div class="qd-alert-d">本功能需要 Chromium 内核（Edge / Chrome）并支持 File System Access API。'+
        '请用 Edge 打开本文件后重试。</div></div></div></div></div>';
      return;
    }
    var route=window.getParam?window.getParam("r"):"";
    var detail=$("#pageTitle");
    if(route){ VS.dir=""; VS.q=""; }
    if(!route){ renderOverview(host); if(detail) detail.textContent="文件夹总览"; return; }
    if(detail) detail.textContent="文件夹 · "+(QD().LBL[route]||route);
    renderDetail(host,route);
    /* 进入即扫（不弹授权） */
    var c=QD().cfgOf(route);
    if(c.status==="ok"){
      setTimeout(function(){
        QD().autoScan({force:false});
      },400);
    }
  }
});
})();

</script>
<script>
/* ===== 文档生成：打印版 / CSV / 月报 / 备份恢复 ===== */
(function(){
"use strict";
var A=window.APP, $=A.$, esc=A.esc;
function DB(){return A.db;}
var CO={company:"湖北省中大地质基础工程勘察有限公司",title:"2026 年度质量管理台账"};

function dl(filename,content,mime){
  var blob=new Blob([content],{type:mime||"text/plain;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },400);
}
function csvCell(v){
  if(v===null||v===undefined) return "";
  var s=String(v).replace(/"/g,'""');
  return /[",\n\r]/.test(s)?'"'+s+'"':s;
}
function rowsToCSV(headers,rows){
  var out=headers.map(function(h){return csvCell(h.l);}).join(",")+"\r\n";
  rows.forEach(function(r){
    out+=headers.map(function(h){
      var v = h.get?h.get(r):r[h.k];
      return csvCell(v);
    }).join(",")+"\r\n";
  });
  return out;
}

/* ---------- 单表 CSV ---------- */
window.exportCSV=function(key,def,rows){
  var cols=def.cols.filter(function(c){return c.k.charAt(0)!=="_";});
  var headers=cols.map(function(c){return {l:c.l,get:function(r){
    if(c.csv) return c.csv(r[c.k],r);
    if(c.k==="projectId"){ var p=DB().projects.filter(function(x){return x.id===r.projectId;})[0]; return p?p.name:""; }
    if(c.k==="inspectionId"){ return r.inspectionId||""; }
    return r[c.k];
  }};});
  var csv="\ufeff"+rowsToCSV(headers,rows);
  dl(def.title+"_"+A.todayStr()+".csv",csv,"text/csv;charset=utf-8");
  toast("已导出 "+rows.length+" 条记录","ok");
};

/* ---------- 全量 CSV ---------- */
window.exportAllCSV=function(){
  var db=DB();
  var map=[
    ["tasks","质量任务"],["projects","在建项目"],["meetings","质量会议"],["trainings","质量培训"],
    ["stats","质量活动统计"],["qcs","QC质量活动"],["inspections","质量检查"],["issues","检查问题"],
    ["reviews","施工方案内审"],["briefings","技术交底"],["risks","风险识别"],["orgs","质量管理机构"],
    ["guides","作业指导书"],["policies","质量管理办法及制度"],["inbox","待处理事项"]
  ];
  var out="\ufeff";
  map.forEach(function(m){
    var arr=db[m[0]]||[];
    out+="# "+m[1]+"（"+arr.length+" 条）\r\n";
    if(!arr.length){ out+="（无记录）\r\n\r\n"; return; }
    var keys=Object.keys(arr[0]).filter(function(k){return k!=="log";});
    out+=keys.join(",")+"\r\n";
    arr.forEach(function(r){
      out+=keys.map(function(k){
        var v=r[k];
        if(k==="projectId"){ var p=db.projects.filter(function(x){return x.id===v;})[0]; return csvCell(p?p.name:v); }
        if(Array.isArray(v)) v=v.length+" 项";
        if(typeof v==="object"&&v!==null) v=JSON.stringify(v);
        return csvCell(v);
      }).join(",")+"\r\n";
    });
    out+="\r\n";
  });
  dl("质量管理台账_全量_"+A.todayStr()+".csv",out,"text/csv;charset=utf-8");
  toast("已导出全部 15 类台账","ok");
};

/* ---------- 打印工具 ----------
   所有标签一律用 L+"..." 拼接：源码中不得出现文档类型声明与脚本标签的字面量，
   否则浏览器的 HTML 解析器会提前截断这段内嵌脚本。 */
function printHTML(title,bodyHTML,subtitle){
  var w=window.open("","_blank");
  if(!w){ toast("浏览器拦截了打印窗口，请允许弹窗","err"); return; }
  var L="<";
  var h=L+'!DOCTYPE html>'+L+'html lang="zh-CN">'+L+'head>'+L+'meta charset="utf-8">'+
  L+'title>'+esc(title)+L+'/title>'+L+'style>'+
  '@page{size:A4 landscape;margin:14mm 12mm}'+
  'body{font-family:"SimSun","宋体","Microsoft YaHei",serif;color:#000;font-size:10.5pt;line-height:1.6;margin:0}'+
  '.hd{text-align:center;margin-bottom:10px}'+
  '.hd .co{font-size:12pt;font-weight:700;letter-spacing:2px}'+
  '.hd h1{font-size:16pt;margin:6px 0 2px;font-weight:700}'+
  '.hd .sub{font-size:9pt;color:#444}'+
  'table{width:100%;border-collapse:collapse;font-size:9pt;margin-top:8px}'+
  'th,td{border:1px solid #333;padding:4px 6px;vertical-align:top;word-break:break-word}'+
  'th{background:#eee;font-weight:700;text-align:center}'+
  'td.c{text-align:center}'+
  '.ft{margin-top:14px;font-size:9pt;display:flex;justify-content:space-between}'+
  '.note{margin-top:8px;font-size:9pt;color:#333}'+
  '@media print{body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}'+
  L+'/style>'+L+'/head>'+L+'body>'+
  L+'div class="hd">'+L+'div class="co">'+esc(CO.company)+L+'/div>'+L+'h1>'+esc(title)+L+'/h1>'+
  L+'div class="sub">'+esc(subtitle||CO.title)+'　制表日期：'+A.todayStr()+L+'/div>'+L+'/div>'+
  bodyHTML+
  L+'div class="ft">'+L+'span>制表：质量管理部'+L+'/span>'+L+'span>审核：'+esc(DB().meta.tech||"")+L+'/span>'+
  L+'span>批准：'+esc(DB().meta.leader||"")+L+'/span>'+L+'/div>'+
  L+'script>window.onload=function(){setTimeout(function(){window.print();},300);};'+L+'/script>'+
  L+'/body>'+L+'/html>';
  w.document.open();
  w.document.write(h);
  w.document.close();
}

window.printHTML=printHTML;

window.printTable=function(key,def,rows){
  var cols=def.cols.filter(function(c){return c.k.charAt(0)!=="_";});
  var body='<table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c.l)+'</th>';}).join("")+'</tr></thead><tbody>';
  if(!rows.length) body+='<tr><td colspan="'+cols.length+'" class="c">暂无记录</td></tr>';
  rows.forEach(function(r){
    body+='<tr>'+cols.map(function(c){
      var v;
      if(c.print) v=c.print(r[c.k],r);
      else if(c.k==="projectId"){ var p=DB().projects.filter(function(x){return x.id===r.projectId;})[0]; v=p?p.name:""; }
      else v=r[c.k];
      if(typeof v==="object"&&v!==null) v="";
      return '<td'+(c.num?' class="c"':'')+'>'+esc(v==null?"":v)+'</td>';
    }).join("")+'</tr>';
  });
  body+='</tbody></table>';
  body+='<div class="note">共 '+rows.length+' 条记录。</div>';
  printHTML(def.title+"台账",body);
};

/* ---------- 质量月报 ---------- */
window.printMonthlyReport=function(){
  var db=DB();
  var mo=(function(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1<10?"0":"")+(d.getMonth()+1); })();
  var today=A.todayStr();

  var mTasks=db.tasks.filter(function(t){return t.level==="month"&&t.period===mo;});
  var wTasks=db.tasks.filter(function(t){return t.level==="week"&&String(t.due).slice(0,7)===mo;});
  var dTasks=db.tasks.filter(function(t){return t.level==="day"&&String(t.due).slice(0,7)===mo;});
  function rate(arr){ var tw=0,dw=0; arr.forEach(function(t){var w=t.weight||1;tw+=w;if(t.status==="done")dw+=w;}); return tw?Math.round(dw/tw*1000)/10:0; }

  var mChecks=db.inspections.filter(function(i){return String(i.date).slice(0,7)===mo;});

window.restoreJSON=function(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=function(){
    var f=inp.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        if(!d.tasks||!d.projects) throw new Error("文件格式不正确");
        if(!confirm("将用备份文件覆盖当前全部数据，确定继续？")) return;
        localStorage.setItem("ZLGL_DB_V1",JSON.stringify(d));
        toast("已恢复，正在重新加载…","ok");
        setTimeout(function(){ location.reload(); },600);
      }catch(e){ toast("恢复失败："+e.message,"err"); }
    };
    rd.readAsText(f);
  };
  inp.click();
};
})();

    '<dxfs count="0"/><tableStyles count="0"/>'+
    '</styleSheet>';
  return x;
}

/* ---------- 5. 行高估算（模板行高随内容变化，这里按内容重算） ---------- */
function linesOf(s,perLine){
  var parts=String(s===null||s===undefined?"":s).split("\n"), n=0;
  for(var i=0;i<parts.length;i++){
    var p=parts[i], w=0;
    for(var j=0;j<p.length;j++) w += p.charCodeAt(j)>255 ? 1 : 0.55;
    n += Math.max(1,Math.ceil(w/perLine));
  }
  return n||1;
}
function rowHeight(vals){
  var mx=1;
  for(var i=0;i<19;i++){
    var d=DCOLS[i]; if(!d.w) continue;
    var per=COLW[i]*11/d.sz*0.55;
    var n=linesOf(vals[i],per);
    if(n>mx) mx=n;
  }
  var h=mx*18*1.30+6;
  if(h<40) h=40;
  if(h>409) h=409;
  return Math.round(h*100)/100;
}

/* ---------- 6. sheet1.xml ---------- */
function buildSheet(title,unit,clerk,cutTxt,rows){
  var last=3+rows.length;
  var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>'+
    '<dimension ref="A1:'+colName(19)+last+'"/>'+
    '<sheetViews><sheetView zoomScale="70" zoomScaleNormal="70" workbookViewId="0">'+
      '<pane xSplit="2" ySplit="2" topLeftCell="C3" activePane="bottomRight" state="frozen"/>'+
      '<selection pane="bottomRight" activeCell="C3" sqref="C3"/>'+
    '</sheetView></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="22.5"/>'+
    '<cols>'+COLW.map(function(w,i){
      /* OOXML 的 width 含左右内边距，Excel 显示值比它小 0.625，这里补回以便与模板逐列一致 */
      return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(w+0.625)+'" customWidth="1"/>';
    }).join("")+'</cols>'+
    '<sheetData>';

  /* 第 1 行：大标题，合并 A1:S1 */
  x+='<row r="1" ht="80.1" customHeight="1">'+
      cell("A1",S.title,title)+'</row>';

  /* 第 2 行：单位 / 统计 / 统计截止日期（A2:B2、J2:S2 合并） */
  var r2="";
  for(var i=1;i<=19;i++){
    var ref=colName(i)+"2", si=S.r2C, v="";
    if(i===1){ si=S.r2L; v=unit; }
    else if(i===5){ si=S.r2C; v=clerk; }
    else if(i===10){ si=S.r2R; v=cutTxt; }
    else if(i===2){ si=S.r2L; }
    else if(i>=10){ si=S.r2R; }
    r2+=cell(ref,si,v);
  }
  x+='<row r="2" ht="49.9" customHeight="1">'+r2+'</row>';

  /* 第 3 行：19 列表头 */
  x+='<row r="3" ht="54" customHeight="1">'+
      HDR.map(function(h,i){
        return cell(colName(i+1)+"3", i===5?S.hdrF:S.hdr, h);
      }).join("")+'</row>';

  /* 第 4 行起：业务数据 */
  rows.forEach(function(vals,idx){
    var r=4+idx, h=rowHeight(vals);
    var buf='<row r="'+r+'" ht="'+h+'" customHeight="1">';
    for(var c=0;c<19;c++){
      var isNum=(c===0||c===5) && typeof vals[c]==="number";
      buf+=cell(colName(c+1)+r, S.data[c], vals[c], isNum);
    }
    x+=buf+'</row>';
  });

  x+='</sheetData>'+
    '<mergeCells count="3"><mergeCell ref="A1:S1"/><mergeCell ref="A2:B2"/><mergeCell ref="J2:S2"/></mergeCells>'+
    '<pageMargins left="0.3937" right="0.3937" top="0.3937" bottom="0.3937" header="0.5118" footer="0.5118"/>'+
    '<pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0" horizontalDpi="600" verticalDpi="600"/>'+
    '</worksheet>';
  return x;
}

/* ---------- 7. 其余 OOXML 部件 ---------- */
function buildWorkbook(){
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<workbookPr/><bookViews><workbookView activeTab="0"/></bookViews>'+
    '<sheets><sheet name="'+xesc(SHEET_NAME)+'" sheetId="1" r:id="rId1"/></sheets>'+

}

function buildTypes(){

    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    '</Types>';

/* ---------- 8. ZIP（仅存储，不压缩；xlsx 允许 method=0） ---------- */
var CRCT=(function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(u8){
  var c=0xFFFFFFFF;
  for(var i=0,n=u8.length;i<n;i++) c=CRCT[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function utf8(s){
  if(window.TextEncoder) return new TextEncoder().encode(s);
  var b=[],i,c;                       /* 兜底：手工 UTF-8 */
  for(i=0;i<s.length;i++){
    c=s.charCodeAt(i);
    if(c<0x80) b.push(c);
    else if(c<0x800) b.push(0xC0|(c>>6),0x80|(c&63));
    else if(c>=0xD800&&c<=0xDBFF){
      var c2=s.charCodeAt(++i);
      var cp=0x10000+((c-0xD800)<<10)+(c2-0xDC00);
      b.push(0xF0|(cp>>18),0x80|((cp>>12)&63),0x80|((cp>>6)&63),0x80|(cp&63));
    }else b.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));
  }
  return new Uint8Array(b);
}
function dosTime(d){
  var y=d.getFullYear(); if(y<1980) y=1980;
  return {
    t:((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,
    d:(((y-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF
  };
}
function zipStore(files){
  var now=dosTime(new Date()), chunks=[], central=[], off=0;
  files.forEach(function(f){
    var nm=utf8(f.name), data=f.u8, crc=crc32(data);
    var lh=new Uint8Array(30+nm.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034B50,true);
    dv.setUint16(4,20,true);           /* version needed */
    dv.setUint16(6,0x0800,true);       /* UTF-8 文件名 */
    dv.setUint16(8,0,true);            /* method 0 = store */
    dv.setUint16(10,now.t,true); dv.setUint16(12,now.d,true);
    dv.setUint32(14,crc,true);
    dv.setUint32(18,data.length,true);
    dv.setUint32(22,data.length,true);
    dv.setUint16(26,nm.length,true); dv.setUint16(28,0,true);
    lh.set(nm,30);
    chunks.push(lh,data);

    var cd=new Uint8Array(46+nm.length), cv=new DataView(cd.buffer);
    cv.setUint32(0,0x02014B50,true);
    cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true);
    cv.setUint16(12,now.t,true); cv.setUint16(14,now.d,true);
    cv.setUint32(16,crc,true);
    cv.setUint32(20,data.length,true);
    cv.setUint32(24,data.length,true);
    cv.setUint16(28,nm.length,true);
    cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true);
    cv.setUint32(38,0,true);
    cv.setUint32(42,off,true);
    cd.set(nm,46);
    central.push(cd);
    off += lh.length + data.length;
  });
  var cdSize=0;
  central.forEach(function(c){ cdSize+=c.length; });
  var eocd=new Uint8Array(22), ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054B50,true);
  ev.setUint16(4,0,true); ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true);
  ev.setUint32(16,off,true);
  ev.setUint16(20,0,true);

  var total=off+cdSize+22, out=new Uint8Array(total), p=0;
  chunks.concat(central,[eocd]).forEach(function(c){ out.set(c,p); p+=c.length; });
  return out;
}

/* ---------- 9. 组装整个工作簿 ---------- */
function pre(tag,s){
  s=String(s||"");
  if(!s) return "";
  return s.indexOf(tag)===0 ? s : tag+s;
}
function buildFile(opt){
  initStyles();
  var rows=opt.rows;
  var files=[
    {name:"[Content_Types].xml",        u8:utf8(buildTypes())},
    {name:"_rels/.rels",                u8:utf8(buildRootRels())},
    {name:"xl/workbook.xml",            u8:utf8(buildWorkbook())},
    {name:"xl/_rels/workbook.xml.rels", u8:utf8(buildWbRels())},
    {name:"xl/styles.xml",              u8:utf8(buildStyles())},
    {name:"xl/worksheets/sheet1.xml",   u8:utf8(buildSheet(
        opt.title,
        pre("单位：",opt.unit),
        pre("统计：",opt.clerk),
        pre("统计截止日期：",opt.cut),
        rows))}
  ];
  return zipStore(files);
}

/* ---------- 10. 导出选项（记住上次填写） ---------- */
function todayISO(){
  var d=new Date();
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function loadOpt(){
  var o=null;
  try{ o=JSON.parse(localStorage.getItem(LSKEY)||"null"); }catch(e){}
  o=o||{};
  var d=new Date();
  var def={
    unit:"湖北省地质局第五地质大队",
    clerk:"王亚风",
    dept:"黄石公司",
    cut:todayISO(),
    title:d.getFullYear()+"年"+(d.getMonth()+1)+"月所有项目/业务清单",
    sort:"origin",
    withDone:true
  };
  for(var k in def){ if(o[k]===undefined||o[k]===null||o[k]==="") o[k]=def[k]; }
  return o;
}
function saveOpt(o){
  try{ localStorage.setItem(LSKEY,JSON.stringify(o)); }catch(e){}
}

/* ---------- 11. 取数并排序 ---------- */
function pickRows(opt){
  var list=(DB().projects||[]).slice();
  if(!opt.withDone) list=list.filter(function(p){ return !isFin(p.status); });
  if(opt.sort==="amount") list.sort(function(a,b){ return (numOf(b.amount)||0)-(numOf(a.amount)||0); });
  else if(opt.sort==="start") list.sort(function(a,b){ return String(a.start||"")<String(b.start||"")?-1:1; });
  return list;
}

/* ---------- 12. 下载 ---------- */
function saveBlob(name,u8){
  var blob=new Blob([u8],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },600);
}

/* ---------- 13. 界面：导出设置弹窗 ---------- */
function openExport(){
  var pj=DB().projects||[];
  if(!pj.length){ toast("当前没有项目记录，无法导出","err"); return; }
  var o=loadOpt();
  var body=
    '<div style="margin-bottom:12px;font-size:12.5px;line-height:1.8;background:var(--panel-2);padding:10px 12px;border-radius:7px">'+
      '按桌面模板「中大…所有项目业务清单.xls」的版式导出：19 列表头、列顺序、列宽、字体字号、边框、合并单元格、冻结窗格全部保持原样，仅替换为工作台中的实际项目数据。'+
    '</div>'+
    formHTML([
      {k:"title",l:"清单标题",t:"text",full:true},
      {k:"unit",l:"单位",t:"text",full:true},
      {k:"clerk",l:"统计人",t:"text"},
      {k:"dept",l:"承担部门（二级单位）",t:"text"},
      {k:"cut",l:"统计截止日期",t:"date"},
      {k:"sort",l:"排序方式",t:"select",opts:[["origin","按台账录入顺序"],["start","按开工日期"],["amount","按合同额从高到低"]]},
      {k:"withDone",l:"包含已完工/已验收项目",t:"checkbox",full:true}
    ],o)+
    '<div id="xlsxPrev" style="margin-top:4px;font-size:12.5px;color:var(--muted)"></div>';
  var mask=openModal({
    title:"导出项目业务清单（Excel）",
    okText:"导出 .xlsx",
    body:body,
    afterRender:function(scope){
      var cnt=$("#xlsxPrev",scope);
      function refresh(){
        var cur=Object.assign({},o,readForm(scope,[
          {k:"withDone",t:"checkbox"}
        ]));
        var n=pickRows({withDone:$("#f_withDone",scope).checked}).length;
        cnt.textContent="将导出 "+n+" 条项目记录（工作表名「Sheet1 」，19 列）。";
      }
      $("#f_withDone",scope).onchange=refresh;
      refresh();
    },
    onOk:function(scope){
      var d=readForm(scope,[
        {k:"title",t:"text"},{k:"unit",t:"text"},{k:"clerk",t:"text"},
        {k:"dept",t:"text"},{k:"cut",t:"date"},{k:"sort",t:"select"},{k:"withDone",t:"checkbox"}
      ]);
      if(!d.title){ toast("请填写清单标题","err"); return false; }
      saveOpt(d);
      var list=pickRows(d);
      if(!list.length){ toast("没有符合条件的项目记录","err"); return false; }
      var rows=list.map(function(p,i){ return mapRow(p,i,d); });
      var u8;
      try{
        u8=buildFile({
          title:d.title, unit:d.unit, clerk:d.clerk,
          cut:d.cut?ymd(d.cut):"",
          rows:rows
        });
      }catch(err){
        toast("生成失败："+(err&&err.message||err),"err");
        if(window.console) console.error(err);
        return false;
      }
      var fname=("中大"+d.title).replace(/[\\/:*?"<>|]/g,"")+".xlsx";
      saveBlob(fname,u8);
      toast("已导出 "+rows.length+" 条 · "+fname,"ok");
      return true;
    }
  });
  return mask;
}

/* ---------- 14. 对外接口 ---------- */
window.exportProjectList=openExport;
window.__xlsx={
  build:buildFile,
  map:mapRow,
  pick:pickRows,
  opt:loadOpt,
  sheetXML:function(o){ initStyles(); return buildSheet(o.title,o.unit,o.clerk,o.cut,o.rows); },
  stylesXML:function(){ initStyles(); return buildStyles(); },
  crc32:crc32,
  zip:zipStore,
  utf8:utf8
};
})();

</script>
<script>
/* ===== 同步引擎（v1.9）：文件 → 解析 → 差异 → 落库 → 回退 → 对账 =====
   设计要点：
   1) 文件身份与路径解耦：files.id 是主键，rel 只是当前路径，改名只改 rel；
   2) 单向真相源：解析结果 → 台账行，台账行带 srcFileId/srcKey，手工行永不被自动删改；
   3) 批次事务：一个文件一个 batch，整批成功或整批回滚，可单批撤销；
   4) 分级确认：结构固定的表（统计/项目/机构/指导书/制度）自动落库，其余进差异预览；
   5) 全部异步串行，绝不阻塞扫描，也不整页重绘。 */
(function(){
"use strict";
var A=window.APP, $=A.$, $$=A.$$, esc=A.esc;
function DB(){return A.db;}
function P(){return window.Parse;}

var MAX_BYTES=12*1024*1024;
var AUTO_ROUTES={"stats":1,"projects":1,"orgs":1,"guides":1,"policies":1,"inspect":1};
var ROUTES=["stats","projects","orgs","guides","policies","meetings","trainings","qcs","reviews","brief","inspect"];

/* ---------------- 文件名规则识别（图片 / 扫描件 / 无文本层文件的兜底） ---------------- */
var NAME_RULES=[
  {route:"stats",    re:/(质量活动统计|活动统计|质量月报|统计表)/},
  {route:"inspect",  re:/(检查|巡检|整改|回复|通知单)/},
  {route:"issues",   re:/(问题|隐患|缺陷|通病)/},
  {route:"trainings",re:/(培训|教育|学习|签到)/},
  {route:"meetings", re:/(会议|纪要)/},
  {route:"policies", re:/(制度|办法|规定|细则|程序)/},
  {route:"guides",   re:/(指导书|作业指导|规程|方案|交底|工艺)/},
  {route:"projects", re:/(项目|业务清单|台账)/},
  {route:"orgs",     re:/(机构|组织|人员|分工|职责)/}
];
var ROUTE_LABEL={stats:"质量活动统计",inspect:"质量检查整改回复",issues:"问题清单",
  policies:"制度文件",guides:"作业指导书",projects:"在建项目业务清单",
  orgs:"组织机构与职责",meetings:"会议记录",trainings:"教育培训"};
/* 从文件名猜模块与期间：2026.3 / 2026年3月 / 2026-03-05 / 202603 */
function guessMonth(name){
  var s=String(name||"");
  var m=/(20\d{2})\s*[年.\-_\/]\s*(\d{1,2})(?!\d)/.exec(s);
  if(!m){
    m=/(20\d{2})(0[1-9]|1[0-2])(?:\d{2})?/.exec(s);
    if(m) return m[1]+"-"+m[2];
    return "";
  }
  var mo=+m[2];
  if(mo<1||mo>12) return "";
  return m[1]+"-"+pad(mo);
}
function filenameHint(rec){
  var name=rec&&rec.name;
  if(!name) return null;
  var route="", i;
  /* 所在目录若已绑定模块，以目录为准 */
  if(rec.route&&ROUTE_LABEL[rec.route]) route=rec.route;
  if(!route){
    /* 取命中关键词最长的那条规则，等长时靠前优先（如「培训签到」归培训而非会议） */
    var bestLen=0;
    for(i=0;i<NAME_RULES.length;i++){
      var mm=NAME_RULES[i].re.exec(name);
      if(!mm) continue;
      if(mm[0].length>bestLen){ bestLen=mm[0].length; route=NAME_RULES[i].route; }
    }
  }
  var mon=guessMonth(name);
  if(!route&&!mon) return null;
  var label=(route?ROUTE_LABEL[route]:rec.module||"未定模块")+(mon?(" · "+mon.replace("-"," 年 ")+" 月"):"");
  return {route:route,month:mon,label:label};
}
/* 同名相邻文件配对：图片/扫描件所在目录里，找主名相近且有文本层的文件 */
function pairOf(rec){
  if(!rec||!rec.name) return null;
  var files=DB().files||[];
  var base=String(rec.name).replace(/\.[^.]+$/,"").replace(/[\s\-_（）()]/g,"");
  var dir=String(rec.rel||rec.path||"").replace(/[^\/\\]*$/,"");
  var best=null,score=0;
  files.forEach(function(f){
    if(!f||f.id===rec.id) return;
    var p=f.parse||{};
    if(p.state!=="ok"&&p.state!=="preview") return;
    var fdir=String(f.rel||f.path||"").replace(/[^\/\\]*$/,"");
    if(dir&&fdir!==dir) return;
    var fb=String(f.name||"").replace(/\.[^.]+$/,"").replace(/[\s\-_（）()]/g,"");
    if(!fb) return;
    var s=0;
    if(fb===base) s=3;
    else if(fb.indexOf(base)>=0||base.indexOf(fb)>=0) s=2;
    else{
      /* 期间相同也算弱配对（2026.3会议记录 ↔ 2026年3月统计） */
      var m1=guessMonth(rec.name), m2=guessMonth(f.name);
      if(m1&&m1===m2) s=1;
    }
    if(s>score){ score=s; best=f; }
  });
  return score>=1?best:null;

  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function txt(v){ return String(v===null||v===undefined?"":v).replace(/\s+/g," ").trim(); }
function num(v){
  if(v===null||v===undefined||v==="") return null;
  if(typeof v==="number") return isFinite(v)?v:null;
  var s=String(v).replace(/[,，\s]/g,"").replace(/[^\d.\-]/g,"");
  if(!s||s==="-"||s===".") return null;
  var n=parseFloat(s);
  return isNaN(n)?null:n;
}
function intOf(v){ var n=num(v); return n===null?null:Math.round(n); }
function dateOf(v){
  if(typeof v==="number"){ var d=P()&&P().xlDate?P().xlDate(v):""; return d||""; }
  var s=txt(v);
  if(!s) return "";
  var m=/(\d{4})\s*[年.\-\/]\s*(\d{1,2})\s*[月.\-\/]\s*(\d{1,2})/.exec(s);
  if(m) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  m=/^(\d{4})(\d{2})(\d{2})$/.exec(s);
  if(m) return m[1]+"-"+m[2]+"-"+m[3];
  m=/(\d{4})\s*[年.\-\/]\s*(\d{1,2})\s*月?/.exec(s);
  if(m) return m[1]+"-"+pad(m[2])+"-01";
  return "";
}
function monthKey(v){
  if(typeof v==="number"){ var d=P()&&P().xlDate?P().xlDate(v):""; return d?d.slice(0,7):""; }
  var s=txt(v);
  if(!s) return "";
  var m=/(\d{4})\s*[年.\-\/]\s*(\d{1,2})/.exec(s);
  if(m) return m[1]+"-"+pad(m[2]);
  m=/^(\d{4})(\d{2})/.exec(s);
  if(m) return m[1]+"-"+m[2];
  return "";
}
function monthLabel(k){
  var m=/^(\d{4})-(\d{2})$/.exec(k||"");

function hdr(v){ return txt(v).replace(/[\s\n\r]/g,""); }
function normName(s){

/* ---------------- 表头识别 ---------------- */
function tables(parsed){
  var out=[];
  if(parsed.sheets) parsed.sheets.forEach(function(s){
    if(s&&s.rows&&s.rows.length) out.push({name:s.name||"",rows:s.rows});
  });
  if(parsed.blocks){
    var n=0;
    parsed.blocks.forEach(function(b){ if(b.t==="tbl"){ n++; out.push({name:"表格"+n,rows:b.rows}); } });
  }
  return out;
}
function pickTable(rows,alias){
  var best=null, i, c, f, r, h, map, hit;
  for(i=0;i<Math.min(rows.length,22);i++){
    r=rows[i]||[]; map={}; hit=0;
    for(c=0;c<r.length;c++){
      h=hdr(r[c]); if(!h) continue;
      for(f in alias){
        if(map[f]!==undefined) continue;
        if(alias[f].some(function(a){ return h.indexOf(hdr(a))>=0; })){ map[f]=c; hit++; break; }
      }
    }
    if(hit>=3&&(!best||hit>best.hit)) best={headerAt:i,map:map,hit:hit};
  }
  return best;
}
function isEmptyRow(r){
  for(var i=0;i<r.length;i++){ var v=r[i]; if(v!==null&&v!==undefined&&txt(v)!=="") return false; }
  return true;
}
function isTotalRow(r){ return txt(r&&r[0]).replace(/\s/g,"").indexOf("合计")>=0; }

/* 按别名表抽取行 */
function rowsByAlias(tb,alias,keyField){
  var pick=pickTable(tb.rows,alias);
  if(!pick) return {rows:[],pick:null};
  var out=[];
  for(var i=pick.headerAt+1;i<tb.rows.length;i++){
    var r=tb.rows[i]||[];
    if(isEmptyRow(r)||isTotalRow(r)) continue;
    var o={}, any=false;
    for(var f in pick.map){
      var v=r[pick.map[f]];
      if(v===undefined) continue;
      o[f]=v;
      if(txt(v)!=="") any=true;
    }
    if(any) out.push({raw:r,data:o,rowNo:i+1});
  }
  return {rows:out,pick:pick};
}

/* 文本型（PDF/docx 段落）标签抽取 */
function textFields(text,rules){
  var o={}, hit=0;
  Object.keys(rules).forEach(function(k){
    var al=rules[k];
    for(var i=0;i<al.length;i++){
      var re=new RegExp(al[i]+"\\s*[:：]\\s*([^\\n\\r]{1,80})");
      var m=re.exec(text);
      if(m){ o[k]=m[1].trim(); hit++; break; }
    }
  });
  return {data:o,hit:hit};
}
/* 无冒号连排的正文（Word 表格转文本、老 .doc 会议记录常见）：
   用已知标签做锚点，值取到下一个锚点为止 */
function anchorFields(text,labelMap){
  var hits=[], i;
  for(i=0;i<labelMap.length;i++){
    var it=labelMap[i];
    var label=it.label!==undefined?it.label:it[0];     /* 兼容 [标签,字段] 数组写法 */
    var field=it.field!==undefined?it.field:it[1];
    if(!label) continue;
    var idx=text.indexOf(label), guard=0;
    while(idx>=0&&guard++<3){
      hits.push({at:idx,end:idx+label.length,field:field,label:label});
      idx=text.indexOf(label,idx+label.length);
    }
  }
  hits.sort(function(a,b){ return a.at-b.at; });
  var o={}, hit=0, used={};
  for(i=0;i<hits.length;i++){
    var h=hits[i];
    if(used[h.field]) continue;
    var nx=hits[i+1];
    var stop=nx?Math.min(nx.at,h.end+140):h.end+140;
    var v=text.slice(h.end,stop)
      .replace(/^[\s:：、，,。]+/,"")
      .replace(/\s+/g," ")
      .trim();
    if(!v||v.length<1) continue;
    o[h.field]=v;
    used[h.field]=1; hit++;
  }
  return {data:o,hit:hit};
}
/* 从任意字符串里取第一个可信日期 */
function pickDate(s){
  var t=txt(s);
  if(!t) return "";
  var m=/(20\d{2})\s*[年.\-\/]\s*(\d{1,2})\s*[月.\-\/]\s*(\d{1,2})/.exec(t);
  if(m) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  m=/(20\d{2})\s*[年.\-\/]\s*(\d{1,2})\s*月?/.exec(t);
  if(m) return m[1]+"-"+pad(m[2])+"-01";
  return "";
}
/* 人名串 → 人数（"共 12 人"直接取数，否则按分隔符数人头） */
function headCount(s){
  var t=txt(s);
  if(!t) return null;
  var m=/(\d{1,3})\s*[名位]?\s*人/.exec(t);
  if(m) return +m[1];
  var parts=t.split(/[、，,;；\/\s]+/).filter(function(x){ return x.length>=2&&x.length<=12; });
  return parts.length?parts.length:null;
}

/* 正文值按模块字段做清洗（日期归一、人数、形式判定） */
function cleanDocData(route,d,text){
  var o={}, k;
  for(k in d){
    if(!Object.prototype.hasOwnProperty.call(d,k)) continue;
    var v=d[k];
    if(v===undefined||v===null||v==="") continue;
    if(k==="date"||k==="pubDate"||k==="implDate"){
      var dd=pickDate(v)||pickDate(text);
      if(dd) o[k]=dd;
      continue;
    }
    if(k==="peopleRaw"){ var n=headCount(v); if(n) o.people=n; continue; }
    if(k==="hours"||k==="count"){
      var nn=num(v); if(nn!==null) o[k]=nn; continue;
    }
    if(k==="form"){
      var s=txt(v);
      if(/线上/.test(s)&&/线下|现场/.test(s)) o.form="线上+线下";
      else if(/线上|视频|腾讯会议|钉钉/.test(s)) o.form=route==="meetings"?"线上":"线上";
      else if(/线下|现场|会议|集中/.test(s)) o.form=route==="meetings"?"线下":"集中授课";
      continue;
    }
    if(k==="content"||k==="decision"||k==="scope"||k==="conclusion"){
      var b=txt(v);
      if(b.length>300) b=b.slice(0,300)+"…";
      if(b) o[k]=b;
      continue;
    }
    var t2=txt(v);
    if(t2) o[k]=(t2.length>60?t2.slice(0,60)+"…":t2);
  }
  return o;
}

  var out=[], today=A.todayStr().slice(0,7);
  for(var i=pick.headerAt+1;i<tb.rows.length;i++){
    var r=tb.rows[i]||[];
    if(isEmptyRow(r)) continue;
    var dv=r[pick.map.date];
    var mk=monthKey(dv);
    if(!mk) continue;
    if(mk>today) continue;                       /* 未来月份不导入 */
    var d={month:monthLabel(mk),cutoff:dateOf(dv)};
    for(var f in pick.map){
      if(f==="date"||f==="rate") continue;
      var v=r[pick.map[f]];
      if(v===undefined||txt(v)==="") continue;
      d[f]=num(v);
    }
    var rate=num(r[pick.map.rate]);
    if(d.issues!==undefined||d.issues!==null){
      var iss=d.issues||0;
      if(rate!==null&&rate!==undefined){
        if(rate<=1.0001) d.fixed=Math.round(iss*rate);
        else d.fixed=Math.min(iss,Math.round(rate));
      }
    }
    var keys=Object.keys(d).filter(function(k){ return k!=="month"&&k!=="cutoff"; });
    if(!keys.length) continue;
    out.push({arr:"stats",key:mk,data:d,label:d.month,rowNo:i+1});
  }
  return out.length?{items:out,conf:"high",note:"总表 "+out.length+" 个月"}:null;
}

function adaptProjects(parsed,W){
  var tb=tables(parsed).filter(function(t){ return pickTable(t.rows,ALIAS.projects); })[0];
  if(!tb) return null;
  var pick=pickTable(tb.rows,ALIAS.projects);
  if(pick.hit<5) return null;
  var out=[];
  for(var i=pick.headerAt+1;i<tb.rows.length;i++){
    var r=tb.rows[i]||[];
    if(isEmptyRow(r)||isTotalRow(r)) continue;
    var g=function(k){ return pick.map[k]===undefined?null:r[pick.map[k]]; };
    var name=txt(g("name"));
    if(!name||name.length<4) continue;
    var d={name:name};
    var major=txt(g("major")); if(major) d.major=major;
    var dc=txt(g("dcontrol")); if(dc) d.dcontrol=(dc.indexOf("是")>=0?"是":"否");
    var fund=txt(g("fund")); if(fund) d.fund=fund;
    var amt=num(g("amount")); if(amt!==null) d.amount=amt;
    var place=txt(g("place")); if(place) d.place=place;
    var st=txt(g("status"));
    if(st) d.status=/验收/.test(st)?"已验收":/完|竣工/.test(st)?"已完工待验收":/暂停/.test(st)?"暂停":"施工实施";
    var span=txt(g("span"));
    if(span){
      var mm=/(\d{4})[.\-\/](\d{1,2})[.\-\/]?(\d{1,2})?/.exec(span);
      if(mm) d.start=mm[1]+"-"+pad(mm[2])+"-"+pad(mm[3]||1);
      var tail=span.split(/[～~至]/)[1]||"";
      var de=dateOf(tail);
      if(de) d.end=de;
    }
    var endD=dateOf(g("end")); if(endD) d.end=endD;
    var owner=txt(g("owner")); if(owner) d.owner=owner;
    var ph=txt(g("phone")); if(ph) d.phone=ph;
    var ci=txt(g("checkInfo")); if(ci) d.checkInfo=ci;
    var fi=txt(g("fixInfo")); if(fi) d.fixInfo=fi;
    var pd=txt(g("progDesc")); if(pd) d.progDesc=pd;
    var nt=txt(g("note")); if(nt) d.note=nt;
    var kd=txt(g("kind")); if(kd) d.kind=(kd.indexOf("新")>=0?"新建":"延续");
    var rv=txt(g("reviewed")); if(rv) d.reviewed=/是|已/.test(rv);
    var mp=matchProject(name);
    var key=normName(name);
    if(mp){
      /* 命中既有项目：沿用它的主键，名称以台账为准（名单里的全称常带“采购/监理”后缀） */
      key=normName(mp.name);
      delete d.name;
    }
    out.push({arr:"projects",key:key,data:d,label:name,rowNo:i+1});
  }
  if(!out.length) return null;
  var matched=0;
  /* 用原始文件名（label）而非 data.name 判定：命中既有项目时 data.name 已被移除 */
  out.forEach(function(it){ if(matchProject(it.label||it.data.name)) matched++; });
  var conf=(matched/out.length>=0.6)?"high":"low";
  return {items:out,conf:conf,note:out.length+" 个项目（已匹配 "+matched+"）"};
}

function matchProject(name){
  var n=normName(name), list=DB().projects||[];
  var best=null;
  for(var i=0;i<list.length;i++){
    var b=normName(list[i].name);
    if(!b) continue;
    if(b===n) return list[i];
    if(b.length>=8&&n.length>=8&&(b.indexOf(n)>=0||n.indexOf(b)>=0)){ best=list[i]; continue; }
    var head=b.slice(0,10);
    if(head.length>=8&&n.indexOf(head)>=0&&!best) best=list[i];
  }
  return best;
}

/* 状态归一：把表里各种写法映射回状态机的 5 个合法值，映射不上则返回空（不写入） */
function normInsp(s){
  s=txt(s); if(!s) return "";
  if(/复核退回|退回|不通过|未通过/.test(s)) return "复核退回";
  if(/已闭环|闭环|已完成|已整改/.test(s)) return "已闭环";
  if(/待复核|已回复|已报送|回复单已/.test(s)) return "已回复待复核";
  if(/整改中|进行中|催办/.test(s)) return "整改中";
  if(/待整改|未整改|新下发/.test(s)) return "待整改";
  return "";
}
/* ---------- 源文件位置标识 ----------
   取值规则（写入问题行 srcLoc 字段）：
     T{m}·R{n}  第 m 张表格的第 n 行（rows 数组 1 起算，含表头行）
     L{n}       正文第 n 行（parsed.text 按换行切分，1 起算）
   空值表示该行不是从文件抽取的（手工录入），界面显示「手工」          */
function locTable(idx,row){ return "T"+idx+"·R"+row; }
function locLine(n){ return "L"+n; }

function adaptInspect(parsed){
  var out=[];

      var dl=dateOf(g("deadline")); if(dl) d.deadline=dl;
      var rp=dateOf(g("reportDate")); if(rp) d.reportDate=rp;
      var vr=txt(g("verifyResult"));
      if(vr) d.verifyResult=vr.indexOf("不到位")>=0?"整改不到位":vr.indexOf("部分")>=0?"部分整改":
        (vr.indexOf("整改")>=0?"已按要求整改":"待复核");
      var rv=txt(g("reviewer")); if(rv) d.reviewer=rv;
      var rd=dateOf(g("reviewDate")); if(rd) d.reviewDate=rd;
      var cc=txt(g("conclusion")); if(cc) d.conclusion=cc.indexOf("不合格")>=0?"不合格":cc.indexOf("基本")>=0?"基本合格":"合格";
      var ic=intOf(g("issueCount")); if(ic!==null) d.issueCount=ic;
      var fc=intOf(g("fixedCount")); if(fc!==null) d.fixedCount=fc;

    }
  }
  var tb2=tbs.filter(function(t){ return pickTable(t.rows,ALIAS.issues); })[0];
  if(tb2){
    var tIdx=tbs.indexOf(tb2)+1;   /* 1 起算，与「第 N 张表格」一致 */
    var p2=pickTable(tb2.rows,ALIAS.issues);
    for(var j=p2.headerAt+1;j<tb2.rows.length;j++){
      var r2=tb2.rows[j]||[];
      if(isEmptyRow(r2)) continue;
      var g2=function(k){ return p2.map[k]===undefined?null:r2[p2.map[k]]; };
      var no2=txt(g2("no")), desc=txt(g2("desc"));
      if(!no2&&!desc) continue;
      var d2={no:no2||("问题"+j),desc:desc||no2};
      var sq=txt(g2("seq")); if(sq) d2.seq=sq;
      var dl=dateOf(g2("deadline")); if(dl) d2.deadline=dl;
      var fnd=dateOf(g2("finishDate")); if(fnd) d2.finishDate=fnd;

      var sv=txt(g2("status")); if(sv&&normInsp(sv)) d2.status=normInsp(sv);
